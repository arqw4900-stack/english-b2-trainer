<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>English B2 Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400&family=Literata:wght@400;600&display=swap">
<style>
/* Layout: phone-first single column, fixed bottom tab bar, one task on screen at a time.
   Look: a study notebook — ruled paper, fountain-pen blue ink, highlighter marks for progress. */
:root{
  --bg:#f2f5f9; --surface:#ffffff; --raise:#eef2f7; --ink:#172238; --muted:#5b687e; --line:#dce3ec; --rule:#e6edf6;
  --primary:#2d5bd7; --on-primary:#ffffff; --accent-soft:#e4ecff;
  --hl:#ffe46b; --hl-soft:#fff6cc; --hl-good:#a8eec6; --learning:#e5ad06;
  --good:#1a9862; --good-soft:#dbf5e7; --bad:#d4453a; --bad-soft:#fde7e3;
  --toast:#172238; --toast-ink:#ffffff; --scrim:rgba(14,21,34,.45);
  --shadow:0 1px 2px rgba(23,34,56,.05),0 8px 20px -10px rgba(23,34,56,.18);
  --bs:85%; --bl:93%; --ts:55%; --tl:34%;
  --display:"Unbounded",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,sans-serif;
  --read:"Literata",Georgia,"Times New Roman",serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --r:18px; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1522; --surface:#162032; --raise:#1d2940; --ink:#e8eef8; --muted:#9ba8be; --line:#2a3750; --rule:#1c273a;
  --primary:#86a6ff; --on-primary:#0e1522; --accent-soft:#1f2c50;
  --hl:rgba(255,213,74,.36); --hl-soft:rgba(255,213,74,.13); --hl-good:rgba(82,208,143,.34); --learning:#e5b93a;
  --good:#52d08f; --good-soft:#143428; --bad:#ff7f72; --bad-soft:#3a1d1e;
  --toast:#e8eef8; --toast-ink:#0e1522; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -10px rgba(0,0,0,.6);
  --bs:38%; --bl:22%; --ts:80%; --tl:78%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1522; --surface:#162032; --raise:#1d2940; --ink:#e8eef8; --muted:#9ba8be; --line:#2a3750; --rule:#1c273a;
  --primary:#86a6ff; --on-primary:#0e1522; --accent-soft:#1f2c50;
  --hl:rgba(255,213,74,.36); --hl-soft:rgba(255,213,74,.13); --hl-good:rgba(82,208,143,.34); --learning:#e5b93a;
  --good:#52d08f; --good-soft:#143428; --bad:#ff7f72; --bad-soft:#3a1d1e;
  --toast:#e8eef8; --toast-ink:#0e1522; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -10px rgba(0,0,0,.6);
  --bs:38%; --bl:22%; --ts:80%; --tl:78%; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(100px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.app{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:500;font-size:1.1rem}
h3{font-size:1rem;font-weight:800}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}
.mt{margin-top:4px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px}
.lvl{display:inline-block;background:var(--hl);color:var(--ink);font-family:var(--display);font-weight:700;font-size:.8rem;padding:2px 8px;border-radius:6px;transform:rotate(-4deg)}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;transition:transform .15s var(--ease),border-color .15s}
.iconbtn:hover{border-color:var(--primary)}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s var(--ease)}
#settings:hover svg{transform:rotate(60deg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
/* highlighter mark: the page's signature, swipes in like a marker stroke */
.mark{background:linear-gradient(var(--hl),var(--hl)) no-repeat 0 88%/100% 45%;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 3px}
/* hero: a ruled notebook page */
.hero{background:var(--surface) repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);border:1px solid var(--line);border-radius:22px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;box-shadow:var(--shadow)}
.hero h2{font-size:1.25rem;line-height:1.4}
.ring{width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .track{stroke:var(--raise)}
.ring .arc{stroke:var(--primary);stroke-linecap:round}
.ring.full .arc{stroke:var(--good)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.1}
.ring .lbl small{display:block;font-family:var(--body);font-weight:600;font-size:.65rem;color:var(--muted)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;grid-column:1/-1}
.stat{background:var(--raise);border-radius:14px;padding:10px;min-width:0}
.stat b{display:flex;align-items:center;gap:5px;font-family:var(--display);font-size:1.15rem;font-weight:700}
.stat b svg{width:16px;height:16px;fill:var(--learning);stroke:none}
.stat span{font-size:.75rem;color:var(--muted)}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;transition:transform .15s var(--ease),box-shadow .2s,border-color .2s,filter .2s}
.btn:active:not([disabled]){transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--on-primary);box-shadow:0 8px 18px -10px var(--primary)}
.btn.primary:hover:not([disabled]){filter:brightness(1.07);box-shadow:0 12px 24px -12px var(--primary)}
.btn.ghost{background:var(--raise);border:1px solid var(--line)}
.btn.ghost:hover:not([disabled]){border-color:var(--primary)}
.btn.bad{background:var(--surface);color:var(--bad);border:2px solid var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none}
.hero .btn{grid-column:1/-1}
.row{display:flex;gap:10px} .row>*{flex:1;min-width:0}
.list{display:flex;flex-direction:column;gap:8px}
.theme{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;width:100%;transition:transform .18s var(--ease),border-color .18s,box-shadow .18s}
.theme:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:var(--shadow)}
.theme:active{transform:scale(.985)}
.badge{--h:220;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.8rem;background:hsl(var(--h) var(--bs) var(--bl));color:hsl(var(--h) var(--ts) var(--tl));transition:transform .25s var(--ease)}
.theme:hover .badge{transform:rotate(-6deg) scale(1.06)}
.badge svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.theme .meta{min-width:0}
.theme .t{font-weight:800;line-height:1.25}
.bar{height:6px;background:var(--raise);border-radius:9px;overflow:hidden;display:flex;margin-top:6px}
.bar i{height:100%;display:block;transition:width .6s var(--ease)}
.chev{color:var(--muted);font-size:1.2rem;transition:transform .18s var(--ease)}
.theme:hover .chev{transform:translateX(3px)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:.75rem;font-weight:700;background:var(--raise);border:1px solid var(--line);white-space:nowrap}
.pill.due{background:var(--hl-soft);border-color:transparent}
.pill.ok{background:var(--good-soft);border-color:transparent}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:4px}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs button{border:0;background:transparent;border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:700;color:var(--muted);transition:color .2s,background-color .2s}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--primary);background:var(--accent-soft)}
/* study */
.study-top{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--primary);border-radius:9px;transition:width .35s var(--ease)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px 20px 26px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;position:relative;min-height:230px;justify-content:center;box-shadow:var(--shadow)}
.card .kind{position:absolute;top:14px;left:16px}
.word{font-family:var(--display);font-weight:500;font-size:clamp(1.6rem,7.5vw,2.4rem);line-height:1.15;overflow-wrap:anywhere}
.word.ru{font-family:var(--body);font-weight:800;font-size:clamp(1.4rem,6.5vw,2rem)}
.ipa{font-family:var(--mono);color:var(--muted);font-size:.95rem}
.trans{font-size:1.2rem;font-weight:800}
.ex{color:var(--muted);font-style:italic;max-width:44ch}
.opts{display:grid;gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;text-align:left;font-weight:600;min-height:54px;overflow-wrap:anywhere;transition:border-color .15s,background-color .15s,transform .15s var(--ease)}
.opt:hover:not([disabled]){border-color:var(--primary);transform:translateY(-1px)}
.opt:active:not([disabled]){transform:scale(.98)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.typein{width:100%;border:2px solid var(--line);border-radius:14px;padding:14px;background:var(--raise);font-size:1.15rem;text-align:center;transition:border-color .15s}
.typein:focus{border-color:var(--primary);outline:0}
.typein.ok{border-color:var(--good)} .typein.no{border-color:var(--bad)}
.fb{border-radius:14px;padding:12px 14px;font-weight:600}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb b{font-family:var(--display);font-weight:500}
.why{margin-top:10px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--ink) 14%,transparent);font-weight:500;line-height:1.5}
.why-h{display:block;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.kbd-hint{font-size:.75rem;color:var(--muted);text-align:center}
/* words list */
.search{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);transition:border-color .15s}
.search:focus{border-color:var(--primary);outline:0}
.wl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wrow{border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow summary{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;padding:11px 14px;cursor:pointer;list-style:none;transition:background-color .15s}
.wrow summary::-webkit-details-marker{display:none}
.wrow summary:hover{background:var(--raise)}
.wrow summary::after{content:"›";color:var(--muted);font-size:1.2rem;transition:transform .2s var(--ease)}
.wrow[open] summary::after{transform:rotate(90deg)}
.wrow .en{font-weight:800}
.wrow .ru{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.exw{padding:0 14px 12px 36px;color:var(--muted);font-style:italic}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.l{background:var(--learning)} .dot.k{background:var(--good)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
/* tenses */
.tgrid-wrap{overflow-x:auto}
.tgrid{display:grid;grid-template-columns:auto repeat(3,minmax(88px,1fr));gap:6px;min-width:340px}
.tgrid .h{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px}
.tgrid .rh{font-size:.72rem;font-weight:700;color:var(--muted);display:flex;align-items:center;padding-right:4px}
.tcell{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 8px;text-align:left;min-height:64px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;transition:transform .18s var(--ease),border-color .18s}
.tcell:hover{transform:translateY(-2px);border-color:var(--primary)}
.tcell b{font-size:.82rem;line-height:1.2}
.tcell .sc{font-size:.72rem;color:var(--muted)}
.tcell.done{border-color:var(--good);background:var(--good-soft)}
.formula{display:grid;gap:6px}
.formula div{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:baseline;background:var(--raise);border-radius:10px;padding:8px 10px}
.formula span{font-family:var(--display);font-weight:700;text-align:center}
.formula code{font-family:var(--mono);font-size:.88rem;overflow-wrap:anywhere}
ul.use{margin:0;padding-left:20px;display:grid;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;border-radius:99px;background:var(--hl-soft);font-size:.85rem;font-weight:600;font-family:var(--mono)}
.exm{padding:10px 0;border-top:1px solid var(--line)}
.exm:first-child{border-top:0}
.tip{background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:.95rem}
.sentence{font-size:1.2rem;font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--primary);margin:0 2px}
.filled{background:linear-gradient(var(--hl-good),var(--hl-good)) no-repeat 0 90%/100% 50%;padding:0 3px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;font-weight:700;color:var(--muted);padding:4px 0;align-self:flex-start;transition:color .15s}
.back:hover{color:var(--ink)}
.back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;transition:transform .18s var(--ease)}
.back:hover svg{transform:translateX(-3px)}
/* reading */
.reader{display:grid;gap:14px;padding:22px 20px}
.reader p{margin:0;font-family:var(--read);font-size:1.1rem;line-height:1.75;max-width:62ch}
.gl{all:unset;cursor:pointer;border-bottom:2px dotted var(--primary);background:linear-gradient(var(--hl),var(--hl)) no-repeat 0 92%/0 50%;transition:background-size .35s var(--ease),background-color .15s}
.gl:hover{background-color:var(--hl-soft)}
.gl.on{background-size:100% 50%}
.gl:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.glpop{position:fixed;z-index:30;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 16px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.glpop b{font-family:var(--read);font-size:1.05rem}
.glpop .iconbtn{width:34px;height:34px}
.readbar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--primary);z-index:25;transition:width .1s linear}
.q{display:grid;gap:8px}
.qt{font-weight:800}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:grid;gap:14px;max-height:85vh;overflow:auto}
.field{display:grid;gap:6px}
.seg{display:flex;background:var(--raise);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 4px;font-weight:700;font-size:.9rem;transition:background-color .2s,box-shadow .2s}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.sync{font-size:.75rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.on i{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.done-card{text-align:center;display:grid;gap:12px;justify-items:center}
.big{font-family:var(--display);font-weight:700;font-size:2.4rem;line-height:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--toast);color:var(--toast-ink);padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;font-size:.9rem;max-width:90vw}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;animation:fall 1.5s cubic-bezier(.3,.5,.6,1) both}
@media (min-width:640px){.opts.two{grid-template-columns:1fr 1fr}}
/* motion: decorative only, switched off when the viewer prefers reduced motion */
@media (prefers-reduced-motion:no-preference){
  .app>*{animation:rise .4s var(--ease) both;animation-delay:calc(var(--i,0) * 40ms)}
  .app .list>*{animation:rise .4s var(--ease) both;animation-delay:calc(var(--i,0) * 35ms + 60ms)}
  .app>.card{animation-name:cardIn}
  .mark{animation:swipe .8s .3s var(--ease) both}
  .filled{animation:swipe .5s var(--ease) both}
  .ring .arc{animation:ringIn 1.1s .15s var(--ease) both}
  .opt.right{animation:pop .4s var(--ease)}
  .opt.wrong,.typein.no{animation:shake .4s}
  .fb,#fb .tip{animation:rise .3s var(--ease) both}
  .big{animation:pop .5s var(--ease)}
  .wrow[open] .exw{animation:rise .25s var(--ease)}
  nav.tabs button[aria-current="page"] svg{animation:tabpop .4s var(--ease)}
  .sheet-bg{animation:fade .2s}
  .sheet{animation:sheetUp .32s var(--ease)}
  .toast,.glpop{animation:floatIn .28s var(--ease)}
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateX(24px) rotate(1deg)}to{opacity:1;transform:none}}
@keyframes swipe{from{background-size:0 50%}}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
@keyframes pop{40%{transform:scale(1.04)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes tabpop{40%{transform:translateY(-3px) scale(1.12)}}

 examples:[["I've lost my keys.","Я потерял ключи (и сейчас их нет)."],["Have you ever been to Japan?","Ты когда-нибудь был в Японии?"],["She has lived here since 2015.","Она живёт здесь с 2015 года."]],
 tip:"Если указано точное время в прошлом (yesterday, in 2020, last week) — используйте Past Simple, а не Present Perfect.",
 ex:[
 "I ___ (already / finish) my homework.|have already finished|already finished|had already finished|am already finishing##already — маркер Present Perfect: результат есть сейчас. already ставится между have и третьей формой: have already finished.",
 "___ you ever ___ (be) to London?|Have … been|Did … be|Were … being|Had … been##ever — вопрос о жизненном опыте, значит Present Perfect. «Бывать где-то» = have been to.",
 "She ___ (live) here since 2015.|has lived|lives|lived|is living##since 2015 — действие началось в прошлом и длится до сих пор, поэтому Present Perfect: has lived. По-русски «живёт», но Present Simple здесь ошибка.",
 "They ___ (not / arrive) yet.|haven't arrived|didn't arrive|aren't arriving|hadn't arrived##yet в отрицании — маркер Present Perfect: «ещё не приехали» = haven't arrived.",
 "I ___ (just / see) your brother.|have just seen|just saw|had just seen|just see##just = «только что», это Present Perfect. see — неправильный глагол: see – saw – seen.",
 "We ___ (know) each other for ten years.|have known|know|knew|are knowing##for ten years и до сих пор — Present Perfect. know — глагол состояния, поэтому не Continuous: have known.",
 "He ___ (break) his leg, so he can't walk.|has broken|broke|is breaking|breaks##Важен результат сейчас (он не может ходить), а время не указано — Present Perfect: has broken.",
 "How many books ___ you ___ (read) this year?|have … read|did … read|are … reading|had … read##this year ещё не закончился — Present Perfect: How many books have you read?",
 "I ___ (never / try) sushi.|have never tried|never try|am never trying|had never try##never о жизненном опыте до сегодняшнего дня — Present Perfect: have never tried.",
 "She ___ (lose) her phone yesterday.|lost|has lost|has losing|had lose#pas#Указано время в прошлом (yesterday), значит Past Simple, а не Present Perfect. lose – lost – lost."]},
{id:"ppc",group:"Present",name:"Present Perfect Continuous",ru:"Настоящее совершённое длительное",
 formula:{"+":"I have been working · she has been working","−":"I haven't been working","?":"Have you been working?"},
 use:["Действие длится с прошлого до сейчас (акцент на длительности)","Недавнее длительное действие с видимым результатом"],
 markers:["for","since","all day","how long","lately","recently"],
 examples:[["I've been waiting for an hour.","Я жду уже час."],["She's been crying — her eyes are red.","Она плакала — у неё красные глаза."],["How long have you been learning English?","Как долго ты учишь английский?"]],
 tip:"Present Perfect = результат (I've written 3 letters). Present Perfect Continuous = процесс (I've been writing letters all morning).",
 ex:[
 "I ___ (wait) for you for two hours!|have been waiting|wait|am waiting|waited##for two hours, и ожидание продолжается сейчас. Акцент на длительности — Present Perfect Continuous: have been waiting.",
 "It ___ (rain) all day.|has been raining|rains|is raining|rained##all day — дождь шёл весь день до этого момента, важен процесс: has been raining.",
 "How long ___ you ___ (learn) English?|have … been learning|are … learning|do … learn|did … learn##How long спрашивает, сколько длится действие до сих пор, — Present Perfect Continuous. По-русски «учишь», но в английском не Present Simple.",
 "She's tired because she ___ (run).|has been running|runs|is run|had ran##Видим результат сейчас (устала) от недавнего долгого действия — has been running.",
 "They ___ (work) on this project since March.|have been working|work|are working|worked##since March, и работа ещё идёт — have been working.",
 "Your hands are dirty. What ___ you ___ (do)?|have … been doing|do … do|did … do|are … done##Видим след (грязные руки) недавнего процесса — What have you been doing?",
 "We ___ (not / sleep) well lately.|haven't been sleeping|don't sleep|didn't sleep|aren't sleep##lately — период до сегодняшнего дня, речь о процессе: haven't been sleeping.",
 "He ___ (play) computer games all afternoon.|has been playing|plays|is playing|played##all afternoon — длительность до текущего момента: has been playing.",
 "I ___ (think) about changing jobs recently.|have been thinking|think|thought|am think##recently + процесс, который продолжается. think в значении «обдумывать» может быть в Continuous: have been thinking.",
 "She ___ (teach) for twenty years and she still loves it.|has been teaching|teaches|is teaching|taught##for twenty years, и она преподаёт до сих пор (still) — has been teaching."]},
{id:"pas",group:"Past",name:"Past Simple",ru:"Прошедшее простое",
 formula:{"+":"I worked · I went (неправильные глаголы)","−":"I didn't work · I didn't go","?":"Did you work? · Did you go?"},
 use:["Завершённое действие в прошлом в известное время","Последовательность действий в прошлом","Прошлые привычки"],
 markers:["yesterday","last week","ago","in 2010","when I was a child","then"],
 examples:[["I visited Paris last year.","Я ездил в Париж в прошлом году."],["She got up, had breakfast and left.","Она встала, позавтракала и ушла."],["We didn't see him yesterday.","Мы не видели его вчера."]],
 tip:"После did / didn't глагол всегда в начальной форме: Did you go? (а не Did you went?).",
 ex:[
 "We ___ (go) to Italy last summer.|went|have gone|go|were going##last summer — точное время в прошлом, значит Past Simple. go – went – gone.",
 "She ___ (not / call) me yesterday.|didn't call|hasn't called|doesn't call|didn't called##yesterday — Past Simple. После didn't глагол в начальной форме: didn't call, а не didn't called.",
 "When ___ you ___ (buy) this car?|did … buy|have … bought|do … buy|did … bought##When спрашивает о конкретном моменте в прошлом — Past Simple, а не Present Perfect. После did — начальная форма: buy.",
 "I ___ (meet) him three years ago.|met|have met|meet|had meet##ago — маркер Past Simple. meet – met – met.",
 "He ___ (lose) his wallet on the bus yesterday.|lost|losed|has lose|loses##yesterday — законченное событие в прошлом, Past Simple. lose – lost – lost, формы losed не бывает.",
 "They ___ (be) at home last night.|were|was|have been|are##last night — Past Simple. С they — were, was ставится только с I/he/she/it.",
 "Shakespeare ___ (write) Hamlet.|wrote|has written|writes|was writing##Событие целиком в прошлом (Шекспира давно нет), поэтому Past Simple: write – wrote – written.",
 "I ___ (not / understand) the question, so I asked the teacher.|didn't understand|haven't understand|don't understood|didn't understood##Ситуация в прошлом (потом спросил учителя) — Past Simple: didn't + начальная форма understand.",
 "___ she ___ (enjoy) the party last night?|Did … enjoy|Has … enjoyed|Does … enjoy|Did … enjoyed##last night — вечеринка уже прошла, Past Simple. Вопрос: Did + начальная форма enjoy.",
 "He ___ (come) home, ___ (take) a shower and went to bed.|came … took|has come … took|was coming … was taking|comes … takes##Цепочка действий одно за другим в прошлом — всё в Past Simple: came, took, went."]},
{id:"pac",group:"Past",name:"Past Continuous",ru:"Прошедшее длительное",
 formula:{"+":"I/he was working · we/they were working","−":"I wasn't working · they weren't working","?":"Were you working? · Was she working?"},
 use:["Действие в процессе в определённый момент в прошлом","Фон для другого действия (when …)","Два параллельных действия (while …)"],
 markers:["at 5 p.m. yesterday","while","when","all evening","at that moment"],
 examples:[["I was sleeping when you called.","Я спал, когда ты позвонил."],["At 8 p.m. we were having dinner.","В 8 вечера мы ужинали."],["While she was cooking, he was reading.","Пока она готовила, он читал."]],
 tip:"Длинное действие — Past Continuous, короткое, которое его прервало — Past Simple.",
 ex:[
 "I ___ (watch) TV when the phone rang.|was watching|watched|am watching|have watched##Длинное действие (смотрел ТВ) прервано коротким (зазвонил телефон): длинное — Past Continuous, короткое — Past Simple.",
 "At 9 p.m. yesterday we ___ (have) dinner.|were having|had|have had|are having##Конкретный момент в прошлом (в 9 вечера вчера), ужин был в процессе — were having.",
 "While she ___ (cook), he was cleaning.|was cooking|cooked|cooks|has cooked##While + два параллельных процесса в прошлом — оба в Past Continuous.",
 "What ___ you ___ (do) at midnight? I called, but you didn't answer.|were … doing|did … do|are … doing|have … done##Спрашиваем, что происходило в конкретный момент в прошлом (когда звонили), — What were you doing?",
 "It ___ (rain) when we left the house.|was raining|rained|rains|has rained##Фон в момент события: дождь уже шёл, когда мы вышли, — was raining.",
 "They ___ (not / listen) to the teacher when she explained the rule.|weren't listening|didn't listened|wasn't listening|haven't listen##Процесс в момент объяснения — Past Continuous. С they — weren't, wasn't только для I/he/she/it.",
 "He ___ (drive) home when he saw the accident.|was driving|drove|drives|has driven##Длинное действие (ехал) + короткое событие (увидел аварию) — was driving.",
 "The sun ___ (shine) and the birds were singing.|was shining|shone|shines|has shone##Описание фона, обстановки в прошлом — Past Continuous, как и were singing.",
 "I ___ (walk) in the park when I met Anna.|was walking|walked|am walking|have walked##Процесс (гулял) прерван событием (встретил Анну) — was walking.",
 "When I arrived, she ___ (talk) on the phone.|was talking|talked|talks|has talked##Когда я пришёл, разговор уже шёл — was talking. talked значило бы, что она начала говорить после моего прихода."]},
{id:"pap",group:"Past",name:"Past Perfect",ru:"Прошедшее совершённое",
 formula:{"+":"I/he/they had done","−":"I hadn't done","?":"Had you done?"},
 use:["Действие произошло раньше другого действия в прошлом","«Прошлое в прошлом»","В третьем условном (If I had known…)"],
 markers:["before","after","already","by the time","when","never … before"],
 examples:[["When I arrived, the train had left.","Когда я приехал, поезд уже ушёл."],["She had never seen snow before.","Она никогда раньше не видела снег."],["By 10 p.m. we had finished.","К 10 вечера мы закончили."]],
 tip:"Сравните: When I arrived, the film started (начался при мне) / had started (начался до меня).",
 ex:[
 "When we got to the cinema, the film ___ (start).|had started|started|has started|was start##Фильм начался раньше, чем мы пришли, — «прошлое в прошлом»: had started.",
 "She ___ (never / fly) before that trip.|had never flown|never flew|has never flown|was never flying##before that trip — опыт до момента в прошлом, поэтому Past Perfect. fly – flew – flown.",
 "By the time he arrived, we ___ (eat) everything.|had eaten|ate|have eaten|were eating##By the time + прошлое: действие уже завершилось к тому моменту — had eaten.",
 "I didn't know him because I ___ (not / meet) him before.|hadn't met|didn't meet|haven't met|wasn't meeting##Не встречались раньше того момента в прошлом, когда «не знал», — hadn't met.",
 "___ you ___ (finish) the report before the meeting?|Had … finished|Have … finished|Did … finished|Were … finishing##Встреча — момент в прошлом, спрашиваем, было ли сделано до неё, — Had you finished?",
 "He was sad because he ___ (fail) the exam.|had failed|has failed|fails|was failing##Причина (провалил экзамен) случилась раньше состояния (грустил) — had failed.",
 "After she ___ (do) her homework, she went out.|had done|has done|was doing|does##After: сначала сделала уроки, потом ушла. Более раннее действие — had done.",
 "The shop ___ (close) when I got there.|had closed|has closed|closes|is closed##Магазин закрылся до того, как я пришёл, — had closed.",
 "They ___ (live) in Paris before they moved to Rome.|had lived|have lived|live|are living##Жизнь в Париже была раньше переезда, который тоже в прошлом, — had lived.",
 "If I ___ (know), I would have helped.|had known|knew|have known|would know##Третий тип условных предложений (нереальное прошлое): If + Past Perfect, would have + третья форма."]},
{id:"papc",group:"Past",name:"Past Perfect Continuous",ru:"Прошедшее совершённое длительное",
 formula:{"+":"I had been working","−":"I hadn't been working","?":"Had you been working?"},
 use:["Длительное действие до определённого момента в прошлом","Причина состояния в прошлом"],
 markers:["for","since","how long","before","by the time","all day"],
 examples:[["I had been waiting for an hour when she came.","Я ждал уже час, когда она пришла."],["He was tired because he had been running.","Он устал, потому что бегал."],["They had been living there for years.","Они жили там много лет (до того момента)."]],
 tip:"Это «Present Perfect Continuous, сдвинутый в прошлое»: указывает длительность до момента в прошлом.",
 ex:[
 "She ___ (work) there for ten years before she quit.|had been working|has been working|was working|worked##for ten years до момента в прошлом (уволилась) — длительность: had been working.",
 "His eyes were red — he ___ (cry).|had been crying|has been crying|cried|was cry##След в прошлом (глаза были красными) от долгого действия до этого — had been crying.",
 "We ___ (walk) for hours when we found the village.|had been walking|have been walking|walked|are walking##for hours до момента в прошлом (нашли деревню) — had been walking.",
 "How long ___ you ___ (wait) before the bus came?|had … been waiting|have … been waiting|did … wait|were … waited##How long + до момента в прошлом (пришёл автобус) — had you been waiting.",
 "The ground was wet. It ___ (rain).|had been raining|has been raining|rains|is raining##Земля была мокрой (в прошлом) из-за дождя, который шёл до этого, — had been raining.",
 "They ___ (argue) all evening, so the mood was tense.|had been arguing|have been arguing|argue|are arguing##Долгий процесс до момента в прошлом стал причиной напряжения — had been arguing.",
 "I ___ (not / sleep) well, so I felt terrible.|hadn't been sleeping|haven't been sleeping|don't sleep|wasn't slept##Долгая причина состояния в прошлом (felt terrible) — hadn't been sleeping.",
 "He ___ (study) English for two years before he moved to London.|had been studying|has been studying|studies|is studying##for two years до переезда (момент в прошлом) — had been studying.",
 "She was out of breath because she ___ (run).|had been running|has been running|runs|was run##Запыхалась (в прошлом) от бега до этого — had been running. Сравните с настоящим: she's out of breath — she has been running.",
 "By 2020 they ___ (live) together for a decade.|had been living|have been living|lived|are living##By 2020 (момент в прошлом) + for a decade — had been living."]},
{id:"fs",group:"Future",name:"Future Simple (will)",ru:"Будущее простое",
 formula:{"+":"I/he/they will work","−":"I won't (will not) work","?":"Will you work?"},
 use:["Спонтанное решение в момент речи","Предсказание, мнение (I think …)","Обещания, предложения, угрозы","Факты о будущем"],
 markers:["tomorrow","next week","soon","in 2030","I think","probably","I'm sure"],
 examples:[["I'll help you with your bags.","Я помогу тебе с сумками."],["I think it will rain.","Думаю, будет дождь."],["I won't tell anyone.","Я никому не скажу."]],
 tip:"После when, if, as soon as, before в значении будущего — Present Simple: When he comes, I'll call you.",
 ex:[
 "It's cold. I ___ (close) the window.|'ll close|am closing|close|closed##Решение принято прямо в момент речи (стало холодно) — will: I'll close.",
 "I think it ___ (rain) tomorrow.|will rain|rains|is raining|rained##I think + прогноз-мнение о будущем — will rain.",
 "I promise I ___ (not / tell) anyone.|won't tell|don't tell|am not telling|didn't tell##Обещание — will. Отрицание: won't (= will not) + tell.",
 "___ you ___ (help) me with this box?|Will … help|Do … help|Are … help|Did … help##Просьба о помощи — Will you help me…?",
 "When she ___ (arrive), I'll call you.|arrives|will arrive|arrived|is arrive#ps#После when, if, as soon as в значении будущего ставится Present Simple, а will — только в главной части: When she arrives, I'll call.",
 "I'm sure you ___ (pass) the exam.|will pass|pass|are passing|passed##I'm sure — уверенный прогноз, значит will pass.",
 "If it ___ (rain), we'll stay at home.|rains|will rain|rained|is raining#ps#Условие с if о будущем — Present Simple: If it rains, we'll stay. will в части с if не ставится.",
 "Don't worry, I ___ (pay) for dinner.|'ll pay|pay|am paid|paid##Спонтанное предложение, решение в момент речи — I'll pay.",
 "In 2050 people ___ (live) longer.|will live|live|are living|lived##Предсказание о далёком будущем — will live.",
 "The phone's ringing — I ___ (answer) it.|'ll answer|answer|am answer|answered##Решение в момент речи (телефон звонит прямо сейчас) — I'll answer."]},
{id:"gt",group:"Future",name:"Be going to",ru:"Намерение / очевидный прогноз",

 ex:[

 "She ___ (have) a baby in May.|is going to have|has|had|have##Будущее уже очевидно сейчас — is going to have.",

 "What ___ you ___ (do) this weekend?|are … going to do|will … doing|do … going|did … do##Спрашиваем о планах — What are you going to do?",
 "Watch out! You ___ (fall)!|are going to fall|fall|fell|are fall##Видим, что сейчас произойдёт (человек вот-вот упадёт), — are going to fall.",
 "They ___ (move) to Berlin — they've already found a flat.|are going to move|will move|move|moved##План, к которому уже готовятся (квартира найдена), — are going to move.",
 "He ___ (start) a new job on Monday — it's all arranged.|is going to start|will starting|start|started##Решённый план — is going to start. Present Continuous (is starting) тоже подошёл бы, но его нет среди вариантов.",
 "I ___ (call) her tonight to apologise.|am going to call|call|called|am call##Намерение, принятое заранее (решил извиниться), — am going to call.",
 "The team is losing 4–0. They ___ (lose) the match.|are going to lose|lose|lost|are lose##Прогноз по текущей ситуации (счёт 4:0) — are going to lose."]},

{id:"interview",title:"The Interview",ru:"Собеседование",topic:"Работа",level:"B1",
 text:["Maya had been looking for a job for three months when she finally got an invitation to an interview at a small design studio. The night before, she couldn’t sleep. She kept imagining all the difficult questions they might ask.",
 "In the morning she arrived twenty minutes early, which gave her time to calm down. The manager, a friendly woman called Helen, started with a simple question: “Why do you want to work here?” Maya had prepared a perfect answer, but suddenly she forgot every word. So she decided to be honest. She said that she loved the studio’s projects and wanted to learn from people who were better than her.",
 "Then Helen asked about her weaknesses. Maya admitted that she sometimes worked too slowly because she wanted everything to be perfect. To her surprise, Helen smiled. “That’s not always a bad thing,” she said.",

{id:"coffee",title:"The Coffee Cart",ru:"Кофейная тележка",topic:"Деньги и бизнес",level:"B1",
 text:["When Tom lost his office job, he decided to try something he had always dreamed about: running his own business. He didn’t have much money, so instead of opening a café, he bought an old coffee cart and repaired it himself.",
 "At first, things were hard. Tom made a careful budget and wrote down every expense, from coffee beans to paper cups. In the first month he earned almost nothing. On rainy days nobody came at all.",
 "Then he noticed something. Every morning, dozens of students walked past his cart on their way to the university, but most of them were in a hurry. So Tom started taking orders online. Students could pay in advance and simply pick up their coffee without waiting in a queue.",
 "The idea worked. Within six months his income had doubled, and he was able to pay back the small loan he had taken from the bank. Now he is thinking about buying a second cart. “The most important lesson,” Tom says, “is to listen to your customers. They will tell you what they need.”"],

{id:"park",title:"The Park Debate",ru:"Спор о парке",topic:"Общество",level:"B2",
 text:["For years there had been an empty piece of land in the centre of the small town of Millbrook. Last spring, the local council announced two possible plans for it: a new car park or a public garden.",
 "The debate divided the town. Shop owners supported the car park. They argued that visitors needed somewhere to leave their cars; otherwise they would go shopping in the city instead. Parents and older residents wanted the garden, a safe and quiet place where children could play and neighbours could meet.",
 "The council organised a public meeting. More than three hundred people came, which was a record for Millbrook. People listened to each other, and sometimes they shouted. In the end, a teenager called Lily suggested a compromise: a smaller car park on one side and a garden on the other, with a row of trees between them.",
 "The idea was put to a vote, and it won easily. Today the garden is full of flowers, and the shop owners admit that business is better than ever. Many people say that the most valuable result was not the garden itself, but the fact that the whole town had learned to discuss problems together."],
 gloss:{"local council":"местный совет","announced":"объявил","debate":"спор, дебаты","divided":"разделил","argued":"утверждали","residents":"жители","compromise":"компромисс","put to a vote":"поставили на голосование","valuable":"ценный"},
 q:[["Why did shop owners want a car park?","They were afraid visitors would shop elsewhere","They wanted to park their own cars","They didn’t like gardens"],
    ["Who suggested the compromise?","A teenager","The mayor","A shop owner"],
    ["What do many people see as the most valuable result?","The town learned to discuss problems together","The flowers in the garden","More parking spaces"]]},
{id:"offline",title:"The Offline Weekend",ru:"Выходные без экранов",topic:"Технологии",level:"B1",
 text:["Every evening, the Parker family sat in the same room, but nobody talked. Dad checked his emails, Mum scrolled through the news, and the two kids, Sam and Ella, played games or chatted with friends.",
 "One Friday, Mum made an announcement: “This weekend: no phones, no laptops, no screens.” The children complained loudly. Sam said it was impossible, and Ella claimed she would miss something important.",
 "On Saturday morning everyone felt strange. Dad kept reaching for his pocket out of habit. But after breakfast they went for a long walk in the forest, and later they played an old board game they had found in a cupboard. Sam turned out to be surprisingly good at it.",
 "By Sunday evening something had changed. They had cooked dinner together, laughed a lot and talked more than they had in months. When the weekend was over, Ella admitted that she hadn’t missed anything important at all.",
 "Now the Parkers have a new rule: one offline evening every week. They still love their devices, but they have discovered that technology works best when it doesn’t replace real conversation."],
 gloss:{"scrolled through":"листала","announcement":"объявление","complained":"жаловались","claimed":"утверждала","out of habit":"по привычке","board game":"настольная игра","turned out to be":"оказался","devices":"устройства","replace":"заменять"},

    ["What is the family’s new rule?","One evening a week without devices","No phones at all","Board games only on Sundays"]]},
{id:"running",title:"Running Again",ru:"Снова на старте",topic:"Здоровье и спорт",level:"B1",
 text:["Daniel had always been a keen runner, but two years ago he injured his knee during a race. The doctor told him he needed surgery and at least six months of rest.",
 "The recovery was harder than he had expected. At first he could barely walk. Every week he went to a physiotherapist, who gave him exercises to strengthen the muscles around his knee. They were boring and sometimes painful, and more than once Daniel wanted to give up.",
 "What kept him going was a simple goal: to run a five-kilometre race in his town the following summer. He wrote the date on a piece of paper and stuck it on his fridge.",
 "Slowly, he made progress. First he walked for twenty minutes without pain, then he jogged for five. He also changed his diet and started sleeping better.",
 "On the day of the race, Daniel was nervous. He wasn’t trying to win; he just wanted to finish. When he crossed the finish line, he was among the last runners, but he was smiling more than anyone. “I learned that recovery isn’t about speed,” he says. “It’s about not stopping.”"],

{id:"letter",title:"The Letter",ru:"Письмо",topic:"Чувства",level:"B2",
 text:["Anna and Kate had been best friends since school. They shared everything: secrets, clothes, even a flat when they went to university. Then, five years ago, they had a terrible argument about something that now seemed completely unimportant. Both were too proud to apologise, and they stopped talking.",
 "Anna often thought about Kate. She felt guilty, but every time she picked up the phone, she put it down again. What if Kate was still angry? What if she didn’t want to hear from her?",
 "One evening, Anna decided to write a letter instead, a real letter on paper. She wrote that she missed their friendship, that she was sorry for the things she had said, and that she would understand if Kate didn’t want to reply.",
 "A week passed, then two. Anna was starting to lose hope. Then one morning she found an envelope in her letterbox. Inside, there was a short note in Kate’s familiar handwriting: “I’ve been waiting for this letter for five years. I was just too stubborn to write it myself. Coffee on Saturday?”",
 "They met that weekend, and within ten minutes it felt as if they had never been apart."],

{id:"beach",title:"The Beach Clean-Up",ru:"Уборка пляжа",topic:"Природа",level:"B1",
 text:["Every summer, Leo spent his holidays at his grandparents’ house by the sea. But this year, when he walked down to the beach, he was shocked. The sand was covered in plastic bottles, bags and old fishing nets. His grandfather told him that the problem had been getting worse for years.",
 "Leo decided to do something about it. He made a simple page online and invited people to join a beach clean-up on Saturday morning. He expected maybe ten volunteers. More than sixty came.",
 "They worked for four hours and collected over two hundred bags of rubbish. Some of it had travelled from other countries; one bottle had a label in Japanese. A local scientist explained that tiny pieces of plastic end up in the stomachs of fish and seabirds, and eventually in the food we eat.",
 "The clean-up was reported in the local newspaper, and soon the town installed recycling bins along the coast. Several cafés stopped using plastic straws.",
 "Leo knows that one beach is a very small part of the ocean. “But if every town looked after its own beach,” he says, “the world would look very different.”"],
 gloss:{"covered in":"покрыт","fishing nets":"рыболовные сети","volunteers":"волонтёры","rubbish":"мусор","label":"этикетка","end up":"в итоге оказываются","eventually":"в конце концов","installed":"установил","recycling bins":"контейнеры для переработки","looked after":"заботился о"},

{id:"fail",title:"Learning to Fail",ru:"Учиться на ошибках",topic:"Образование",level:"B2",
 text:["Jamal had always been a good student, so when he failed his first chemistry exam at university, he was devastated. He had studied for hours, reading his notes again and again. How could he have done so badly?",
 "He went to see his professor, expecting criticism. Instead, she asked him a question: “How exactly do you study?” When Jamal explained, she nodded. “Reading your notes feels useful,” she said, “but it doesn’t test your memory. You recognise the information, so you think you know it.”",
 "She suggested a different approach. Instead of rereading, Jamal should close his book and try to explain each topic out loud, as if he were teaching it. He should also test himself with practice questions and go back to difficult topics after a few days, not just the night before the exam.",
 "At first it felt much harder, and that was exactly the point. The effort of remembering made the knowledge stronger. At the end of the semester, Jamal got one of the highest marks in his group.",
 "Today he says that failing that first exam was the most useful thing that happened to him at university. It taught him not just chemistry, but how to learn."],
 gloss:{"devastated":"убит горем","criticism":"критика","nodded":"кивнула","recognise":"узнаёте","approach":"подход","out loud":"вслух","effort":"усилие","semester":"семестр","marks":"оценки"},
 q:[["Why was rereading notes not effective?","It doesn’t really test your memory","It takes too little time","The notes were wrong"],
    ["What did the professor suggest?","Explaining topics out loud and testing himself","Studying all night before the exam","Changing his subject"],
    ["Why does Jamal think failing was useful?","It taught him how to learn","It made him leave university","He got a prize for it"]]},
{id:"lisbon",title:"Lost in Lisbon",ru:"Потерялась в Лиссабоне",topic:"Путешествия",level:"B1",
 text:["On her second day in Lisbon, Sophie realised that her phone was gone. She had been using it as her map, her guidebook and her ticket for the tram. Now she was standing in a narrow street in the old town with no idea where her hotel was.",
 "She tried to stay calm. She remembered that the hotel was near a large square with a statue, so she asked a woman selling flowers for directions. The woman didn’t speak much English, but she drew a map on a paper bag and pointed up the hill.",
 "On the way, Sophie noticed things she had completely missed the day before, when she had been staring at her screen: colourful tiles on the buildings, the smell of grilled sardines, old men playing cards in a tiny garden. She stopped at a café and ordered a coffee by pointing at the menu.",
 "She reached the hotel two hours later than planned, tired but happy. The receptionist told her that someone had already handed in her phone at the tourist office.",
 "For the rest of the trip, Sophie kept the phone in her bag. “Getting lost,” she wrote in her diary, “was the best part of my holiday.”"],

{id:"wall",title:"The Painted Wall",ru:"Расписанная стена",topic:"Искусство",level:"B2",
 text:["One morning, the people of a quiet neighbourhood woke up to find a huge painting on the side of an old factory. It showed a girl holding a kite made of newspapers, flying above grey buildings. Nobody knew who had painted it.",
 "By lunchtime, photos of the mural were all over social media. Thousands of people shared them, and journalists started calling it a masterpiece. Tourists began to arrive with cameras. A local café owner said that her sales had tripled in a week.",
 "But not everyone was pleased. The owner of the factory complained that nobody had asked for his permission. Technically, he said, it was vandalism, and he planned to paint over it.",
 "The story divided the city. Some people believed that art should belong to everyone, especially in places that people usually ignore. Others said that private property must be respected, however beautiful the result.",
 "In the end, the factory owner came up with an unexpected solution. He kept the painting and turned the building into a small gallery for young street artists. The mysterious painter has never revealed their identity, but last month a new painting appeared on the gallery’s door. This time, the girl is smiling."],

{id:"nightshift",title:"The First Night Shift",ru:"Первая ночная смена",topic:"Работа",level:"B2",
 text:["Priya had dreamed of becoming a nurse since she was a child, but nothing had prepared her for her first night shift. At nine in the evening the ward looked calm. By midnight, two patients needed oxygen, a phone wouldn't stop ringing, and an elderly man kept trying to climb out of bed because he was sure he had missed his train.",
 "Her line manager, a tall Scottish nurse called Fiona, moved through the chaos as if she had all the time in the world. She never raised her voice. When Priya admitted that she felt completely overwhelmed, Fiona simply handed her a cup of tea and said, \"Prioritise. Who needs you most right now? Start there. Everything else can wait five minutes.\"",
 "Around three in the morning, the ward finally went quiet. Priya sat with the elderly man, who had stopped looking for his train and started telling her about his wedding in 1962. She listened and held his hand until he fell asleep.",
 "When the day staff arrived at seven, Priya was exhausted but strangely proud. Fiona patted her on the shoulder. \"You didn't panic, and you were kind,\" she said. \"The rest is just practice.\" On the bus home, Priya realised she was smiling."],
 gloss:{"shift":"смена","ward":"больничная палата","overwhelmed":"подавленный, не справляющийся","Prioritise":"расставь приоритеты","chaos":"хаос","raised her voice":"повысила голос","admitted":"призналась","patted":"похлопала"},
 q:[["What advice did Fiona give Priya?","To decide who needed her most and start there","To call a doctor for every problem","To go home and rest"],
    ["What did the elderly man talk about?","His wedding many years ago","His train journey to Scotland","His job as a nurse"],
    ["How did Priya feel at the end of the shift?","Exhausted but proud","Angry with Fiona","Ready to quit nursing"]]},
{id:"candles",title:"The Side Hustle",ru:"Подработка",topic:"Деньги и бизнес",level:"B1",
 text:["Last winter, Ellie started making scented candles in her tiny kitchen, mostly as a way to relax after work. Her friends loved them, so she began selling a few online. At first it was just a bit of extra money, a side hustle that paid for her coffee and train tickets.",
 "Then one of her candles appeared in a popular lifestyle video, and within a week she had two hundred orders. Ellie was thrilled — and terrified. She had to buy wax in bulk, find cheaper packaging and work out how much to charge. She realised she had been selling her candles at a loss, because she had never counted the cost of her own time.",
 "Her uncle, an accountant, helped her to make a simple budget. \"Your overheads are low, which is great,\" he told her, \"but your prices are too low. Customers will pay more for something handmade.\" Nervously, she raised her prices by thirty percent. To her surprise, the orders kept coming.",
 "Ellie still works in an office, but she has started to think about the future. Maybe one day the candles will become a real business. For now, she says, the best part is not the profit but the messages from customers who say her candles make their homes feel warmer."],

 q:[["Why did Ellie suddenly get two hundred orders?","One of her candles appeared in a popular video","She opened a shop in town","Her uncle advertised her candles"],
    ["What mistake had she been making?","She wasn't counting the cost of her own time","She was buying very expensive wax","She was sending orders to the wrong customers"],

{id:"cyclelane",title:"The Cycle Lane",ru:"Велодорожка",topic:"Общество",level:"B2",
 text:["When the council announced plans for a new cycle lane on Station Road, the town split into two camps almost overnight. Shop owners were furious, because the lane would remove thirty parking spaces. Parents, on the other hand, were delighted: for years their children had cycled to school between buses and lorries.",
 "Sam, who was seventeen, decided to go to the public meeting. He had never been interested in local politics, but he cycled down Station Road every day and had been knocked off his bike twice. The meeting was packed. People shouted, interrupted each other and accused the council of ignoring them.",
 "Then an elderly shop owner called Mr Hughes stood up. To everyone's surprise, he didn't attack the plan. He explained that half his customers came by car and he was worried his shop would close. Sam put his hand up and asked whether the council could create short-stay parking in the side streets. The councillors looked at each other, and one of them wrote something down.",
 "Three months later, the lane opened — together with twenty new short-stay spaces round the corner. Mr Hughes now sells bicycle bells in his shop window. And Sam has started thinking that politics might be more useful than he had imagined."],
 gloss:{"council":"муниципальный совет","split into two camps":"раскололся на два лагеря","overnight":"за одну ночь","lorries":"грузовики","knocked off":"сбит","packed":"переполнен","interrupted":"перебивали","accused":"обвиняли","short-stay parking":"кратковременная парковка"},
 q:[["Why were shop owners against the cycle lane?","It would remove parking spaces","It would be too expensive","It would bring too many tourists"],
    ["What did Sam suggest at the meeting?","Short-stay parking in the side streets","Closing Station Road to all traffic","Building a new school"],
    ["How did the story end?","The lane opened together with new parking spaces","The council cancelled the plan","Mr Hughes closed his shop"]]},
{id:"smarthome",title:"The Smart Home",ru:"Умный дом",topic:"Технологии",level:"B1",
 text:["When Daniel moved into his new flat, he decided to make it a smart home. He bought smart lights, a smart heating system and a voice assistant that could control everything. \"No more switches,\" he told his sister proudly. \"I'll just tell the house what to do.\"",
 "For a week, it worked perfectly. The lights came on when he arrived home, and the heating switched off when he left. Then the problems started. One night the voice assistant misheard the television and turned all the lights bright red. Another morning, a software update failed and the heating refused to turn on. Daniel spent his breakfast on hold with customer support, wearing two jumpers.",
 "The worst moment came during a video call with his new boss. Daniel said the word \"goodnight\" while telling a story, and the whole flat went dark. His boss laughed so much that she had to turn her camera off.",
 "Daniel hasn't given up on technology, but he has made one important change. Next to the smart lights, there is now an old-fashioned switch. \"Technology is brilliant,\" he says, \"when it works. But sometimes you just want to press a button and know what will happen.\""],

{id:"wrist",title:"The Broken Wrist",ru:"Сломанное запястье",topic:"Здоровье и спорт",level:"B2",
 text:["Two weeks before the regional tennis tournament, Leo slipped on a wet court and landed on his hand. The X-ray confirmed what he already knew: his wrist was broken. The doctor put it in a cast and told him he wouldn't be able to play for at least two months.",
 "Leo was devastated. He had trained for a year, and suddenly the season was over. For the first few days he hardly left his room. He stopped answering his friends' messages and spent hours scrolling through videos of other players.",
 "His physiotherapist, a former athlete called Marta, refused to let him feel sorry for himself. \"You can't use your right hand,\" she said, \"so let's train everything else.\" She gave him exercises for his legs and core, and suggested he work on his left-handed backhand. \"It'll feel ridiculous,\" she warned him, \"but your brain doesn't need a cast.\"",
 "When the cast finally came off, Leo's wrist was weak and stiff, and recovery took longer than he had hoped. But he had never been fitter, and his footwork was faster than ever. The following spring, he won a tournament he had lost three times before. In his speech, he thanked Marta \"for not letting me give up.\""],

{id:"fox",title:"The Fox in the Garden",ru:"Лиса в саду",topic:"Природа и экология",level:"B1",
 text:["When Grace first saw a fox in her small city garden, she thought it must be lost. It was early morning, and the animal was calmly sitting on the grass, as if it owned the place. Her neighbour told her that foxes were common in the city and that this one probably lived under the shed at the end of the street.",
 "Grace became curious. She started reading about urban wildlife and discovered that cities can be surprisingly good habitats. Gardens, parks and railway lines connect to form green corridors where animals can move and find food. But neat lawns and paved driveways leave very little space for insects, birds or hedgehogs.",
 "So Grace decided to change her garden. She stopped cutting part of the lawn, planted wild flowers and built a small pond. She made a hole at the bottom of her fence so that hedgehogs could pass through. Some neighbours thought the garden looked messy at first.",
 "By the end of the summer, the garden was full of bees and butterflies, frogs had moved into the pond, and a hedgehog visited every night. Three other families on the street had started their own wild corners. The fox still comes by sometimes. Grace likes to think it is checking on the progress."],
 gloss:{"shed":"сарай","urban wildlife":"городская дикая природа","habitats":"среды обитания","green corridors":"зелёные коридоры","paved driveways":"заасфальтированные подъездные дорожки","hedgehogs":"ежи","pond":"пруд","fence":"забор","messy":"неопрятный"},
 q:[["Where did the fox probably live?","Under a shed at the end of the street","In Grace's house","In a park outside the city"],
    ["Why did Grace make a hole in her fence?","So that hedgehogs could pass through","To get more light into the garden","To let her neighbour's dog in"],
    ["What happened by the end of the summer?","Other families started their own wild corners","The fox moved into Grace's house","The neighbours asked Grace to cut the grass"]]},
{id:"mockexam",title:"The Mock Exam",ru:"Пробный экзамен",topic:"Образование",level:"B2",
 text:["Two weeks before her final exams, Nadia got her mock exam results back and felt sick. She had failed chemistry — the subject she had spent the most time on. Every evening for months she had read her notes again and again, highlighting almost every line in yellow. How could she have failed?",
 "Her chemistry teacher, Mr Okafor, asked her to stay after class. He looked at her notebook and smiled sadly. \"You've worked incredibly hard,\" he said, \"but reading isn't the same as learning. When you read your notes, they feel familiar, so you think you know them. Then in the exam, the page isn't there to help you.\"",
 "He suggested a different method. Instead of rereading, Nadia should close the book and try to write down everything she remembered, then check what she had missed. She should explain each topic out loud, as if she were teaching it, and do old exam questions under time pressure.",
 "The new method was uncomfortable. It showed her exactly how much she didn't know, which was far more than she had expected. But slowly the gaps got smaller. In the real exam, Nadia got an A in chemistry. She still keeps one highlighter on her desk, but now she uses it only for the things she gets wrong."],
 gloss:{"mock exam":"пробный экзамен","highlighting":"выделяя маркером","familiar":"знакомый","rereading":"перечитывание","out loud":"вслух","under time pressure":"в условиях нехватки времени","uncomfortable":"неудобный, неприятный","gaps":"пробелы"},
 q:[["Why did Nadia fail her mock chemistry exam?","She only reread her notes instead of testing herself","She didn't study at all","She was ill on the day of the exam"],
    ["What did Mr Okafor suggest?","Writing down what she remembered and doing old exam questions","Studying with a private tutor","Changing to a different subject"],
    ["What does Nadia use her highlighter for now?","Only for the things she gets wrong","For every line of her notes","She has thrown it away"]]},
{id:"sleeper",title:"The Wrong Carriage",ru:"Не тот вагон",topic:"Путешествия",level:"B1",
 text:["Tom had booked a cabin on the sleeper train from London to Edinburgh as a birthday present for himself. He arrived at the station with ten minutes to spare, found carriage F and climbed into the top bunk. He was asleep before the train left the platform.",
 "At two in the morning, the train stopped and a guard knocked on the door. Tom was in the wrong carriage — and, as it turned out, on the wrong half of the train. The sleeper splits in the middle of the night: one part goes to Edinburgh, the other to Fort William, in the Highlands. Tom's half was now heading north-west.",
 "There was nothing he could do. In the morning, he looked out of the window at mountains, lakes and deer standing in the mist. An elderly woman in the next cabin, who was travelling home to Fort William, offered him a cup of tea and laughed when he told her his story. \"Best mistake you'll ever make,\" she said.",
 "She was right. Tom spent the day walking by the loch, ate the best fish and chips of his life and caught a bus to Edinburgh in the evening. He was eight hours late for his own birthday dinner, but his friends forgave him when they saw the photos."],

 q:[["Why did Tom end up in Fort William?","He was in the wrong half of the train, which split at night","He changed his plans on purpose","The train to Edinburgh was cancelled"],
    ["What did the elderly woman say about his mistake?","That it was the best mistake he would ever make","That he should complain to the railway","That he should take the next train back to London"],
    ["How did Tom finally get to Edinburgh?","By bus in the evening","By plane","By the next sleeper train"]]},
{id:"audition",title:"The Audition",ru:"Прослушивание",topic:"Искусство",level:"B2",
 text:["For three years, Ruby had sung only in her bedroom and, occasionally, in the shower. Her friends knew she had a beautiful voice, but whenever anyone asked her to perform, she found an excuse. So when her best friend secretly signed her up for an audition for the local theatre's summer musical, Ruby was horrified.",
 "She almost didn't go. On the morning of the audition, she felt sick and her hands were shaking. In the waiting room, other singers were warming up loudly and confidently, and some had clearly done this many times before. When her name was called, she seriously considered running out of the building.",
 "The director, a cheerful woman with bright red glasses, noticed how nervous she was. \"Forget about us,\" she said. \"Sing it to someone you love.\" Ruby closed her eyes and imagined her grandmother, who had taught her the song when she was little. Her voice wobbled on the first line, then grew steadier and stronger.",
 "When she finished, there was a short silence. Then the pianist started clapping. Ruby didn't get the lead role — that went to a girl with years of experience — but she got a part in the chorus and a solo in the second act. On the opening night, she spotted her grandmother in the front row, crying."],

 q:[["How did Ruby end up at the audition?","Her best friend signed her up without telling her","Her grandmother made her go","She saw an advert and applied"],
    ["What did the director tell her to do?","Sing the song to someone she loved","Sing louder than the others","Leave if she felt nervous"],
    ["Which part did Ruby get?","A place in the chorus and a solo","The lead role","No part at all"]]},
{id:"mates",title:"Weekend Plans",ru:"Планы на выходные",topic:"Разговорный английский",level:"B2",
 text:["\"Fancy doing something this weekend?\" Jake asked as he sat down next to Olly in the canteen. Olly groaned. \"Mate, I'm totally skint until payday. And I'm knackered — I've done three late shifts in a row.\" Jake wasn't going to give up that easily. \"No worries, it doesn't have to cost an arm and a leg. My cousin's got a cottage by the lake. We could crash there for free.\"",
 "Olly looked up. \"For real? What's the catch?\" \"No catch,\" Jake said. \"Well, we'd have to help him paint the fence on Saturday morning. But after that, we can chill out, grab a bite at the pub, maybe go fishing.\" Olly laughed. \"So basically, it's free labour.\" \"Basically,\" Jake admitted, \"but there's a barbecue in it for us.\"",
 "On Saturday, the fence took much longer than planned, and by lunchtime they were covered in green paint. Then Jake's cousin turned up with burgers, a speaker and a cool box full of drinks, and the rest of the weekend was brilliant. They swam in the freezing lake, stayed up chatting by the fire and lost every single game of cards to the cousin's ten-year-old daughter.",
 "On Sunday night, Olly sent Jake a message: \"Cheers for the weekend, mate. Gutted it's over. Same time next month? I'll bring the paint.\" Jake replied with a thumbs-up and the words: \"Count me in.\""],

 q:[["Why didn't Olly want to do anything at first?","He had no money and was very tired","He was busy painting his house","He didn't like Jake's cousin"],
    ["What was \"the catch\" of the free weekend?","They had to help paint a fence","They had to pay for the barbecue","They had to look after a ten-year-old"],

// ---------- data ----------
const ABBR = ["РК","ДБ","ОП","НТ","ЗС","ХЭ","ПЭ","ОМ","ПГ","МК","ФГ","РА"];
const WORDS = []; const BY = {};
THEMES.forEach((th,ti)=>th.words.forEach(([en,ipa,ru,ex])=>{
  const w={key:en,en:en.replace(/\s*\(.*?\)\s*/g,"").trim(),hint:(en.match(/\((.*?)\)/)||[])[1]||"",ipa,ru,ex,ti,
    senses:ru.replace(/\(.*?\)/g,"").split(/[,;]/).map(s=>s.trim()).filter(Boolean)};
  WORDS.push(w); BY[en]=w;
}));
// synonyms: same English or at least one shared Russian meaning (сотрудничать → collaborate / cooperate)
const clash=(a,b)=>a.en===b.en||a.senses.some(s=>b.senses.includes(s));
const IV=[0,1,2,4,7,14,30,60,120];      // days until next review for stage 1..8
const LEARNED=5;                       // stage reached = 14+ days interval
const MAXDUE=80;                       // reviews per session

// ---------- state ----------
const DAY=864e5;
function today(){ const d=new Date(); return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/DAY); }
function dstr(n){ return new Date(n*DAY).toISOString().slice(0,10); }
let S = {w:{}, log:{}, tn:{}, rd:{}, set:{newPerDay:15, goal:40, dir:"mix"}, v:2};
try{ const s=JSON.parse(localStorage.getItem("b2-state")||"null"); if(s&&s.v===2) S=merge(S,s); }catch(e){}
function merge(a,b){
  // rs = time of the last reset/replace; progress from a copy that predates it is dropped,
  // so a reset on one device is not undone by another device's old data
  const rs=Math.max(a.rs||0,b.rs||0);
  const [o,n]=(b.st||0)>=(a.st||0)?[a,b]:[b,a];   // settings: the more recently changed copy wins
  const out={w:{}, log:{}, tn:{}, rd:{}, set:{...o.set,...(n.set||{})}, v:2, st:Math.max(a.st||0,b.st||0), rs};
  for(const x of [a,b]){
    const fresh=(x.rs||0)>=rs;
    for(const k in (x.w||{})){ const v=x.w[k]; if(!fresh && (v.t||0)<=rs) continue; if(!out.w[k] || (v.t||0)>(out.w[k].t||0)) out.w[k]=v; }
    if(!fresh) continue;
    for(const k in (x.log||{})){ const p=out.log[k]||{r:0,ok:0,n:0}, y=x.log[k]; out.log[k]={r:Math.max(p.r,y.r||0),ok:Math.max(p.ok,y.ok||0),n:Math.max(p.n,y.n||0)}; }
    for(const k in (x.tn||{})){ out.tn[k]=Math.max(out.tn[k]||0,x.tn[k]); }
    for(const k in (x.rd||{})){ out.rd[k]=Math.max(out.rd[k]??0,x.rd[k]); }
  }
  return out;
}
let dirty=false, saveTimer=null;
function persist(){ try{localStorage.setItem("b2-state",JSON.stringify(S));}catch(e){} dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(pushRemote,3000); }
const L=()=>{ const k=dstr(today()); return S.log[k]||(S.log[k]={r:0,ok:0,n:0}); };

// ---------- cloud sync (same progress on phone and computer) ----------
let db=null, docRef=null, syncOn=false;
(async()=>{
  try{
    if(!window.claude?.use) return;
    const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!d||!u) return;
    const id=await u.id(); if(!id) return;
    db=d; docRef=db.doc("data/users/"+id+"/progress");
    const snap=await docRef.get();
    if(snap.exists){ const r=snap.data(); if(r&&r.json){ S=merge(S,JSON.parse(r.json)); try{localStorage.setItem("b2-state",JSON.stringify(S));}catch(e){} } }
    syncOn=true; if(!session && !tSession) render();
    await pushRemote(true);
  }catch(e){ syncOn=false; }
})();
async function pushRemote(force){
  if(!docRef || (!dirty && !force)) return;
  dirty=false;
  try{
    // merge what other devices saved in the meantime instead of overwriting it
    const snap=await docRef.get();
    if(snap.exists){ const r=snap.data(); if(r&&r.json){ S=merge(S,JSON.parse(r.json)); try{localStorage.setItem("b2-state",JSON.stringify(S));}catch(e){} } }
    await docRef.set({json:JSON.stringify(S), at:Date.now()}); syncOn=true;
  }
  catch(e){ dirty=true; syncOn=false; }
  updateSync();
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") pushRemote(); });
function updateSync(){ const el=document.getElementById("sync"); if(el){ el.className="sync"+(syncOn?" on":""); el.lastChild.textContent=syncOn?" синхронизировано":" на этом устройстве"; } }

// ---------- helpers ----------
const $=s=>document.querySelector(s);
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function plural(n,one,few,many){ const a=n%10,b=n%100; return a===1&&b!==11?one:a>=2&&a<=4&&(b<12||b>14)?few:many; }
const reduced=()=>{ try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } };
// list items rise one after another
function stagger(root){
  [...root.children].forEach((el,i)=>el.style.setProperty("--i",Math.min(i,8)));
  root.querySelectorAll(".list").forEach(l=>[...l.children].forEach((el,i)=>el.style.setProperty("--i",Math.min(i,12))));
}
function countUp(el,to,suffix=""){
  if(!el) return; if(reduced()){ el.textContent=to+suffix; return; }
  const t0=performance.now(), dur=700;
  const step=t=>{ const p=Math.min(1,(t-t0)/dur); el.textContent=Math.round(to*(1-Math.pow(1-p,3)))+suffix; if(p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function confetti(){
  if(reduced()) return;
  const cols=["#ffe46b","#a8eec6","#2d5bd7","#ff8a7a","#86a6ff"], c=document.createElement("div"); c.className="confetti";
  c.innerHTML=Array.from({length:40},()=>`<i style="left:${(Math.random()*100).toFixed(1)}%;background:${cols[Math.floor(Math.random()*cols.length)]};--dx:${Math.round(Math.random()*160-80)}px;--r:${Math.round(Math.random()*720-360)}deg;animation-delay:${(Math.random()*.3).toFixed(2)}s"></i>`).join("");
  document.body.appendChild(c); setTimeout(()=>c.remove(),2200);
}

function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }

// ---------- word stats ----------
const st=k=>S.w[k];
const isDue=k=>{ const s=st(k); return s && s.d<=today(); };   // stage 0 = introduced but not yet checked
const isNew=k=>!st(k);
const isLearned=k=>{ const s=st(k); return s && s.s>=LEARNED; };
function themeStats(ti){
  const ws=ti==null?WORDS:WORDS.filter(w=>w.ti===ti);
  let n=0,l=0,k=0,d=0;
  for(const w of ws){ const s=st(w.key); if(!s) n++; else if(s.s>=LEARNED) k++; else l++; if(isDue(w.key)) d++; }
  return {total:ws.length,new:n,learning:l,learned:k,due:d};
}
function streak(){
  let n=0, t=today();
  if(!(S.log[dstr(t)]?.r>0)) t--;
  while(S.log[dstr(t)]?.r>0){ n++; t--; }
  return n;
}
function newLeftToday(){ return Math.max(0, S.set.newPerDay - (L().n||0)); }

}

function ring(val,max,label,sub){
