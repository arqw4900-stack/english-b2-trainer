ate."],["tide over","","помочь продержаться","Here's fifty pounds to tide you over."],["tip off","","предупредить по секрету, навести","Someone tipped off the police."],["top up","","пополнить","I need to top up my phone."],["touch on","","коснуться (темы)","The lecture only touched on the subject."],["tune in","","настроиться (на передачу)","Millions tuned in to watch the final."],["wear off","","пройти (о действии, эффекте)","The anaesthetic will wear off in an hour."],["wind up","","закончить, оказаться в итоге","We wound up spending the night at the airport."],["wrap up","","завершить; тепло одеться","Let's wrap up the meeting."],["write off","","списать (со счетов)","Don't write him off yet — he's a fighter."],["zone out","","отключиться, витать в облаках","I zoned out during the lecture."]]}];
const GRAMMAR = [{"id":"modals","grp":"Модальность и условия","abbr":"MV","name":"Modal verbs: obligation and advice","ru":"Модальные: долг, запрет, совет","rule":["**must** — необходимость, которую чувствует сам говорящий, или правило от него: I must call Mum.","**have to** — необходимость извне (правила, обстоятельства): I have to wear a uniform at work.","**mustn't** — запрет; **don't have to / needn't** — нет необходимости (можно, но не обязательно).","**should / ought to** — совет; **had better** — настойчивый совет с намёком на последствия: You'd better hurry.","Прошлое: must → **had to**; **should have done** — «надо было (а ты не сделал)»; **needn't have done** — сделал, хотя было не нужно."],"examples":[["You mustn't park here — it's a fire exit.","Здесь нельзя парковаться — это пожарный выход."],["You don't have to come if you're busy.","Можешь не приходить, если занят."],["You should have told me earlier.","Надо было сказать мне раньше."],["We needn't have taken a taxi — the station was close.","Зря мы взяли такси — вокзал был рядом."]],"tip":"**mustn't ≠ don't have to**: «You mustn't tell him» — нельзя говорить; «You don't have to tell him» — можно не говорить.","ex":[{"q":"You ___ smoke in the hospital — it's strictly forbidden. (запрет)","task":"","ans":["mustn't","must not"],"note":"Запрет — **mustn't**; don't have to значило бы «не обязательно»."},{"q":"It's Sunday tomorrow, so I ___ get up early. (нет необходимости)","task":"","ans":["don't have to","do not have to","needn't","need not"],"note":"Нет необходимости — **don't have to / needn't**."},{"q":"Last year I ___ work every Saturday. (необходимость в прошлом)","task":"","ans":["had to"],"note":"У must нет прошедшего времени — **had to**."},{"q":"You look exhausted. You ___ go to bed earlier. (совет)","task":"","ans":["should","ought to"],"note":"Совет — **should / ought to**."},{"q":"You'd ___ leave now, or you'll miss the last train.","task":"","ans":["better"],"note":"**had better** — настойчивый совет с последствиями."},{"q":"You ___ have told me about the party! Now I've got nothing to wear. (упрёк)","task":"","ans":["should","ought to"],"note":"Упрёк о прошлом — **should have done**."},{"q":"We ___ have bought so much food — half of it went off. (сделали зря)","task":"","ans":["needn't","need not"],"note":"**needn't have done** — сделали, хотя не было нужно."},{"q":"Students ___ use their phones during the exam. (не разрешено)","task":"","ans":["aren't allowed to","are not allowed to","mustn't","must not","can't","cannot"],"note":"Запрет по правилам: **aren't allowed to / mustn't / can't**."},{"q":"Do we ___ to bring our own towels, or are they provided?","task":"","ans":["have"],"note":"Вопрос о необходимости: **Do we have to…?**"},{"q":"I ___ remember to call the bank tomorrow — it's really important. (моя необходимость)","task":"","ans":["must"],"note":"Необходимость, которую чувствует сам говорящий, — **must**."}],"table":[["Значение","Настоящее","Прошлое"],["Необходимость","must / have to","had to"],["Нет необходимости","don't have to / needn't","didn't have to / needn't have done"],["Запрет","mustn't / can't","couldn't / wasn't allowed to"],["Совет, упрёк","should / ought to","should have done"]]},{"id":"deduction","grp":"Модальность и условия","abbr":"MD","name":"Modals of deduction","ru":"Модальные: уверенность и догадки","rule":["Уверенность «наверняка»: **must** + глагол; о прошлом — **must have done**.","Возможность: **might / may / could** (о прошлом — + have done).","Уверенность «не может быть»: **can't / couldn't** (+ have done). Не *mustn't* в этом значении!"],"examples":[["The lights are on — they must be at home.","Свет горит — они наверняка дома."],["She might have missed the bus.","Возможно, она опоздала на автобус."],["He can't have finished already — he only started an hour ago.","Не может быть, что он уже закончил — он начал всего час назад."]],"tip":"Логическое «не может быть» — **can't**: «He can't be serious» (не может быть, что он всерьёз), а не *mustn't.","ex":[{"q":"She's been working for twelve hours. She ___ be exhausted. (наверняка)","task":"","ans":["must"],"note":"Логический вывод «наверняка» — **must**."},{"q":"That ___ be John at the door — he's in Spain this week. (точно нет)","task":"","ans":["can't","cannot","couldn't","could not"],"note":"Невозможность — **can't**, не mustn't."},{"q":"I'm not sure where Tom is. He ___ be in the library. (возможно)","task":"","ans":["might","may","could"],"note":"Предположение — **might / may / could**."},{"q":"The ground is wet. It ___ have rained during the night. (наверняка)","task":"","ans":["must"],"note":"Вывод о прошлом — **must have done**."},{"q":"She ___ have seen us — she didn't even look our way. (точно нет)","task":"","ans":["can't","cannot","couldn't","could not"],"note":"**can't / couldn't have done** — уверенность, что не было."},{"q":"I can't find my keys. I ___ have left them at work. (возможно)","task":"","ans":["might","may","could"],"note":"Возможность в прошлом — **might / may / could have done**."},{"q":"They've just bought a new house and a new car. They ___ be very rich. (наверняка)","task":"","ans":["must"],"note":"Вывод из фактов — **must**."},{"q":"He's never late, so he ___ have forgotten about the meeting. (единственное объяснение)","task":"","ans":["must"],"note":"Уверенный вывод о прошлом — **must have done**."},{"q":"\"Whose bag is this?\" — \"It ___ be Anna's. She was sitting here.\" (наверняка)","task":"","ans":["must"],"note":"**must** — вывод из того, что видим."},{"q":"The film ___ have been very good — everyone left before the end. (точно нет)","task":"","ans":["can't","cannot","couldn't","could not"],"note":"**can't have been** — уверенность, что не был."}],"table":[["Уверенность","Настоящее","Прошлое"],["Наверняка да","must be / must be doing","must have done"],["Возможно","might / may / could be","might / may / could have done"],["Наверняка нет","can't / couldn't be","can't / couldn't have done"]]},{"id":"conditionals","grp":"Модальность и условия","abbr":"IF","name":"Conditionals","ru":"Условные предложения","rule":["**Zero**: if + Present, Present — всегда верно: If you heat ice, it melts.","**First**: if + Present, will — реальное будущее: If it rains, we'll stay in.","**Second**: if + Past, would — нереальное сейчас: If I had more time, I would travel. (If I **were** you…)","**Third**: if + Past Perfect, would have done — нереальное прошлое: If I had known, I would have helped.","**Mixed**: условие в прошлом → результат сейчас: If I had studied medicine, I would be a doctor now.","**unless** = if not; **provided / as long as** = при условии, что. После них для будущего — настоящее время."],"examples":[["If I were you, I'd accept the offer.","На твоём месте я бы принял предложение."],["If she had left earlier, she wouldn't have missed the train.","Если бы она вышла раньше, она бы не опоздала на поезд."],["You can borrow my car as long as you drive carefully.","Можешь взять мою машину, если будешь водить аккуратно."]],"tip":"После **if** в первом типе не ставят will: «If it **rains**», а не *if it will rain.","ex":[{"q":"If it ___ tomorrow, we'll cancel the picnic. (rain)","task":"","ans":["rains"],"note":"Первый тип: после if — **Present Simple**, не will."},{"q":"If I ___ more money, I would buy a flat in the centre. (have)","task":"","ans":["had"],"note":"Второй тип: if + **Past Simple**."},{"q":"If I ___ you, I'd talk to your manager. (be)","task":"","ans":["were","was"],"note":"**If I were you** — устойчиво (was — разговорно)."},{"q":"If we had left on time, we ___ the beginning of the film. (not miss)","task":"","ans":["wouldn't have missed","would not have missed"],"note":"Третий тип: **would have + V3**."},{"q":"If she ___ harder, she would have passed the exam. (study)","task":"","ans":["had studied","'d studied"],"note":"Третий тип: if + **Past Perfect**."},{"q":"If I had taken that job in London, I ___ there now. (live)","task":"","ans":["would be living","would live","'d be living","'d live"],"note":"Смешанный тип: прошлое условие → результат сейчас: **would + V**."},{"q":"___ you hurry, you'll be late. (если не)","task":"","ans":["Unless"],"note":"**unless** = if not."},{"q":"You can stay out late as ___ as you call me.","task":"","ans":["long"],"note":"**as long as** — при условии, что."},{"q":"If you heat water to 100 degrees, it ___. (boil)","task":"","ans":["boils"],"note":"Нулевой тип — общий факт: Present Simple."},{"q":"What would you do if you ___ the lottery? (win)","task":"","ans":["won"],"note":"Второй тип: if + Past Simple."}],"table":[["Тип","Условие","Результат"],["0","if + Present Simple","Present Simple"],["1","if + Present Simple","will + V"],["2","if + Past Simple","would + V"],["3","if + Past Perfect","would have + V3"],["Mixed","if + Past Perfect","would + V"]]},{"id":"wishes","grp":"Модальность и условия","abbr":"IW","name":"Wishes and regrets","ru":"Сожаления: I wish, if only","rule":["**I wish + Past Simple** — сожаление о настоящем: I wish I knew the answer.","**I wish + Past Perfect** — сожаление о прошлом: I wish I hadn't said that.","**I wish + would** — раздражение, желание, чтобы кто-то изменил поведение: I wish you would stop talking.","**If only** — то же, но эмоциональнее. **It's time + Past Simple**: It's time we left. **I'd rather + подлежащее + Past**: I'd rather you didn't smoke here."],"examples":[["I wish I lived closer to the sea.","Жаль, что я не живу ближе к морю."],["If only I had listened to you!","Если бы я только тебя послушал!"],["I wish the neighbours would turn the music down.","Хоть бы соседи сделали музыку потише."],["It's time we went home.","Пора нам идти домой."]],"tip":"О себе с would не говорят: не *I wish I would…*, а **I wish I could…**","ex":[{"q":"I wish I ___ how to fix this. (know)","task":"","ans":["knew"],"note":"Сожаление о настоящем: **wish + Past Simple**."},{"q":"I wish I ___ so much last night — I feel terrible. (not eat)","task":"","ans":["hadn't eaten","had not eaten"],"note":"О прошлом: **wish + Past Perfect**."},{"q":"I wish you ___ interrupting me all the time! (stop)","task":"","ans":["would stop","'d stop"],"note":"Раздражение: **wish + would**."},{"q":"If only I ___ more time to prepare! (have)","task":"","ans":["had"],"note":"**If only + Past Simple** — о настоящем."},{"q":"It's time we ___ home. (go)","task":"","ans":["went"],"note":"**It's time + Past Simple**."},{"q":"I'd rather you ___ tell anyone about this. (не)","task":"","ans":["didn't","did not"],"note":"**I'd rather + подлежащее + Past**."},{"q":"I wish I ___ swim — everyone else is in the pool. (умение)","task":"","ans":["could"],"note":"О способности — **could**, не would."},{"q":"She wishes she ___ to the party; she missed everyone. (go)","task":"","ans":["had gone","'d gone"],"note":"О прошлом — **Past Perfect**."},{"q":"If only it ___ raining! We want to go out. (stop)","task":"","ans":["would stop","'d stop"],"note":"Желание перемены — **would**."},{"q":"I wish my flat ___ bigger. (be)","task":"","ans":["was","were"],"note":"**wish + were / was** — о настоящем."}]},{"id":"passive","grp":"Глагольные формы","abbr":"PV","name":"Passive voice","ru":"Страдательный залог","rule":["**be + V3** во всех временах: is made, was made, has been made, is being made, will be made.","Деятель — через **by**, если он важен: The book was written by Orwell.","С модальными: **can be done, must be done, should have been done**.","**have something done** — услуга, которую делают для вас: I had my hair cut.","**It is said that… / He is said to…** — безличный пассив в новостях и официальных текстах."],"examples":[["The bridge is being repaired.","Мост сейчас ремонтируют."],["I'm having my car serviced tomorrow.","Завтра мне обслуживают машину."],["The suspect is believed to be in France.","Считается, что подозреваемый во Франции."]],"tip":"Continuous в пассиве — **being**: is being built; Perfect — **been**: has been built.","ex":[{"q":"The new bridge ___ next year. (build, будущее)","task":"","ans":["will be built"],"note":"Пассив будущего: **will be + V3**."},{"q":"My bike ___ last night. (steal)","task":"","ans":["was stolen"],"note":"Past Simple пассив: **was + V3**."},{"q":"The road ___ at the moment, so take another route. (repair)","task":"","ans":["is being repaired"],"note":"Present Continuous пассив: **is being + V3**."},{"q":"Three people ___ in the accident so far. (injure)","task":"","ans":["have been injured"],"note":"Present Perfect пассив: **have been + V3**."},{"q":"I ___ my hair cut yesterday. (have)","task":"","ans":["had"],"note":"**have something done**: I had my hair cut."},{"q":"The minister is said ___ resigned. (have)","task":"","ans":["to have"],"note":"**is said to have done** — о прошлом."},{"q":"This form must ___ in black ink. (complete)","task":"","ans":["be completed"],"note":"Модальный пассив: **must be + V3**."},{"q":"The letter should ___ sent last week. (have)","task":"","ans":["have been"],"note":"Упрёк в пассиве: **should have been + V3**."},{"q":"English ___ all over the world. (speak)","task":"","ans":["is spoken"],"note":"Present Simple пассив: **is + V3**."},{"q":"It ___ that the company will close. (believe)","task":"","ans":["is believed"],"note":"Безличный пассив: **It is believed that…**"}],"table":[["Время","Актив","Пассив"],["Present Simple","They clean the room.","The room is cleaned."],["Present Continuous","They are cleaning it.","It is being cleaned."],["Present Perfect","They have cleaned it.","It has been cleaned."],["Past Simple","They cleaned it.","It was cleaned."],["Future","They will clean it.","It will be cleaned."]]},{"id":"reported","grp":"Глагольные формы","abbr":"RS","name":"Reported speech","ru":"Косвенная речь","rule":["После прошедшего глагола (said, told) время «сдвигается назад»: am → was, will → would, did / have done → had done.","Меняются местоимения и указатели: now → then, today → that day, tomorrow → the next day, yesterday → the day before.","**say** (что-то), **tell** (кому-то): He told me that…, He said that…","Вопросы: прямой порядок слов, для да/нет — **if / whether**: She asked where I lived.","Глаголы-отчёты: **advise / remind / warn someone to do**, **suggest doing**, **apologise for doing**, **deny doing**, **refuse to do**."],"examples":[["\"I'm tired,\" she said. → She said she was tired.","«Я устала», — сказала она. → Она сказала, что устала."],["He asked me where I worked.","Он спросил, где я работаю."],["She suggested going to the cinema.","Она предложила пойти в кино."]],"tip":"В косвенном вопросе нет do/did и инверсии: «She asked where I lived», не *where did I live.","ex":[{"q":"\"I'm busy,\" she said. → She said that she ___ busy.","task":"","ans":["was"],"note":"Сдвиг времени: am → **was**."},{"q":"\"I'll call you,\" he said. → He said he ___ call me.","task":"","ans":["would"],"note":"will → **would**."},{"q":"\"Where do you live?\" → She asked me where I ___.","task":"","ans":["lived"],"note":"Прямой порядок и сдвиг времени: where I **lived**."},{"q":"\"Did you see the film?\" → He asked me ___ I had seen the film.","task":"","ans":["if","whether"],"note":"Вопрос да/нет → **if / whether**."},{"q":"\"Don't touch it,\" she said to me. → She ___ me not to touch it.","task":"","ans":["told","warned"],"note":"Приказ: **tell / warn someone not to do**."},{"q":"\"Let's go to the beach.\" → She suggested ___ to the beach.","task":"","ans":["going","that we go","that we should go"],"note":"**suggest doing** (или suggest that we go)."},{"q":"\"I didn't take the money.\" → He denied ___ the money.","task":"","ans":["taking","having taken"],"note":"**deny doing**."},{"q":"He ___ me that he would be late. (say / tell)","task":"","ans":["told"],"note":"**tell** + кому: told me."},{"q":"\"I'm sorry I'm late.\" → She apologised ___ being late.","task":"","ans":["for"],"note":"**apologise for doing**."},{"q":"\"We arrived yesterday.\" → They said they had arrived ___.","task":"","ans":["the day before","the previous day"],"note":"yesterday → **the day before / the previous day**."}]},{"id":"relative","grp":"Строение предложения","abbr":"RC","name":"Relative clauses","ru":"Придаточные определительные","rule":["**who** — люди, **which** — предметы, **that** — люди и предметы (только в определяющих), **whose** — чей, **where** — где, **when** — когда.","Определяющие (defining) — без запятых, нужны для смысла; объектное who/which/that можно опустить: the book (that) I read.","Неопределяющие (non-defining) — с запятыми, добавляют информацию; **that** нельзя, местоимение не опускается.","**which** может относиться ко всему предложению: He passed, which surprised everyone.","С предлогом: the person **to whom** I spoke (формально) / the person I spoke **to** (нейтрально)."],"examples":[["The woman who lives next door is a doctor.","Женщина, которая живёт по соседству, — врач."],["My brother, who lives in Oslo, is visiting us.","Мой брат, который живёт в Осло, приезжает к нам."],["That's the man whose car was stolen.","Это тот человек, у которого угнали машину."]],"tip":"После запятой не ставят **that**: «My car, which is red…», не *My car, that is red.","ex":[{"q":"The man ___ car was stolen called the police.","task":"","ans":["whose"],"note":"Принадлежность — **whose**."},{"q":"That's the restaurant ___ we had our first date.","task":"","ans":["where","in which"],"note":"Место — **where** (in which)."},{"q":"My sister, ___ lives in Paris, is a designer.","task":"","ans":["who"],"note":"Неопределяющее о человеке — **who** (не that)."},{"q":"He failed the exam, ___ surprised everyone.","task":"","ans":["which"],"note":"**which** относится ко всему предложению."},{"q":"I'll never forget the day ___ we met.","task":"","ans":["when","on which","that"],"note":"Время — **when**."},{"q":"The laptop ___ I bought last week has already broken.","task":"","ans":["that","which"],"note":"Определяющее о предмете — **that / which** (можно и опустить)."},{"q":"Is this the person to ___ you sent the email?","task":"","ans":["whom"],"note":"После предлога в формальном стиле — **whom**."},{"q":"Our flat, ___ we bought in 2020, has doubled in value.","task":"","ans":["which"],"note":"Неопределяющее о предмете — **which**."},{"q":"The reason ___ I called is to invite you to dinner.","task":"","ans":["why","that"],"note":"**the reason why**."},{"q":"Students ___ arrive late will not be admitted.","task":"","ans":["who","that"],"note":"Определяющее о людях — **who / that**."}]},{"id":"gerunds","grp":"Глагольные формы","abbr":"GI","name":"Gerunds and infinitives","ru":"Герундий или инфинитив","rule":["После **enjoy, avoid, mind, finish, suggest, consider, admit, deny, keep, can't help, look forward to** — **-ing**.","После **want, decide, hope, plan, agree, refuse, manage, afford, offer, promise, seem** — **to + V**.","После предлогов всегда **-ing**: interested in learning, good at cooking, before leaving.","Меняют смысл: **stop** doing (перестать) / stop to do (остановиться, чтобы); **remember / forget** doing (помнить пережитое) / to do (не забыть сделать); **try** doing (попробовать как способ) / to do (стараться).","**make / let** + глагол без to: They made me wait. **be used to / get used to** + -ing."],"examples":[["I'm looking forward to seeing you.","С нетерпением жду встречи с тобой."],["She stopped to buy some water.","Она остановилась, чтобы купить воды."],["Remember to lock the door.","Не забудь запереть дверь."]],"tip":"В **look forward to** частица to — предлог, поэтому дальше **-ing**: looking forward to hearing from you.","ex":[{"q":"I really enjoy ___ in the mountains. (walk)","task":"","ans":["walking"],"note":"После enjoy — **-ing**."},{"q":"We decided ___ a new car. (buy)","task":"","ans":["to buy"],"note":"После decide — **to + V**."},{"q":"I'm looking forward to ___ you next week. (see)","task":"","ans":["seeing"],"note":"look forward **to** + -ing."},{"q":"He stopped ___ when the doctor warned him about his lungs. (smoke — бросил)","task":"","ans":["smoking"],"note":"**stop doing** — перестать."},{"q":"On the way home I stopped ___ some bread. (buy — чтобы купить)","task":"","ans":["to buy"],"note":"**stop to do** — остановиться, чтобы."},{"q":"Did you remember ___ the door? (lock — не забыл ли)","task":"","ans":["to lock"],"note":"**remember to do** — не забыть сделать."},{"q":"I'll never forget ___ the Pacific for the first time. (see — помню, как видел)","task":"","ans":["seeing"],"note":"**forget doing** — о пережитом."},{"q":"My parents made me ___ my room every Saturday. (clean)","task":"","ans":["clean"],"note":"**make** + глагол без to."},{"q":"She's very good at ___ people feel relaxed. (make)","task":"","ans":["making"],"note":"После предлога — **-ing**."},{"q":"They can't afford ___ on holiday this year. (go)","task":"","ans":["to go"],"note":"**afford to do**."}]},{"id":"participles","grp":"Глагольные формы","abbr":"PC","name":"Participle clauses","ru":"Причастные обороты","rule":["**-ing** — одновременное действие или причина: Walking home, I met Tom. Feeling tired, she went to bed.","**Having + V3** — действие раньше главного: Having finished the report, he went home.","**V3** — пассивное значение: Built in 1890, the house needs repairs.","Подлежащее оборота и главного предложения должно совпадать, иначе ошибка (*Walking home, it started to rain).","Сокращают придаточные: the man **standing** by the door = who is standing; the car **stolen** yesterday = which was stolen."],"examples":[["Not knowing what to do, I called my father.","Не зная, что делать, я позвонил отцу."],["Having lived in Spain, she speaks Spanish fluently.","Поскольку она жила в Испании, она свободно говорит по-испански."],["Written in simple English, the book is easy to read.","Книга написана простым английским, поэтому читается легко."]],"tip":"Отрицание ставят перед причастием: **Not having** received a reply, I wrote again.","ex":[{"q":"___ the door, she realised she had forgotten her keys. (close — одновременно)","task":"","ans":["Closing"],"note":"Одновременное действие — **-ing**."},{"q":"___ finished his homework, he went out to play. (have — раньше)","task":"","ans":["Having"],"note":"Предшествующее действие — **Having + V3**."},{"q":"___ in 1889, the Eiffel Tower attracts millions of visitors. (complete — пассив)","task":"","ans":["Completed"],"note":"Пассивное значение — **V3**."},{"q":"___ knowing the answer, I kept quiet. (отрицание)","task":"","ans":["Not"],"note":"Отрицание — **Not** + -ing."},{"q":"The woman ___ to the manager is my aunt. (talk — которая разговаривает)","task":"","ans":["talking"],"note":"who is talking → **talking**."},{"q":"The letters ___ yesterday haven't arrived. (send — которые отправили)","task":"","ans":["sent"],"note":"which were sent → **sent**."},{"q":"___ tired, I decided to stay at home. (feel — причина)","task":"","ans":["Feeling"],"note":"Причина — **-ing**."},{"q":"___ by the noise, the baby started crying. (wake — пассив)","task":"","ans":["Woken","Awoken"],"note":"Пассивное значение — **V3**."},{"q":"___ lived abroad for years, he found it hard to settle back home. (have)","task":"","ans":["Having"],"note":"**Having + V3** — раньше главного."},{"q":"Anyone ___ to join the club should contact Anna. (wish)","task":"","ans":["wishing"],"note":"who wishes → **wishing**."}]},{"id":"usedto","grp":"Глагольные формы","abbr":"UT","name":"Used to, would, be used to","ru":"Used to, would, be/get used to","rule":["**used to + V** — прошлая привычка или состояние, которого больше нет: I used to live in Kyiv.","**would + V** — только повторяющиеся действия в прошлом (не состояния): Every summer we would go to the sea.","**be used to + -ing / существительное** — привык: I'm used to getting up early.","**get used to + -ing** — привыкать: You'll get used to driving on the left.","Отрицание и вопрос: **didn't use to**, **Did you use to…?**"],"examples":[["I used to have long hair.","Раньше у меня были длинные волосы."],["She isn't used to working at night.","Она не привыкла работать по ночам."],["It took me months to get used to the cold.","Мне понадобились месяцы, чтобы привыкнуть к холоду."]],"tip":"С состояниями (be, have, live, like) — только **used to**, не would: «I used to like jazz», не *I would like jazz.","ex":[{"q":"When I was a child, I ___ live in a small village. (раньше)","task":"","ans":["used to"],"note":"Прошлое состояние — **used to**."},{"q":"I'm not used to ___ so early. (get up)","task":"","ans":["getting up"],"note":"**be used to + -ing**."},{"q":"Don't worry, you'll soon get used to ___ on the left. (drive)","task":"","ans":["driving"],"note":"**get used to + -ing**."},{"q":"Every Sunday my grandfather ___ take us fishing. (повторялось)","task":"","ans":["would","used to"],"note":"Повторяющееся действие — **would / used to**."},{"q":"Did you ___ to play any sports at school?","task":"","ans":["use"],"note":"Вопрос: **Did you use to…?**"},{"q":"I didn't ___ to like coffee, but now I love it.","task":"","ans":["use"],"note":"Отрицание: **didn't use to**."},{"q":"She ___ used to the noise of the city now. (уже привыкла)","task":"","ans":["is","'s"],"note":"**is used to** — уже привыкла."},{"q":"It took him a long time to ___ used to his new job.","task":"","ans":["get"],"note":"**get used to** — привыкнуть."},{"q":"We ___ to have a dog when I was young.","task":"","ans":["used"],"note":"**used to have** — прошлое состояние."},{"q":"I'm used to ___ in a big team. (work)","task":"","ans":["working"],"note":"**be used to + -ing**."}]},{"id":"inversion","grp":"Строение предложения","abbr":"IN","name":"Inversion","ru":"Инверсия","rule":["После отрицательных и ограничительных слов в начале предложения — порядок как в вопросе: **Never have I** seen…","**Not only… but also**: Not only did he lie, but he also stole money.","**Hardly / Scarcely… when**, **No sooner… than** — «едва… как»: No sooner had I arrived than it started to rain.","**Only then / Only when / Only after** + инверсия: Only then did I understand.","**Under no circumstances / On no account / At no time** — категорический запрет или отрицание.","Условие без if: **Had I known** = If I had known; **Should you need** = If you need; **Were I** = If I were."],"examples":[["Never have I seen such a beautiful sunset.","Никогда я не видел такого красивого заката."],["Not only is she talented, but she is also hard-working.","Она не только талантлива, но и трудолюбива."],["Had I known, I would have helped.","Если бы я знал, я бы помог."]],"tip":"Инверсия — признак формального или эмоционального стиля; в разговоре чаще прямой порядок: «I've never seen…».","ex":[{"q":"Never ___ I seen such a mess! (have)","task":"","ans":["have"],"note":"Never + **have I** — инверсия."},{"q":"Not only ___ he late, but he also forgot the tickets. (be)","task":"","ans":["was"],"note":"Not only + **was he**."},{"q":"No sooner ___ we sat down than the phone rang. (have)","task":"","ans":["had"],"note":"No sooner + **had we** + V3 … than."},{"q":"Hardly had I closed my eyes ___ the alarm went off.","task":"","ans":["when"],"note":"Hardly… **when**."},{"q":"Only then ___ I realise how serious the problem was. (do)","task":"","ans":["did"],"note":"Only then + **did I** + V."},{"q":"Under no circumstances ___ you open this door.","task":"","ans":["should"],"note":"Under no circumstances + **should you**."},{"q":"___ I known about the strike, I would have taken a taxi. (have)","task":"","ans":["Had"],"note":"Условие без if: **Had I known** = If I had known."},{"q":"___ you need any help, please call me.","task":"","ans":["Should"],"note":"**Should you need** = If you need."},{"q":"Rarely ___ she complain about anything. (do)","task":"","ans":["does"],"note":"Rarely + **does she**."},{"q":"Little ___ they know what was waiting for them. (do)","task":"","ans":["did"],"note":"Little + **did they know** — «они и не подозревали»."}]},{"id":"emphasis","grp":"Строение предложения","abbr":"EM","name":"Emphasis and cleft sentences","ru":"Выделение: It is… that, What…","rule":["**It is / was… that / who** — выделяет одну часть: It was Tom who broke the window.","**What… is / was** — выделяет действие или предмет: What I need is a holiday. What she did was call the police.","**do / does / did** перед глаголом в утверждении — усиление: I do like your dress! He did call — I promise.","**All… is / The thing… is / The reason (why)… is**: All I want is some sleep. The reason I'm late is the traffic."],"examples":[["It was in Paris that they first met.","Именно в Париже они впервые встретились."],["What annoys me is his attitude.","Меня раздражает именно его отношение."],["I did send the email — maybe it's in your spam.","Я правда отправил письмо — может, оно в спаме."]],"tip":"После **What… was** глагол идёт без to или с to: «What he did was (to) leave».","ex":[{"q":"It was my brother ___ found the wallet.","task":"","ans":["who","that"],"note":"It was… **who / that**."},{"q":"___ I need right now is a cup of tea.","task":"","ans":["What","All"],"note":"**What I need is…**"},{"q":"I ___ love this song! (усиление, настоящее)","task":"","ans":["do"],"note":"Эмфатическое **do**."},{"q":"She ___ warn us, but we didn't listen. (усиление, прошлое)","task":"","ans":["did"],"note":"Эмфатическое **did** + V."},{"q":"It ___ in 2015 that I moved to London. (be)","task":"","ans":["was"],"note":"It **was**… that…"},{"q":"What she did ___ call the police. (be)","task":"","ans":["was"],"note":"What she did **was** call…"},{"q":"All I want ___ a quiet evening. (be)","task":"","ans":["is"],"note":"All I want **is**…"},{"q":"The reason ___ I'm calling is to ask a favour.","task":"","ans":["why","that"],"note":"**The reason why**…"},{"q":"It's not the money ___ bothers me, it's the time.","task":"","ans":["that","which"],"note":"It's… **that** bothers me."},{"q":"What I like most about this city ___ its parks. (be)","task":"","ans":["is"],"note":"What I like… **is**."}]},{"id":"articles","grp":"Артикли, предлоги, связки","abbr":"AR","name":"Articles","ru":"Артикли","rule":["**a / an** — впервые упомянутый, один из многих, профессия: She's a nurse. I saw a dog.","**the** — уже известный, единственный в своём роде, с превосходной степенью: the sun, the best day, the dog I told you about.","Без артикля — общие понятия во множественном числе и неисчисляемые: Dogs are loyal. Life is short.","**the** — с реками, морями, горными цепями, странами-«союзами» (the UK, the USA), музыкальными инструментами (play the piano).","Без артикля — большинство стран и городов, отдельные горы и озёра, приёмы пищи, go to school / bed / work «по назначению»."],"examples":[["I bought a book. The book is about Poland.","Я купил книгу. Книга о Польше."],["Honesty is the best policy.","Честность — лучшая политика."],["She went to hospital after the accident.","После аварии она попала в больницу."]],"tip":"**a / an** выбирают по звуку: **an** hour, **an** honest man, но **a** university, **a** European country.","ex":[{"q":"She works as ___ engineer.","task":"","ans":["an"],"note":"Профессия — **a / an**; перед гласным звуком — an."},{"q":"___ Thames flows through London.","task":"","ans":["The"],"note":"Реки — с **the**."},{"q":"It's ___ best film I've ever seen.","task":"","ans":["the"],"note":"Превосходная степень — **the**."},{"q":"Can you play ___ guitar?","task":"","ans":["the"],"note":"Музыкальные инструменты — **the**."},{"q":"There's ___ university in our town — the only one in the region.","task":"","ans":["a"],"note":"Впервые упомянутый; university начинается со звука /j/ — **a**."},{"q":"He spent a year in ___ USA.","task":"","ans":["the"],"note":"Страны-союзы — **the USA, the UK**."},{"q":"Have you got ___ umbrella I could borrow?","task":"","ans":["an"],"note":"Один из многих, гласный звук — **an**."},{"q":"I'll meet you at ___ station where we arrived yesterday.","task":"","ans":["the"],"note":"Уточнённый, известный — **the**."},{"q":"She's ___ honest person — you can trust her.","task":"","ans":["an"],"note":"**an** перед непроизносимым h: an honest."},{"q":"___ moon looks huge tonight.","task":"","ans":["The"],"note":"Единственный в своём роде — **the**."},{"q":"What ___ beautiful day!","task":"","ans":["a"],"note":"В восклицании What + исчисляемое в ед. ч. — **a**."}]},{"id":"prepositions","grp":"Артикли, предлоги, связки","abbr":"PR","name":"Dependent prepositions","ru":"Предлоги после слов","rule":["Прилагательное + предлог: **good at, interested in, afraid of, keen on, responsible for, aware of, similar to, different from, proud of, fed up with**.","Глагол + предлог: **depend on, apply for, rely on, succeed in, insist on, apologise for, consist of, belong to, complain about, approve of**.","Существительное + предлог: **reason for, increase in, solution to, demand for, advantage of, effect on, attitude to / towards**.","Время: **at** 5 o'clock / at night, **on** Monday / on 5 May, **in** May / in 2020 / in the morning."],"examples":[["She's responsible for the marketing team.","Она отвечает за отдел маркетинга."],["There has been an increase in prices.","Цены выросли."],["It depends on the weather.","Это зависит от погоды."]],"tip":"Предлоги не переводят дословно: «зависеть **от**» — depend **on**, «жениться **на**» — marry (без предлога).","ex":[{"q":"She's very interested ___ modern art.","task":"","ans":["in"],"note":"interested **in**."},{"q":"It all depends ___ the price.","task":"","ans":["on"],"note":"depend **on**."},{"q":"I'm fed up ___ waiting for the bus.","task":"","ans":["with"],"note":"fed up **with**."},{"q":"He applied ___ a job at the bank.","task":"","ans":["for"],"note":"apply **for** a job."},{"q":"There has been a sharp increase ___ the number of tourists.","task":"","ans":["in"],"note":"increase **in**."},{"q":"This book is similar ___ the one I read last year.","task":"","ans":["to"],"note":"similar **to**."},{"q":"She insisted ___ paying for dinner.","task":"","ans":["on"],"note":"insist **on** doing."},{"q":"Who is responsible ___ this mess?","task":"","ans":["for"],"note":"responsible **for**."},{"q":"The team consists ___ five engineers.","task":"","ans":["of"],"note":"consist **of**."},{"q":"There's no easy solution ___ this problem.","task":"","ans":["to"],"note":"solution **to**."}]},{"id":"linking","grp":"Артикли, предлоги, связки","abbr":"LK","name":"Linking words","ru":"Связки: уступка, цель, причина","rule":["Уступка: **although / even though** + предложение; **despite / in spite of** + существительное или -ing.","Противопоставление: **however** (новое предложение, после него запятая); **whereas / while** — сравнение двух фактов.","Цель: **so that** + предложение; **in order to / so as to** + V. Причина: **because of / due to** + существительное; **since / as** + предложение.","Следствие: **therefore, as a result, consequently**. Условие: **in case** (на случай, если), **provided that**."],"examples":[["Despite feeling ill, she went to work.","Несмотря на плохое самочувствие, она пошла на работу."],["I'll take an umbrella in case it rains.","Возьму зонт на случай дождя."],["He saved money so that he could travel.","Он копил деньги, чтобы путешествовать."]],"tip":"**despite** — без of (despite the rain), но **in spite of** the rain. После despite — существительное или -ing, а не целое предложение.","ex":[{"q":"___ the rain, we went for a walk. (несмотря на)","task":"","ans":["Despite","In spite of"],"note":"**despite / in spite of** + существительное."},{"q":"___ it was raining, we went for a walk. (хотя)","task":"","ans":["Although","Though","Even though"],"note":"**although** + предложение."},{"q":"Take a jacket ___ it gets cold later. (на случай)","task":"","ans":["in case"],"note":"**in case** — на случай, если."},{"q":"She spoke slowly ___ that everyone could understand.","task":"","ans":["so"],"note":"**so that** + предложение — цель."},{"q":"The flight was cancelled ___ to bad weather.","task":"","ans":["due"],"note":"**due to** + существительное."},{"q":"My brother loves sport, ___ I prefer reading. (а — сравнение)","task":"","ans":["whereas","while"],"note":"**whereas / while** — сравнение."},{"q":"The plan was risky. ___, it worked. (тем не менее)","task":"","ans":["However","Nevertheless","Still"],"note":"**However** в начале предложения + запятая."},{"q":"He left early in order ___ the traffic. (avoid)","task":"","ans":["to avoid"],"note":"**in order to + V**."},{"q":"Despite ___ tired, she finished the report. (be)","task":"","ans":["being"],"note":"despite + **-ing**."},{"q":"Prices rose sharply; ___, many people stopped travelling. (поэтому)","task":"","ans":["therefore","as a result","consequently"],"note":"Следствие — **therefore / as a result**."}]}];

:"Сравнение через **whereas**."},{"q":"Should people be paid for doing housework?","task":"","ans":["I don't think so, because housework is a shared responsibility. However, the state should support parents who stay at home with small children."],"note":"Уступка: **However…**"},{"q":"Will robots take most of our jobs?","task":"","ans":["Robots will certainly replace some jobs, especially repetitive ones. On the other hand, they will create new professions, so the key is retraining workers."],"note":"Взвесьте **плюсы и минусы**."},{"q":"Is it important to learn a foreign language at school?","task":"","ans":["Absolutely. Speaking another language opens up job opportunities and helps you understand other cultures, which is invaluable in a global world."],"note":"Конкретные аргументы."},{"q":"Should tourists pay extra to visit popular cities?","task":"","ans":["I believe a small tourist tax is fair. Popular cities suffer from overcrowding, and the money could be spent on cleaning and protecting historic sites."],"note":"Предложите **решение**."},{"q":"Are social media good for teenagers?","task":"","ans":["They can be useful for staying in touch and learning, but they also expose teenagers to pressure and unrealistic images. Parents should help them use social media wisely."],"note":"Позиция «**да, но**»."},{"q":"Should public transport be free?","task":"","ans":["I think it would be a great idea. Free buses would reduce traffic and pollution and help people on low incomes. Of course, it would have to be funded by taxes."],"note":"Аргументы + оговорка (**Of course…**)."},{"q":"Is it a good idea to take a gap year before university?","task":"","ans":["It can be, as long as it is well planned. Working or volunteering abroad helps you become more independent and decide what you really want to study."],"note":"Условие: **as long as**."},{"q":"Do we need to own a car nowadays?","task":"","ans":["Not necessarily. In big cities, public transport and car-sharing are often cheaper and more convenient, although a car is still essential in rural areas."],"note":"Оговорка через **although**."}]};
const WRITING = [{"id":"complaint","kind":"Жалоба","grp":"formal","reg":"off","min":140,"max":200,"title":"Complaint about an online order","ru":"Жалоба на интернет-заказ","task":"You ordered a pair of waterproof hiking boots online. They arrived late, in the wrong size, and they are not waterproof. Customer service has not replied to your emails. Write an email of complaint: describe the problems, say what you have already done and what you expect the company to do.","tru":"Вы заказали непромокаемые ботинки: пришли поздно, не того размера и промокают, а поддержка молчит. Напишите жалобу: проблемы, что вы уже сделали и чего ждёте от компании.","pts":["Что, когда и где заказано (номер заказа)","Все проблемы по порядку","Что вы уже предприняли","Чёткое требование и срок"],"phr":[["I am writing to complain about…","Пишу, чтобы пожаловаться на…"],["What is more, …","Более того, …"],["I find this extremely disappointing.","Меня это крайне разочаровывает."],["I would be grateful if you could…","Был бы признателен, если бы вы…"],["I will have no choice but to take the matter further.","Мне придётся предпринять дальнейшие шаги."]],"model":["Dear Sir or Madam,","I am writing to complain about an order I placed on your website on 3 March (order number 58214).","I ordered a pair of hiking boots, which were advertised as waterproof and available for delivery within three working days. However, the parcel arrived ten days later, and the boots were the wrong size. What is more, after a short walk in the rain my feet were completely wet, which suggests that the boots are not waterproof at all.","I have contacted your customer service twice by email, but I have not received any reply, which I find extremely disappointing.","I would therefore be grateful if you could arrange for the boots to be collected and refund the full price of £120, including the delivery charge. If I do not hear from you within fourteen days, I will have no choice but to take the matter further.","I look forward to your prompt reply.","Yours faithfully,\\nAnna Petrova"]},{"id":"enquiry","kind":"Запрос информации","grp":"formal","reg":"off","min":120,"max":180,"title":"Asking about a language course","ru":"Запрос о языковом курсе","task":"You want to take an intensive English course in the UK this summer. Write an email to the language school asking about dates and available places, group size and timetable, accommodation, and the certificate at the end of the course.","tru":"Напишите в языковую школу: спросите о свободных местах, размере группы и расписании, проживании и сертификате.","pts":["Цель письма в первом предложении","3–4 вопроса, сгруппированные по темам","Вежливые косвенные вопросы (could you tell me…)","Официальная концовка"],"phr":[["I am writing to enquire about…","Пишу, чтобы узнать о…"],["Could you tell me whether…?","Не могли бы вы сказать, …ли…?"],["I would also like to know…","Я бы также хотел знать…"],["Thank you in advance for your help.","Заранее благодарю за помощь."],["I look forward to hearing from you.","С нетерпением жду ответа."]],"model":["Dear Sir or Madam,","I am writing to enquire about the intensive English course advertised on your website, which I am interested in taking this summer.","First of all, could you tell me whether there are still places available in July? I would also like to know how many students there are in each group and how many hours of lessons there are per week.","In addition, I would be grateful if you could give me some information about accommodation. Is it possible to stay with a host family, and if so, how much does it cost per week?","Finally, I would like to ask whether the course ends with an exam and whether students receive a certificate.","Thank you in advance for your help. I look forward to hearing from you.","Yours faithfully,\\nDmitry Ivanov"]},{"id":"cover","kind":"Сопроводительное письмо","grp":"formal","reg":"off","min":150,"max":220,"title":"Application for a summer job","ru":"Отклик на летнюю работу","task":"You have seen an advertisement for activity leaders at an international summer camp for children. Write a letter of application: explain why you are interested, describe your relevant experience and skills, and say when you are available.","tru":"Отклик на вакансию вожатого в международном летнем лагере: почему вам интересно, опыт и навыки, когда вы свободны.","pts":["Какую вакансию и где вы увидели","Подходящий опыт с конкретными примерами","Личные качества и навыки (языки, спорт, первая помощь)","Доступность и готовность к собеседованию"],"phr":[["I am writing to apply for the position of…","Пишу, чтобы откликнуться на вакансию…"],["I believe I have the right experience for this job.","Считаю, что у меня подходящий опыт для этой работы."],["This taught me how to…","Это научило меня…"],["I would be happy to attend an interview at any time convenient to you.","С удовольствием приду на собеседование в любое удобное для вас время."],["Yours sincerely,","С уважением (если знаете имя адресата)"]],"model":["Dear Ms Harris,","I am writing to apply for the position of activity leader at Sunshine Summer Camp, which I saw advertised on your website.","I am a 20-year-old student of education, and I believe I have the right experience and personality for this job. Last summer I worked as a volunteer at a children's sports club, where I organised games and supervised groups of up to fifteen children. This taught me how to stay calm, solve conflicts and keep children safe while making sure they have fun.","I am an outgoing and energetic person, and I am good at sports, especially swimming and volleyball. I also have a first aid certificate, which I think would be useful at a camp.","As for languages, I speak Russian and English fluently, and I am currently learning Spanish, so I would feel comfortable working with children from different countries.","I am available from June to the end of August, and I would be happy to attend an interview at any time convenient to you.","Yours sincerely,\\nOlga Smirnova"]},{"id":"apology","kind":"Письмо с извинением","grp":"formal","reg":"semi","min":130,"max":190,"title":"Apologising for a missed meeting","ru":"Извинение за пропущенную встречу","task":"You missed an important meeting with a client yesterday. Write an email to your manager, Mr Brown: apologise, explain what happened, say what you have already done to fix the situation and suggest what you can do next.","tru":"Вы пропустили встречу с клиентом. Напишите руководителю: извинитесь, объясните причину, что уже сделали и что предлагаете дальше.","pts":["Извинение и понимание последствий","Объяснение без оправданий","Что вы уже сделали","Предложение на будущее"],"phr":[["I am writing to apologise for…","Пишу, чтобы извиниться за…"],["I realise how important… was.","Понимаю, насколько важна была…"],["I should have…","Мне следовало…"],["I will make sure this does not happen again.","Я позабочусь о том, чтобы это не повторилось."],["If it would be helpful, I could…","Если это будет полезно, я мог бы…"]],"model":["Subject: Yesterday's meeting with Greenfield Ltd","Dear Mr Brown,","I am writing to apologise for missing yesterday's meeting with Greenfield Ltd. I realise how important it was, and I am very sorry for the inconvenience I caused.","Unfortunately, my train was cancelled because of a signal failure, and I was stuck for nearly two hours without a phone signal, so I was unable to let you know. I should have left earlier, and I will make sure this does not happen again.","This morning I called Ms Lee from Greenfield to apologise personally, and she has kindly agreed to meet us next Tuesday. I have also sent her our presentation so that she can look at it beforehand.","If it would be helpful, I could prepare a short summary of the proposal for you before the meeting.","Once again, I apologise for the situation.","Kind regards,\\nIvan Sokolov"]},{"id":"friend","kind":"Неформальное письмо","grp":"informal","reg":"inf","min":140,"max":190,"title":"Advice to a friend visiting your city","ru":"Советы другу, который едет в ваш город","task":"Your English friend Tom is coming to visit your city in May and has asked for advice. Write an email: suggest what he should see and do, explain how to get around, and tell him what to bring.","tru":"Друг едет в ваш город в мае и просит совета: что посмотреть, как передвигаться, что взять с собой.","pts":["Тёплое неформальное начало","2–3 совета, что посмотреть и сделать","Как передвигаться по городу","Что взять с собой и неформальная концовка"],"phr":[["Great to hear from you!","Рад тебя слышать!"],["If you're into…, … is definitely worth a visit.","Если ты любишь…, … точно стоит посетить."],["I'd recommend…","Я бы посоветовал…"],["Oh, and one more thing — …","И ещё кое-что — …"],["Can't wait to see you!","Не терпится тебя увидеть!"]],"model":["Hi Tom,","Great to hear from you! I'm so glad you're finally coming to visit — you're going to love it here.","You asked what to do while you're in town, so here are a few ideas. First of all, don't miss the old town. It's quite small, so you can easily walk around it in a couple of hours, and there are loads of cosy cafés where you can try the local cakes. If you're into history, the castle museum is definitely worth a visit.","As for getting around, I'd recommend buying a weekly travel card. It's much cheaper than paying for each journey, and the trams run all night at weekends.","Oh, and one more thing — bring a warm jacket! It can get really cold in the evenings, even in May.","Let me know when your flight lands and I'll pick you up from the airport. Can't wait to see you!","Best wishes,\\nMasha"]},{"id":"thanks","kind":"Письмо-благодарность","grp":"informal","reg":"inf","min":130,"max":190,"title":"Thank-you email after a visit","ru":"Благодарность после поездки к друзьям","task":"You have just come back from a week with your English friend's family. Write an email to your friend: thank the family, say what you enjoyed most, mention something funny or memorable, and invite your friend to visit you.","tru":"Вы вернулись из гостей у английской семьи друга. Поблагодарите, расскажите, что больше всего понравилось, вспомните смешной момент и пригласите в гости.","pts":["Благодарность","Что понравилось больше всего (с подробностями)","Смешной или запоминающийся случай","Приглашение в ответ"],"phr":[["I just wanted to say a huge thank you for…","Хотел сказать огромное спасибо за…"],["The best part for me was…","Лучшим для меня было…"],["I'm still laughing about…","Я до сих пор смеюсь над…"],["You must come and visit us…","Обязательно приезжай к нам…"],["Thanks again for everything!","Ещё раз спасибо за всё!"]],"model":["Hi Emma,","I just wanted to say a huge thank you to you and your family for having me last week. I had an amazing time, and I still can't believe how quickly the week went by!","The best part for me was definitely our trip to the seaside. I'd never seen such beautiful cliffs, and the fish and chips on the beach were delicious, even if the seagulls tried to steal them! Please tell your dad that I'm still laughing about his attempt to teach me cricket — I think I need a few more lessons.","I also really appreciated how patient everyone was with my English. I feel much more confident now, especially when I speak on the phone.","You must come and visit us next summer. My parents would love to meet you, and I'll show you all my favourite places in the city.","Thanks again for everything!","Lots of love,\\nKatya"]},{"id":"volunteer","kind":"Эссе-мнение","grp":"essay","reg":"neu","min":180,"max":240,"title":"Should every young person do voluntary work?","ru":"Эссе: должна ли молодёжь быть волонтёрами?","task":"In your English class you have been talking about young people and volunteering. Write an essay: \"Every young person should do some voluntary work.\" Do you agree? Write about: 1) skills and experience, 2) time for studies, 3) your own idea.","tru":"Эссе-мнение: «Каждый молодой человек должен заниматься волонтёрством». Согласны ли вы? Пункты: навыки и опыт, время на учёбу и ваша собственная идея.","pts":["Вступление с вашей позицией","Абзац о навыках и опыте","Абзац о времени на учёбу (контраргумент)","Ваша собственная идея и вывод"],"phr":[["Some people believe that…, and I largely agree with this view.","Некоторые считают, что…, и я во многом с этим согласен."],["Firstly, … What is more, …","Во-первых, … Более того, …"],["On the other hand, …","С другой стороны, …"],["That is why I think…","Именно поэтому я думаю…"],["To sum up, …","Подводя итог, …"]],"model":["Nowadays more and more organisations rely on volunteers. Some people believe that every young person should do voluntary work, and I largely agree with this view, although I do not think it should be compulsory.","Firstly, volunteering helps young people develop skills that are difficult to learn at school. Working in a team, dealing with real problems and communicating with people of different ages all build confidence. What is more, this experience looks impressive on a CV and can help when applying for a first job.","On the other hand, many students already have a heavy workload. Preparing for exams takes a lot of time and energy, and forcing them to volunteer could make them feel stressed rather than motivated. That is why I think a few hours a month is a more realistic goal.","Finally, voluntary work can change the way young people see the world. Helping in a hospital or an animal shelter shows them that their actions really matter, and many continue to volunteer for the rest of their lives.","To sum up, I believe young people should be strongly encouraged to volunteer, as long as it does not affect their studies."]},{"id":"remote","kind":"Эссе «за и против»","grp":"essay","reg":"neu","min":180,"max":240,"title":"Working from home: pros and cons","ru":"Удалённая работа: за и против","task":"Write an essay discussing the advantages and disadvantages of working from home. Give your own opinion in the conclusion.","tru":"Эссе «за и против»: плюсы и минусы удалённой работы, ваше мнение в конце.","pts":["Вступление: тема без готового вывода","Абзац с преимуществами","Абзац с недостатками","Ваше мнение и вывод"],"phr":[["While it offers clear benefits, it also has some serious drawbacks.","Хотя у этого есть очевидные плюсы, есть и серьёзные минусы."],["One of the main advantages is…","Одно из главных преимуществ — …"],["Moreover, … / In addition, …","Кроме того, …"],["However, … is not ideal for everyone.","Однако … подходит не всем."],["All things considered, …","Учитывая всё, …"]],"model":["Since the pandemic, working from home has become normal for millions of people. While it offers clear benefits, it also has some serious drawbacks.","One of the main advantages is the time people save. Without a daily commute, employees can spend more time with their families or simply get more sleep. Moreover, many people find it easier to concentrate at home, away from noisy open-plan offices and constant interruptions. Companies can also save money on office space.","However, working from home is not ideal for everyone. Some people feel isolated and miss the social side of work, such as chatting with colleagues over coffee. In addition, it can be difficult to separate work from private life, especially in a small flat, and many remote workers admit that they end up working longer hours. Young employees may also find it harder to learn from more experienced colleagues.","In my opinion, the best solution is a hybrid model. Spending two or three days at home and the rest in the office allows people to enjoy the flexibility of remote work without losing contact with their team.","All things considered, working from home is here to stay, but it works best in moderation."]},{"id":"technology","kind":"Эссе-мнение","grp":"essay","reg":"neu","min":180,"max":240,"title":"Has technology made life more complicated?","ru":"Эссе: технологии усложнили нам жизнь?","task":"Write an essay: \"Technology has made our lives more complicated, not easier.\" Do you agree? Write about: 1) communication, 2) work, 3) your own idea.","tru":"Эссе-мнение: «Технологии сделали нашу жизнь сложнее, а не проще». Пункты: общение, работа и ваша идея.","pts":["Вступление с позицией","Абзац об общении","Абзац о работе","Ваша идея и вывод"],"phr":[["It is often claimed that…","Часто утверждают, что…"],["Although there is some truth in this, …","Хотя в этом есть доля правды, …"],["When it comes to…","Когда речь заходит о…"],["As far as … is concerned, …","Что касается …, …"],["To conclude, …","В заключение, …"]],"model":["It is often claimed that modern technology, rather than making life simpler, has made it more stressful and complicated. Although there is some truth in this, I believe that, on the whole, technology has made our lives easier.","When it comes to communication, smartphones allow us to stay in touch with friends and family wherever they are. It is true that constant notifications can be distracting, but we can always choose to switch them off. The problem lies not in the technology itself but in how we use it.","As far as work is concerned, technology has removed many boring tasks. Software can calculate, translate and organise information in seconds, which gives people more time for creative work. Admittedly, some workers feel they are expected to be available all the time, but this is a question of company culture rather than technology.","Another advantage is access to services. Today we can book a doctor's appointment, pay bills or study online without leaving home, which is especially important for elderly or disabled people.","To conclude, technology can sometimes be overwhelming, but if we use it sensibly, it makes our lives considerably easier."]},{"id":"seriesreview","kind":"Рецензия","grp":"article","reg":"semi","min":150,"max":210,"title":"Review of a series","ru":"Рецензия на сериал","task":"An international website is asking readers for reviews of a film or series they have watched recently. Write a review: briefly describe the story without spoilers, say what you liked and what you didn't like, and say who would enjoy it.","tru":"Рецензия для международного сайта на недавно просмотренный фильм или сериал: сюжет без спойлеров, что понравилось и что нет, кому подойдёт.","pts":["Цепляющее начало и название","Коротко о сюжете без спойлеров","Сильные и слабые стороны с примерами","Кому рекомендуете"],"phr":[["I'd highly recommend…","Очень рекомендую…"],["The story follows…","Сюжет рассказывает о…"],["What I liked most was…","Больше всего мне понравилось…"],["However, the plot becomes a little predictable…","Однако сюжет становится немного предсказуемым…"],["It will appeal to anyone who…","Это понравится всем, кто…"]],"model":["If you're looking for something to watch this weekend, I'd highly recommend \"The Last Station\", a thriller series that kept me on the edge of my seat for six episodes.","The story follows Maya, a young engineer who discovers that the new metro line she helped to design is not as safe as everyone believes. As she tries to warn the public, she finds herself caught up in a dangerous political scandal.","What I liked most was the acting. The lead actress is incredibly convincing, and the supporting characters are far more than just stereotypes. The series is also beautifully filmed, especially the night scenes in the empty tunnels, which are genuinely creepy.","However, the plot becomes a little predictable towards the end, and the final episode felt rushed, as if the writers had run out of time.","Overall, it's a gripping and intelligent series that will appeal to anyone who enjoys suspense with a touch of social criticism. Just don't start it late at night — you won't be able to stop!"]},{"id":"cafe","kind":"Рецензия","grp":"article","reg":"semi","min":140,"max":200,"title":"Review of a café","ru":"Рецензия на кафе","task":"Write a review of a café or restaurant in your town for an English-language city guide. Describe the place, the food and the service, and say whether you would recommend it.","tru":"Рецензия на кафе или ресторан для англоязычного путеводителя: обстановка, еда, обслуживание и рекомендация.","pts":["Где находится и какая атмосфера","Еда с конкретными блюдами","Обслуживание и цены","Итоговая рекомендация"],"phr":[["Tucked away in…, … is one of the city's best-kept secrets.","Спрятанное в…, … — одно из лучших тайных мест города."],["The first thing you notice is…","Первое, что бросается в глаза, — …"],["It's worth booking a table in advance.","Стоит заранее забронировать столик."],["Prices are reasonable for the quality.","Цены разумные для такого качества."],["All in all, …","В целом, …"]],"model":["Tucked away in a quiet side street near the main square, Café Verde is one of the city's best-kept secrets.","The first thing you notice is the atmosphere. With its wooden tables, plants everywhere and soft jazz in the background, it's the perfect place to relax after a busy day. It can get quite crowded at weekends, though, so it's worth booking a table in advance.","The menu is small but varied, with plenty of vegetarian options. I had the mushroom risotto, which was rich and creamy, and my friend's homemade burger was enormous. For dessert, don't miss the cheesecake — it's absolutely delicious.","The staff are friendly and helpful, although service was a bit slow when we were there. Prices are reasonable for the quality, with most main courses costing around fifteen euros.","All in all, Café Verde is ideal for a relaxed lunch or dinner with friends. I'll definitely be going back."]},{"id":"article","kind":"Статья","grp":"article","reg":"semi","min":150,"max":210,"title":"Article: the best way to learn a language","ru":"Статья: как лучше учить язык","task":"You have seen this announcement in an English-language magazine: \"What is the best way to learn a foreign language? Write an article sharing your experience and tips.\" Write your article.","tru":"Статья в журнал: как лучше всего учить иностранный язык — ваш опыт и советы.","pts":["Заголовок и обращение к читателю","2–3 совета на личном опыте","Живой, но аккуратный стиль","Запоминающаяся концовка"],"phr":[["Have you ever…? You're not alone.","Вы когда-нибудь…? Вы не одиноки."],["The first thing I did was…","Первое, что я сделал, — …"],["At first…, but after a few months…","Сначала…, но через несколько месяцев…"],["I soon realised that…","Вскоре я понял, что…"],["So, if you want to…, don't just…","Так что, если хотите…, не просто…"]],"model":["Learning a language: forget the textbook!","Have you ever studied a language at school for years and still felt tongue-tied when you met a native speaker? You're not alone. I was in exactly the same situation until I changed my approach.","The first thing I did was make the language part of my daily life. Instead of watching series in Russian, I switched to English with subtitles, and later without them. At first I understood very little, but after a few months I was surprised by how much I could follow.","Secondly, I started speaking as often as possible. I joined an online conversation club, and although I was nervous at the beginning, I soon realised that making mistakes is the only way to improve.","Finally, I learned vocabulary in context rather than as long lists of words. Writing down useful phrases from songs and articles helped me remember them much better.","So, if you want to learn a language, don't just study it — live it!"]},{"id":"report","kind":"Отчёт","grp":"report","reg":"off","min":170,"max":240,"title":"Report on the student canteen","ru":"Отчёт о студенческой столовой","task":"The director of your college wants to improve the student canteen. Write a report describing the current situation, explaining the main problems and making recommendations.","tru":"Директор колледжа хочет улучшить столовую. Напишите отчёт: текущее положение, основные проблемы, рекомендации.","pts":["Заголовок и разделы с подзаголовками","Цель отчёта и источник информации","Основные проблемы","Конкретные рекомендации и вывод"],"phr":[["The aim of this report is to…","Цель этого отчёта — …"],["The information is based on…","Информация основана на…"],["Most students said that…","Большинство студентов сказали, что…"],["I would recommend…","Я бы рекомендовал…"],["It would also be a good idea to…","Также было бы хорошо…"]],"model":["Report on the student canteen","Introduction\\nThe aim of this report is to describe the current situation in the college canteen and to suggest how it could be improved. The information is based on a survey of 120 students.","Current situation\\nThe canteen is open from 11 a.m. to 3 p.m. and serves hot meals, sandwiches and drinks. Most students said that the food is reasonably priced and that the staff are friendly.","Main problems\\nHowever, the canteen is extremely crowded at lunchtime, and many students have to wait more than twenty minutes to be served. In addition, there is a limited choice of healthy and vegetarian dishes, which was the most common complaint in the survey. Several students also mentioned that the dining area is noisy and uncomfortable.","Recommendations\\nI would recommend extending the opening hours so that students can eat at different times. It would also be a good idea to introduce a daily vegetarian option and a salad bar. Finally, replacing some of the old furniture would make the space more pleasant.","Conclusion\\nIf these changes are made, the canteen will become a more attractive place to eat and relax."]},{"id":"editor","kind":"Письмо в газету","grp":"formal","reg":"semi","min":160,"max":230,"title":"Letter to the editor: saving a local park","ru":"Письмо в газету: спасти парк","task":"Your local council plans to build a car park on the site of a small park in your neighbourhood. Write a letter to the local newspaper giving your opinion. Include at least two arguments and suggest an const PARTICLES=new Set(["up","down","off","on","out","in","into","over","away","back","through","with","for","about","after","along","around","round","across","apart","by","to","ahead","aside","forward","of","without","at","behind","together"]);

function mkWord(key,raw,ipa,ru,ex,ti){
  let gap=(raw.match(/\[(.+?)\]/)||[])[1]||"";

  return {key,en,hint:(raw.match(/\((.*?)\)/)||[])[1]||"",gap,ipa,ru,ex,ti,

}

function merge(a,b){
  // rs = time of the last reset/replace; progress from a copy that predates it is dropped,
  // so a reset on one device is not undone by another device's old data
  const rs=Math.max(a.rs||0,b.rs||0);
  const [o,n]=(b.st||0)>=(a.st||0)?[a,b]:[b,a];   // settings: the more recently changed copy wins
  const out={w:{}, log:{}, tn:{}, rd:{}, gr:{}, pr:{}, wr:{}, my:{}, set:{...o.set,...(n.set||{})}, v:2, st:Math.max(a.st||0,b.st||0), rs};
  for(const x of [a,b]){
    const fresh=(x.rs||0)>=rs;
    // the learner's own words are content, not progress: a reset keeps them; deleted ones stay as x:1
    for(const k in (x.my||{})){ const v=x.my[k]; if(!out.my[k] || (v.t||0)>(out.my[k].t||0)) out.my[k]=v; }
    for(const f of ["w","wr"]) for(const k in (x[f]||{})){ const v=x[f][k]; if(!fresh && (v.t||0)<=rs) continue; if(!out[f][k] || (v.t||0)>(out[f][k].t||0)) out[f][k]=v; }
    if(!fresh) continue;
    for(const k in (x.log||{})){ const p=out.log[k]||{r:0,ok:0,n:0,u:0}, y=x.log[k]; out.log[k]={r:Math.max(p.r,y.r||0),ok:Math.max(p.ok,y.ok||0),n:Math.max(p.n,y.n||0),u:Math.max(p.u||0,y.u||0)}; }
    // best scores: tenses, stories, grammar topics, practice types
    for(const f of ["tn","rd","gr","pr"]) for(const k in (x[f]||{})) out[f][k]=Math.max(out[f][k]??0,x[f][k]);
  }
  return out;
}

async function pushRemote(force){
  if(!docRef || (!dirty && !force)) return;
  dirty=false;
  try{
    // merge what other devices saved in the meantime instead of overwriting it
    const snap=await docRef.get();
    if(snap.exists){ const r=snap.data(); if(r&&r.json){ S=merge(S,JSON.parse(r.json)); try{localStorage.setItem("b2-state",JSON.stringify(S));}catch(e){} } }
    await docRef.set({json:JSON.stringify(S), at:Date.now()}); syncOn=true;
  }
  catch(e){ dirty=true; syncOn=false; }
  updateSync();
}

function countUp(el,to,suffix=""){
  if(!el) return; if(reduced()){ el.textContent=to+suffix; return; }
  const t0=performance.now(), dur=700;
  const step=t=>{ const p=Math.min(1,(t-t0)/dur); el.textContent=Math.round(to*(1-Math.pow(1-p,3)))+suffix; if(p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

}

  if(mood==="happy") return sk>=2?[`Great job! ${sk} days in a row.`,`Отлично! Уже ${sk} ${plural(sk,"день","дня","дней")} подряд — Коко довольна.`]

  if(mood==="wait") return ["I'm waiting for you! One lesson and I'll be happy.","Жду тебя! Один урок — и я буду счастлива."];
  if(mood==="sad") return ["No lesson yesterday… I'm a little sad.","Вчера урока не было… Мне немножко грустно."];
  if(mood==="sad2") return g?[`I haven't seen you for ${g} days… I miss you.`,`Не видела тебя уже ${g} ${plural(g,"день","дня","дней")}… Очень скучаю.`]

  const cloud=mood!=="sad2"?"":`<g class="cloud"><circle cx="49" cy="-6" r="7" fill="var(--cloud)"/><circle cx="60" cy="-10" r="9" fill="var(--cloud)"/><circle cx="71" cy="-6" r="7" fill="var(--cloud)"/><rect x="49" y="-6" width="22" height="7" rx="3.5" fill="var(--cloud)"/>

// A card keeps: s stage, d due day, l lapses, e ease (1.3–3, how easy this card is for the learner)
// and three skills: r recognition (choose the translation), c recall (type the word), p use (word in a sentence).
const EASE0=2.5;
const SKILL={en2ru:"r",ru2en:"r",type:"c",use:"p",gap:"p"};
function skl(s,f){ return s?.[f] ?? (f==="r"?(s?.s>=2?2:0):f==="c"?(s?.s>=4?2:0):0); }   // older cards: guess from the stage
const isLeech=s=>!!s && (s.l||0)>=3 && (s.e??EASE0)<2.1;   // forgotten again and again
const hardWords=()=>WORDS.filter(w=>isLeech(st(w.key)));
// answer quality 0–5 from correctness, hints, typos and time to answer
function quality(kind,ok,info){
  if(!ok) return info.gave?0:1;
  if(info.hint||info.near) return 3;
  const typed=kind!=="en2ru"&&kind!=="ru2en", ms=info.ms??6000;
  return ms<(typed?8000:3500)?5:ms<(typed?18000:8000)?4:3;
}
function interval(s,q){
  let d=IV[s.s]*((s.e??EASE0)/EASE0)*(q>=5?1.15:q<=3?.7:1);
  if(isLeech(s)) d=Math.min(d*.6,10);   // stubborn words come back sooner
  return Math.max(1,Math.round(d));
}
const SKIPW=new Set(["someone","something","somebody","sb","sth","one's","oneself"]);
function cloze(w){   // the word inside its own example: endings change, so word starts are compared
  if(w._cz!==undefined) return w._cz;
  w._cz=null;
  const pat=norm(w.en).split(" ").filter(x=>x&&!SKIPW.has(x));
  if(!w.ex||!pat.length||pat.length>5) return null;
  const pre=x=>x.length<=3?x:x.length<=5?x.slice(0,x.length-1):x.slice(0,x.length-2);
  const toks=[...w.ex.matchAll(/[A-Za-z']+/g)].map(m=>({t:m[0].toLowerCase(),a:m.index,b:m.index+m[0].length}));
  for(let i=0;i+pat.length<=toks.length;i++){
    if(pat.every((p,j)=>p.length<=3?toks[i+j].t===p:toks[i+j].t.startsWith(pre(p)))){
      const a=toks[i].a, b=toks[i+pat.length-1].b;
      if(b-a>=w.ex.length-2) return null;
      return w._cz={text:w.ex.slice(0,a)+"___"+w.ex.slice(b), ans:w.ex.slice(a,b)};
    }
  }
  return null;
}
function buildQueue(ti, extraNew, keys){
  if(keys) return shuffle(keys).map(k=>({key:k,kind:kindFor(k)}));
  const pool = ti==null?WORDS:WORDS.filter(w=>w.ti===ti);
  // overdue first; within a day the stubborn words first
  const due = shuffle(pool.filter(w=>isDue(w.key))).sort((a,b)=>st(a.key).d-st(b.key).d || (isLeech(st(b.key))-isLeech(st(a.key)))).slice(0,MAXDUE);
  const nNew = extraNew ?? Math.min(newLeftToday(), ti==null?S.set.newPerDay:10);
  let fresh;
  if(ti==null){ // round-robin across themes for variety, the learner's own words first
    const order=[MY_TI,...THEMES.map((_,i)=>i).filter(i=>i!==MY_TI)];
    const by=order.map(i=>WORDS.filter(w=>w.ti===i&&isNew(w.key)));
    fresh=[]; let r=0; while(fresh.length<nNew && by.some(b=>b.length)){ const b=by[r%by.length]; if(b.length) fresh.push(b.shift()); r++; }
  } else fresh=pool.filter(w=>isNew(w.key)).slice(0,nNew);
  const q=due.map(w=>({key:w.key,kind:kindFor(w.key)}));
  // new words: intro now, check a few cards later
  fresh.forEach((w,i)=>{ const pos=Math.min(q.length, Math.floor(i*2.5)); q.splice(pos,0,{key:w.key,kind:"intro"}); });
  return q;
}
// the card type follows the weakest skill: recognise → recall → use in context
function kindFor(k){
  if(S.set.dir==="en") return "en2ru";
  const w=BY[k], s=st(k)||{s:0};
  if(skl(s,"r")<2) return s.s>=1&&Math.random()<.3?"ru2en":"en2ru";
  if(skl(s,"c")<2) return s.s<=2?"ru2en":"type";
  if(w.gap) return Math.random()<.65?"gap":"type";
  if(cloze(w) && (skl(s,"p")<2 || Math.random()<.5)) return "use";
  return Math.random()<.6?"type":"ru2en";
}
function startSession(ti,extraNew,drill,keys){
  rebuildMy();
  let q;
  if(drill){ const pool=WORDS.filter(w=>w.ti===ti); q=shuffle(pool).slice(0,20).map(w=>({key:w.key,kind:S.set.dir==="en"?"en2ru":["en2ru","ru2en","type"][Math.floor(Math.random()*3)]})); }
  else q=buildQueue(ti,extraNew,keys);
  if(!q.length){ toast("Сейчас нечего повторять"); return; }
  session={q,i:0,ti,drill,hard:!!keys,ok:0,bad:0,failed:new Set(),seen:new Set(),answered:false,total:q.length};
  render(); window.scrollTo(0,0);
}
function grade(key,ok,info={}){
  if(session.drill){ ok?session.ok++:session.bad++; const lg=L(); lg.r++; if(ok) lg.ok++; persist(); return; }
  const now=Date.now(), t=today(); const s=S.w[key]||{s:0,d:t,l:0};
  const kind=info.kind||"en2ru", f=SKILL[kind]||"r", q=quality(kind,ok,info);
  s.e=Math.round(Math.min(3,Math.max(1.3,(s.e??EASE0)+.1-(5-q)*(.08+(5-q)*.02)))*100)/100;
  if(ok){
    s[f]=Math.min(5,skl(s,f)+1);
    if(session.failed.has(key)) s.d=t+interval(s,3);   // relearned after a mistake: keep the lowered stage
    else { if(q>=4||s.s<3) s.s=Math.min(s.s+1,8); s.d=t+interval(s,q); }
    session.ok++;
  } else {
    s[f]=Math.max(0,skl(s,f)-1); s.l=(s.l||0)+1; s.d=t; session.bad++;
    if(!session.failed.has(key)){   // a mistake costs two stages (not a full restart), once per session
      s.s=Math.max(1,s.s-2);
      // the same task again a few cards later (choice cards come back as recognition)
      session.failed.add(key); session.q.splice(Math.min(session.q.length,session.i+4),0,{key,kind:kind==="ru2en"?"en2ru":kind,retry:true}); session.total++;
    }
  }

}
function introduce(key,known){
  const t=today(); const lg=L(); lg.n++;
  if(known){ S.w[key]={s:4,d:t+IV[4],l:0,t:Date.now()}; }
  else { S.w[key]={s:0,d:t,l:0,t:Date.now()}; session.q.splice(Math.min(session.q.length,session.i+4),0,{key,kind:"en2ru"}); session.total++; }
  persist();
}
// wrong options: same theme first; never a synonym of the answer or of each other
function distractors(w,n=3){
  const out=[], fits=x=>x.key!==w.key&&!clash(w,x)&&!out.some(y=>clash(x,y));
  for(const pool of [WORDS.filter(x=>x.ti===w.ti),WORDS.filter(x=>x.ti!==w.ti)])
    for(const x of shuffle(pool)){ if(out.length>=n) return out; if(fits(x)) out.push(x); }
  return out;
}
// a typed answer that is another word with the same meaning → not a mistake, ask for the intended one
function synonymOf(w,ans){
  const a=norm(ans); if(!a||a===norm(w.en)) return null;
  return WORDS.find(x=>x.key!==w.key&&norm(x.en)===a&&clash(w,x))||null;
}
function norm(s){ return s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z' &-]/g,"").replace(/\s+/g," ").trim(); }
const plain=s=>s;   // shared code with the Polish trainer: no letters to strip here
function lev(a,b){ const m=a.length,n=b.length; const d=Array.from({length:m+1},(_,i)=>[i]); for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }

// collocations that contain this word ("decision" → "make a decision", "tough decision")
function collFor(w){
  if(w._co) return w._co;
  if(w.gap) return w._co=[];
  const toks=norm(w.en).split(" ").filter(t=>t.length>=4);
  if(!toks.length||toks.length>2) return w._co=[];
  const x=toks[0], pre=x.length>=6?x.slice(0,x.length-2):x.length===5?x.slice(0,4):x;
  return w._co=COLLS.filter(c=>norm(c.en).split(" ").some(t=>x.length>=5?t.startsWith(pre):t===x)).slice(0,4);
}
function collHTML(w){
  const c=collFor(w); if(!c.length) return "";
  return `<div class="colls"><span class="why-h">Сочетания</span>${c.map(x=>`<div class="small"><b>${esc(x.en)}</b> — <span class="muted">${esc(x.ru)}</span></div>`).join("")}</div>`;
}
const diaHTML=()=>"", bindDia=()=>{};   // Polish letters are only needed in the Polish trainer
function renderStudy(){

  const T=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) T[i][j]=a[i]===bn[j]?T[i+1][j+1]+1:Math.max(T[i+1][j],T[i][j+1]);
  const out=[]; let i=0,j=0;
  while(j<m){ if(i<n&&a[i]===bn[j]){ out.push(esc(b[j])); i++; j++; } else if(i<n&&T[i+1][j]>=T[i][j+1]) i++; else { out.push(`<ins>${esc(b[j])}</ins>`); j++; } }
  return {html:out.join(" "),score:T[0][0]/Math.max(1,m)};

const INF_RE=/\b(gonna|wanna|gotta|kinda|hey|guys|stuff|awesome|cool|kids|loads of|super|okay|ok|yeah|thanks a lot|cheers)\b/gi;
const CONTR_RE=/\b(I'm|I've|I'd|I'll|don't|doesn't|didn't|can't|won't|isn't|aren't|wasn't|weren't|it's|that's|we're|they're|you're|haven't|hasn't|wouldn't|couldn't|shouldn't)\b/gi;
const LINKERS=["firstly","secondly","finally","however","moreover","furthermore","in addition","what is more","on the other hand","therefore","as a result","consequently","although","even though","whereas","while","despite","in spite of","in conclusion","to sum up","all things considered","for example","for instance","such as","because","since","nevertheless","as far as","when it comes to","overall"];

function localChecks(w,text){
  const out=[], n=wcount(text), low=text.toLowerCase(), letter=w.grp==="formal"||w.grp==="informal";
  out.push(n<w.min?["no",`Мало слов: ${n} (нужно ${w.min}–${w.max})`]:n>w.max*1.15?["mid",`Много слов: ${n} (нужно ${w.min}–${w.max})`]:["ok",`Объём в норме: ${n} слов`]);
  if(letter&&!/^\s*(subject:.*\n\s*)?(dear|hi|hello)\b/i.test(text)) out.push(["mid","Нет обращения в начале: Dear Sir or Madam, / Dear Ms Smith, / Hi Tom,"]);
  if(w.reg==="off"||w.reg==="semi"){
    if(letter&&!/yours (faithfully|sincerely)|kind regards|best regards|regards/i.test(low)) out.push(["mid","Нет концовки письма: Yours faithfully / Yours sincerely / Kind regards"]);
    if(/dear sir or madam/i.test(low)&&/yours sincerely/i.test(low)) out.push(["mid","После Dear Sir or Madam пишут Yours faithfully, а не Yours sincerely"]);
    if(/dear (mr|ms|mrs|miss|dr)\b/i.test(low)&&/yours faithfully/i.test(low)) out.push(["mid","Если адресат назван по имени (Dear Ms Harris), концовка — Yours sincerely"]);
    const inf=[...new Set((text.match(INF_RE)||[]).map(x=>x.toLowerCase()))];
    if(inf.length) out.push(["no",`Разговорные слова в ${w.reg==="off"?"официальном":"полуофициальном"} тексте: ${inf.slice(0,6).join(", ")}`]);
  }
  if(w.reg==="off"||w.reg==="neu"){
    const c=[...new Set((text.match(CONTR_RE)||[]).map(x=>x.toLowerCase()))];
    if(c.length) out.push(["mid",`Сокращения в официальном тексте: ${c.slice(0,6).join(", ")} — лучше полные формы (I am, do not)`]);
  }
  if(w.reg==="inf"&&/dear sir or madam|yours faithfully/i.test(low)) out.push(["mid","Для неформального письма формулы слишком официальные"]);
  if(/(^|[\s(])i(?=[\s',.!?])/.test(text)) out.push(["no","Местоимение I всегда пишется с заглавной буквы"]);
  const links=LINKERS.filter(l=>new RegExp(`\\b${l}\\b`).test(low));
  out.push(links.length>=3?["ok",`Связки: ${links.slice(0,6).join(", ")}`]:["mid",`Мало связок (${links.length}). Добавьте: firstly, however, what is more, on the other hand, therefore…`]);
  const cnt={}; for(const m of low.matchAll(/[a-z]{5,}/g)) if(!STOPW.has(m[0])) cnt[m[0]]=(cnt[m[0]]||0)+1;
  const rep=Object.entries(cnt).filter(([,c])=>c>=4).sort((a,b)=>b[1]-a[1]);
  if(rep.length) out.push(["mid",`Повторы: ${rep.slice(0,4).map(([k,c])=>`${k} ×${c}`).join(", ")} — замените синонимами или местоимениями`]);
