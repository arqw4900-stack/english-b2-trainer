  if(long) out.push(["mid",`Очень длинные предложения (больше 35 слов): ${long}. Разбейте их`]);

}

  const errors=(Array.isArray(r?.errors)?r.errors:[]).filter(e=>e&&e.wrong).slice(0,25).map(e=>({cat:String(e.cat||"grammar").toLowerCase(),wrong:String(e.wrong),fix:String(e.fix||""),why:String(e.why||"")}));

function markErrors(text,errs){
  const spans=[];
  errs.forEach((e,i)=>{ const f=e.wrong; if(!f) return;
    for(const [hay,needle] of [[text,f],[text.toLowerCase(),f.toLowerCase()]]){ let k, from=0;
      while((k=hay.indexOf(needle,from))>=0){ if(!spans.some(s=>k<s.b&&k+f.length>s.a)){ spans.push({a:k,b:k+f.length,i,c:(ECAT[e.cat]||ECAT.grammar)[1]}); return; } from=k+1; } } });
  spans.sort((p,q)=>p.a-q.a);
  let out="",p=0; for(const s of spans){ out+=esc(text.slice(p,s.a))+`<mark class="er ${s.c}">${esc(text.slice(s.a,s.b))}<sup>${s.i+1}</sup></mark>`; p=s.b; }
  return (out+esc(text.slice(p))).replace(/\n/g,"<br>");
}

async function wCheck(id,stage){
  const w=WB[id], ta=$(stage===1?"#wt":"#wt2"), btn=$(stage===1?"#wCheck":"#wCheck2"), text=ta.value.trim(), n=wcount(text);
  if(n<Math.round(w.min*.6)){ toast(`Пока коротко: ${n} ${plural(n,"слово","слова","слов")}, нужно ${w.min}–${w.max}`); return; }
  if(aiReady()){
    btn.disabled=true; btn.innerHTML='<span class="spin"></span> Claude читает текст…'; ta.readOnly=true;
    try{
      const fb=normFB(await askAI(writingPrompt(w,text,stage===2?wst(id).fb:null),"default"));
      if(stage===1) wSave(id,{d1:text,d2:text,st:"checked",fb,local:localChecks(w,text)});
      else wSave(id,{d2:text,st:"done",fb2:fb,best:Math.max(wst(id).best||0,fb.score)});
    }catch(e){
      toast(e.message);
      if(view.w===id&&!session&&!tSession&&!pSession){ if(aiReady()){ btn.disabled=false; btn.textContent=stage===1?"Проверить текст":"Сдать исправленный вариант"; ta.readOnly=false; } else render(); }
      return;
    }
  } else if(stage===1) wSave(id,{d1:text,d2:text,st:"checked",fb:{offline:true},local:localChecks(w,text)});
  else { const x=wst(id), got=(x.ticks||[]).filter(Boolean).length; wSave(id,{d2:text,st:"done",best:Math.max(x.best||0,Math.round(got/(w.pts.length+SELF.length)*100))}); }
  const first=stage===2&&lessonDone(); pushRemote();
  if(view.w!==id||session||tSession||pSession) return;
  render(); window.scrollTo(0,0);
  if(stage===2){ toast("Текст засчитан"); if(first) confetti(); }
}
function bindWrite(){

  Object.entries(S.my||{}).filter(([,v])=>!v.x&&v.en&&v.ru).sort((a,b)=>(a[1].c||0)-(b[1].c||0))
    .forEach(([id,v])=>{ const w=mkWord("my:"+id,v.en,"",v.ru,v.ex||"",MY_TI); WORDS.push(w); BY[w.key]=w; });
}

function bindMy(){
  const f=$("#myForm"); if(!f) return;
  const en=$("#myEn"), ru=$("#myRu"), ex=$("#myEx"), msg=$("#myMsg");
  f.onsubmit=e=>{ e.preventDefault();
    const p=en.value.trim().replace(/\s+/g," "), r=ru.value.trim(), x=ex.value.trim();
    if(!p||!r){ msg.textContent="Нужны слово и перевод."; return; }
    const dup=WORDS.find(w=>norm(w.en)===norm(p));
    if(dup&&dup.ti===MY_TI){ msg.textContent="Это слово уже есть в вашем словаре."; return; }
    const id=Date.now().toString(36)+Math.random().toString(36).slice(2,5), now=Date.now();
    S.my[id]={en:p,ru:r,ex:x&&!/[.!?…]$/.test(x)?x+".":x,c:now,t:now}; persist(); rebuildMy();
    toast(dup?`Добавлено. «${dup.en}» есть и в теме «${THEMES[dup.ti].name}»`:"Добавлено в словарь"); render();
  };
  const ai=$("#myAI"); if(ai) ai.onclick=async()=>{
    const p=en.value.trim(); if(!p){ msg.textContent="Сначала напишите слово по-английски."; return; }
    ai.disabled=true; msg.innerHTML='<span class="aibox"><span class="spin"></span>Claude подбирает перевод и пример…</span>';
    try{
      const r=await askAI(`A Russian-speaking learner of English (level B2) is saving this English word or phrase in a personal dictionary: "${p}". Give its base form (correct the spelling if needed), a short Russian translation (1-3 meanings, comma-separated) and one natural English example sentence at B2 level that uses it. Reply with only JSON: {"en":"...","ru":"...","ex":"..."}`,"quick");

      msg.textContent="Проверьте и нажмите «Добавить».";
    }catch(err){ msg.textContent=err.message; }
    ai.disabled=false;
  };
}

// ---------- backup: export / import progress as a JSON file ----------
function lastBackup(){ try{ return +localStorage.getItem("b2-backup")||0; }catch(e){ return 0; } }
function needBackup(){ return !syncOn && Object.keys(S.w).length>=20 && Date.now()-lastBackup()>7*DAY; }
// inside Claude a page can't download by itself: the downloads capability asks the viewer to save the file
let dlCap=null; (async()=>{ try{ if(window.claude?.use) dlCap=await claude.use("downloads"); }catch(e){} })();
async function exportProgress(){
  const name=`english-b2-progress-${dstr(today())}.json`, data=JSON.stringify({app:"english-b2",exported:new Date().toISOString(),...S});
  try{
    if(dlCap) await dlCap.save({filename:name,data});
    else if(window.claude?.use){ toast("Сохранение файлов здесь недоступно"); return; }
    else {   // opened as a local file
      const url=URL.createObjectURL(new Blob([data],{type:"application/json"}));
      const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),5000);
    }
  }catch(e){ if(e?.code!=="declined") toast("Не удалось сохранить файл"); return; }
  try{ localStorage.setItem("b2-backup",String(Date.now())); }catch(e){}
  toast("Сохранено: "+name);
}
async function readBackup(file){
  const d=JSON.parse(await file.text());
  if(!d||d.v!==2||!d.w||typeof d.w!=="object") throw new Error("not a backup");
  return d;
}
function importProgress(d,replace){
  // replace: new rs, so older progress on other devices doesn't come back on sync
  if(replace) S={w:d.w,log:d.log||{},tn:d.tn||{},rd:d.rd||{},gr:d.gr||{},pr:d.pr||{},wr:d.wr||{},my:{...S.my,...(d.my||{})},set:{...S.set,...(d.set||{})},v:2,st:Date.now(),rs:Date.now()};
  else S=merge(S,{...d,rs:S.rs||0});   // per word, the more recent result wins
  persist(); pushRemote(true);
}

  bg.querySelector("#exp").onclick=exportProgress;
  const ib=bg.querySelector("#inst");
  if(ib) ib.onclick=async()=>{ installEvt.prompt(); const {outcome}=await installEvt.userChoice; installEvt=null; close(); toast(outcome==="accepted"?"Приложение установлено":"Установка отменена"); };
  const file=bg.querySelector("#impFile"), zone=bg.querySelector("#impZone");
  bg.querySelector("#imp").onclick=()=>file.click();
  file.onchange=async()=>{
    const f=file.files[0]; file.value=""; if(!f) return;
    let d; try{ d=await readBackup(f); }catch(e){ toast("Это не файл прогресса тренажёра"); return; }
    const n=Object.keys(d.w).length;
    zone.className=""; zone.innerHTML=`<div class="small" style="margin-bottom:8px">В файле прогресс по ${n} ${plural(n,"слову","словам","словам")}${d.exported?` от ${new Date(d.exported).toLocaleDateString("ru-RU")}`:""}. «Объединить» оставит по каждому слову более свежий результат, «Заменить» сотрёт текущий прогресс.</div>
      <div class="row"><button type="button" class="btn primary" id="imM">Объединить</button><button type="button" class="btn bad" id="imR">Заменить</button></div>`;
    zone.querySelector("#imM").onclick=()=>{ importProgress(d,false); close(); toast("Прогресс объединён"); };
    zone.querySelector("#imR").onclick=()=>{ importProgress(d,true); close(); toast("Прогресс заменён"); };
  };
  bg.querySelector("#reset").onclick=()=>{ bg.querySelector("#resetZone").innerHTML=`<div class="small" style="margin-bottom:8px">Удалить прогресс по всем словам, временам, грамматике, практике и текстам? Слова из «Моего словаря» останутся. Это нельзя отменить.</div><div class="row"><button class="btn ghost" id="rn">Отмена</button><button class="btn bad" id="ry">Удалить</button></div>`;
    bg.querySelector("#rn").onclick=close;
    bg.querySelector("#ry").onclick=()=>{ S={w:{},log:{},tn:{},rd:{},gr:{},pr:{},wr:{},my:S.my,set:S.set,v:2,st:S.st,rs:Date.now()}; persist(); pushRemote(true); close(); toast("Прогресс сброшен"); }; };
}

// ---------- bindings ----------
function bind(){
  const on=(sel,fn)=>{ const el=$(sel); if(el) el.onclick=fn; };
  on("#settings",openSettings);
  document.querySelectorAll(".koala").forEach(p=>p.onclick=pokeKoala);
  on("#start",()=>startSession(null));
  on("#extra",()=>startSession(null,10));
  on("#mixTest",()=>startTenseQuiz(null));
  on("#tQuiz",()=>startTenseQuiz(view.tense));
  on("#tStudy",()=>startSession(view.theme,$("#tStudy").dataset.extra?10:null));
  on("#bkNow",()=>{ exportProgress(); render(); });
  on("#tDrill",()=>startSession(view.theme,null,true));
  on("#pMix",()=>startPractice("mix"));
  on("#gMix",()=>startPractice("gmix"));
  on("#gQuiz",()=>startPractice("g:"+view.g));
  on("#hardStudy",()=>startSession(null,null,false,hardWords().slice(0,30).map(w=>w.key)));
  document.querySelectorAll("[data-pt]").forEach(b=>b.onclick=()=>startPractice(b.dataset.pt));
  document.querySelectorAll("[data-gr]").forEach(b=>b.onclick=()=>go({tab:"tense",g:b.dataset.gr}));
  document.querySelectorAll("[data-hard]").forEach(b=>b.onclick=()=>go({tab:"words",hard:1}));
  document.querySelectorAll("[data-go-mail]").forEach(b=>b.onclick=()=>go({tab:"mail"}));
  document.querySelectorAll("[data-wt]").forEach(b=>b.onclick=()=>go({tab:"mail",w:b.dataset.wt}));
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=e=>{ e.preventDefault(); delMy(b.dataset.del); });
  if(view.tab==="words"&&view.theme===MY_TI) bindMy();
  if(view.tab==="mail"&&view.w) bindWrite();
  // data-topic, not data-theme: Claude puts data-theme on <html> for light/dark mode
  document.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>go({tab:"words",theme:+b.dataset.topic}));
  document.querySelectorAll("[data-tense]").forEach(b=>b.onclick=()=>go({tab:"tense",tense:b.dataset.tense}));
  document.querySelectorAll("[data-go-tense]").forEach(b=>b.onclick=()=>go({tab:"tense"}));
  document.querySelectorAll("[data-go-read]").forEach(b=>b.onclick=()=>go({tab:"read"}));
  document.querySelectorAll("[data-story]").forEach(b=>b.onclick=()=>go({tab:"read",story:b.dataset.story}));
  document.querySelectorAll(".gl").forEach(b=>b.onclick=()=>showGloss(b));
  document.querySelectorAll(".q").forEach(q=>q.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answerQ(q,b)));
  document.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>go({tab:view.tab}));
  const q=$("#q");
  if(q) q.oninput=()=>{ const v=q.value.trim().toLowerCase();
    $("#themeList").hidden=!!v;
    $("#results").innerHTML=v?wordRows(WORDS.filter(w=>w.en.toLowerCase().includes(v)||w.ru.toLowerCase().includes(v)).slice(0,60)):""; };
}
render();
</script>

</body></html>
