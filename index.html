<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>English B2 Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400&family=Literata:wght@400;600&display=swap">
<style>
/* Layout: phone-first single column, fixed bottom tab bar, one task on screen at a time.
   Look: a study notebook — ruled paper, fountain-pen blue ink, highlighter marks for progress. */
:root{
  --bg:#f2f5f9; --surface:#ffffff; --raise:#eef2f7; --ink:#172238; --muted:#5b687e; --line:#dce3ec; --rule:#e6edf6;
  --primary:#2d5bd7; --on-primary:#ffffff; --accent-soft:#e4ecff;
  --hl:#ffe46b; --hl-soft:#fff6cc; --hl-good:#a8eec6; --learning:#e5ad06;
  --good:#1a9862; --good-soft:#dbf5e7; --bad:#d4453a; --bad-soft:#fde7e3;
  --toast:#172238; --toast-ink:#ffffff; --scrim:rgba(14,21,34,.45);
  --shadow:0 1px 2px rgba(23,34,56,.05),0 8px 20px -10px rgba(23,34,56,.18);
  --bs:85%; --bl:93%; --ts:55%; --tl:34%;
  --display:"Unbounded",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,sans-serif;
  --read:"Literata",Georgia,"Times New Roman",serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --r:18px; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1522; --surface:#162032; --raise:#1d2940; --ink:#e8eef8; --muted:#9ba8be; --line:#2a3750; --rule:#1c273a;
  --primary:#86a6ff; --on-primary:#0e1522; --accent-soft:#1f2c50;
  --hl:rgba(255,213,74,.36); --hl-soft:rgba(255,213,74,.13); --hl-good:rgba(82,208,143,.34); --learning:#e5b93a;
  --good:#52d08f; --good-soft:#143428; --bad:#ff7f72; --bad-soft:#3a1d1e;
  --toast:#e8eef8; --toast-ink:#0e1522; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -10px rgba(0,0,0,.6);
  --bs:38%; --bl:22%; --ts:80%; --tl:78%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1522; --surface:#162032; --raise:#1d2940; --ink:#e8eef8; --muted:#9ba8be; --line:#2a3750; --rule:#1c273a;
  --primary:#86a6ff; --on-primary:#0e1522; --accent-soft:#1f2c50;
  --hl:rgba(255,213,74,.36); --hl-soft:rgba(255,213,74,.13); --hl-good:rgba(82,208,143,.34); --learning:#e5b93a;
  --good:#52d08f; --good-soft:#143428; --bad:#ff7f72; --bad-soft:#3a1d1e;
  --toast:#e8eef8; --toast-ink:#0e1522; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -10px rgba(0,0,0,.6);
  --bs:38%; --bl:22%; --ts:80%; --tl:78%; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(100px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.app{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:500;font-size:1.1rem}
h3{font-size:1rem;font-weight:800}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}
.mt{margin-top:4px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px}
.lvl{display:inline-block;background:var(--hl);color:var(--ink);font-family:var(--display);font-weight:700;font-size:.8rem;padding:2px 8px;border-radius:6px;transform:rotate(-4deg)}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;transition:transform .15s var(--ease),border-color .15s}
.iconbtn:hover{border-color:var(--primary)}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s var(--ease)}
#settings:hover svg{transform:rotate(60deg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
/* highlighter mark: the page's signature, swipes in like a marker stroke */
.mark{background:linear-gradient(var(--hl),var(--hl)) no-repeat 0 88%/100% 45%;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 3px}
/* hero: a ruled notebook page */
.hero{background:var(--surface) repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);border:1px solid var(--line);border-radius:22px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;box-shadow:var(--shadow)}
.hero h2{font-size:1.25rem;line-height:1.4}
.ring{width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .track{stroke:var(--raise)}
.ring .arc{stroke:var(--primary);stroke-linecap:round}
.ring.full .arc{stroke:var(--good)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.1}
.ring .lbl small{display:block;font-family:var(--body);font-weight:600;font-size:.65rem;color:var(--muted)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;grid-column:1/-1}
.stat{background:var(--raise);border-radius:14px;padding:10px;min-width:0}
.stat b{display:flex;align-items:center;gap:5px;font-family:var(--display);font-size:1.15rem;font-weight:700}
.stat b svg{width:16px;height:16px;fill:var(--learning);stroke:none}
.stat span{font-size:.75rem;color:var(--muted)}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;transition:transform .15s var(--ease),box-shadow .2s,border-color .2s,filter .2s}
.btn:active:not([disabled]){transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--on-primary);box-shadow:0 8px 18px -10px var(--primary)}
.btn.primary:hover:not([disabled]){filter:brightness(1.07);box-shadow:0 12px 24px -12px var(--primary)}
.btn.ghost{background:var(--raise);border:1px solid var(--line)}
.btn.ghost:hover:not([disabled]){border-color:var(--primary)}
.btn.bad{background:var(--surface);color:var(--bad);border:2px solid var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none}
.hero .btn{grid-column:1/-1}
.row{display:flex;gap:10px} .row>*{flex:1;min-width:0}
.list{display:flex;flex-direction:column;gap:8px}
.theme{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;width:100%;transition:transform .18s var(--ease),border-color .18s,box-shadow .18s}
.theme:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:var(--shadow)}
.theme:active{transform:scale(.985)}
.badge{--h:220;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.8rem;background:hsl(var(--h) var(--bs) var(--bl));color:hsl(var(--h) var(--ts) var(--tl));transition:transform .25s var(--ease)}
.theme:hover .badge{transform:rotate(-6deg) scale(1.06)}
.badge svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.theme .meta{min-width:0}
.theme .t{font-weight:800;line-height:1.25}
.bar{height:6px;background:var(--raise);border-radius:9px;overflow:hidden;display:flex;margin-top:6px}
.bar i{height:100%;display:block;transition:width .6s var(--ease)}
.chev{color:var(--muted);font-size:1.2rem;transition:transform .18s var(--ease)}
.theme:hover .chev{transform:translateX(3px)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:.75rem;font-weight:700;background:var(--raise);border:1px solid var(--line);white-space:nowrap}
.pill.due{background:var(--hl-soft);border-color:transparent}
.pill.ok{background:var(--good-soft);border-color:transparent}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:4px}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs button{border:0;background:transparent;border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:700;color:var(--muted);transition:color .2s,background-color .2s}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--primary);background:var(--accent-soft)}
/* study */
.study-top{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--primary);border-radius:9px;transition:width .35s var(--ease)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px 20px 26px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;position:relative;min-height:230px;justify-content:center;box-shadow:var(--shadow)}
.card .kind{position:absolute;top:14px;left:16px}
.word{font-family:var(--display);font-weight:500;font-size:clamp(1.6rem,7.5vw,2.4rem);line-height:1.15;overflow-wrap:anywhere}
.word.ru{font-family:var(--body);font-weight:800;font-size:clamp(1.4rem,6.5vw,2rem)}
.ipa{font-family:var(--mono);color:var(--muted);font-size:.95rem}
.trans{font-size:1.2rem;font-weight:800}
.ex{color:var(--muted);font-style:italic;max-width:44ch}
.opts{display:grid;gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;text-align:left;font-weight:600;min-height:54px;overflow-wrap:anywhere;transition:border-color .15s,background-color .15s,transform .15s var(--ease)}
.opt:hover:not([disabled]){border-color:var(--primary);transform:translateY(-1px)}
.opt:active:not([disabled]){transform:scale(.98)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.typein{width:100%;border:2px solid var(--line);border-radius:14px;padding:14px;background:var(--raise);font-size:1.15rem;text-align:center;transition:border-color .15s}
.typein:focus{border-color:var(--primary);outline:0}
.typein.ok{border-color:var(--good)} .typein.no{border-color:var(--bad)}
.fb{border-radius:14px;padding:12px 14px;font-weight:600}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb b{font-family:var(--display);font-weight:500}
.why{margin-top:10px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--ink) 14%,transparent);font-weight:500;line-height:1.5}
.why-h{display:block;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.kbd-hint{font-size:.75rem;color:var(--muted);text-align:center}
/* words list */
.search{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);transition:border-color .15s}
.search:focus{border-color:var(--primary);outline:0}
.wl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wrow{border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow summary{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;padding:11px 14px;cursor:pointer;list-style:none;transition:background-color .15s}
.wrow summary::-webkit-details-marker{display:none}
.wrow summary:hover{background:var(--raise)}
.wrow summary::after{content:"›";color:var(--muted);font-size:1.2rem;transition:transform .2s var(--ease)}
.wrow[open] summary::after{transform:rotate(90deg)}
.wrow .en{font-weight:800}
.wrow .ru{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.exw{padding:0 14px 12px 36px;color:var(--muted);font-style:italic}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.l{background:var(--learning)} .dot.k{background:var(--good)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
/* tenses */
.tgrid-wrap{overflow-x:auto}
.tgrid{display:grid;grid-template-columns:auto repeat(3,minmax(88px,1fr));gap:6px;min-width:340px}
.tgrid .h{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px}
.tgrid .rh{font-size:.72rem;font-weight:700;color:var(--muted);display:flex;align-items:center;padding-right:4px}
.tcell{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 8px;text-align:left;min-height:64px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;transition:transform .18s var(--ease),border-color .18s}
.tcell:hover{transform:translateY(-2px);border-color:var(--primary)}
.tcell b{font-size:.82rem;line-height:1.2}
.tcell .sc{font-size:.72rem;color:var(--muted)}
.tcell.done{border-color:var(--good);background:var(--good-soft)}
.formula{display:grid;gap:6px}
.formula div{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:baseline;background:var(--raise);border-radius:10px;padding:8px 10px}
.formula span{font-family:var(--display);font-weight:700;text-align:center}
.formula code{font-family:var(--mono);font-size:.88rem;overflow-wrap:anywhere}
ul.use{margin:0;padding-left:20px;display:grid;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;border-radius:99px;background:var(--hl-soft);font-size:.85rem;font-weight:600;font-family:var(--mono)}
.exm{padding:10px 0;border-top:1px solid var(--line)}
.exm:first-child{border-top:0}
.tip{background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:.95rem}
.sentence{font-size:1.2rem;font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--primary);margin:0 2px}
.filled{background:linear-gradient(var(--hl-good),var(--hl-good)) no-repeat 0 90%/100% 50%;padding:0 3px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;font-weight:700;color:var(--muted);padding:4px 0;align-self:flex-start;transition:color .15s}
.back:hover{color:var(--ink)}
.back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;transition:transform .18s var(--ease)}
.back:hover svg{transform:translateX(-3px)}
/* reading */
.reader{display:grid;gap:14px;padding:22px 20px}
.reader p{margin:0;font-family:var(--read);font-size:1.1rem;line-height:1.75;max-width:62ch}
.gl{all:unset;cursor:pointer;border-bottom:2px dotted var(--primary);background:linear-gradient(var(--hl),var(--hl)) no-repeat 0 92%/0 50%;transition:background-size .35s var(--ease),background-color .15s}
.gl:hover{background-color:var(--hl-soft)}
.gl.on{background-size:100% 50%}
.gl:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.glpop{position:fixed;z-index:30;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 16px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.glpop b{font-family:var(--read);font-size:1.05rem}
.glpop .iconbtn{width:34px;height:34px}
.readbar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--primary);z-index:25;transition:width .1s linear}
.q{display:grid;gap:8px}
.qt{font-weight:800}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;border-radius:22px 22px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));display:grid;gap:14px;max-height:85vh;overflow:auto}
.field{display:grid;gap:6px}
.seg{display:flex;background:var(--raise);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 4px;font-weight:700;font-size:.9rem;transition:background-color .2s,box-shadow .2s}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.sync{font-size:.75rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.on i{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.done-card{text-align:center;display:grid;gap:12px;justify-items:center}
.big{font-family:var(--display);font-weight:700;font-size:2.4rem;line-height:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--toast);color:var(--toast-ink);padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;font-size:.9rem;max-width:90vw}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;animation:fall 1.5s cubic-bezier(.3,.5,.6,1) both}
@media (min-width:640px){.opts.two{grid-template-columns:1fr 1fr}}
/* motion: decorative only, switched off when the viewer prefers reduced motion */
@media (prefers-reduced-motion:no-preference){
  .app>*{animation:rise .4s var(--ease) both;animation-delay:calc(var(--i,0) * 40ms)}
  .app .list>*{animation:rise .4s var(--ease) both;animation-delay:calc(var(--i,0) * 35ms + 60ms)}
  .app>.card{animation-name:cardIn}
  .mark{animation:swipe .8s .3s var(--ease) both}
  .filled{animation:swipe .5s var(--ease) both}
  .ring .arc{animation:ringIn 1.1s .15s var(--ease) both}
  .opt.right{animation:pop .4s var(--ease)}
  .opt.wrong,.typein.no{animation:shake .4s}
  .fb,#fb .tip{animation:rise .3s var(--ease) both}
  .big{animation:pop .5s var(--ease)}
  .wrow[open] .exw{animation:rise .25s var(--ease)}
  nav.tabs button[aria-current="page"] svg{animation:tabpop .4s var(--ease)}
  .sheet-bg{animation:fade .2s}
  .sheet{animation:sheetUp .32s var(--ease)}
  .toast,.glpop{animation:floatIn .28s var(--ease)}
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateX(24px) rotate(1deg)}to{opacity:1;transform:none}}
@keyframes swipe{from{background-size:0 50%}}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
@keyframes pop{40%{transform:scale(1.04)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes tabpop{40%{transform:translateY(-3px) scale(1.12)}}

 formula:{"+":"I/you/we/they have done · he/she/it has done","−":"I haven't done · she hasn't done","?":"Have you done? · Has she done?"},
 use:["Результат важен сейчас (время не указано)","Жизненный опыт (ever, never)","Действие началось в прошлом и длится до сих пор (for, since)","Только что произошло (just, already, yet)"],
 markers:["ever","never","just","already","yet","for","since","so far","recently","this week"],
 examples:[["I've lost my keys.","Я потерял ключи (и сейчас их нет)."],["Have you ever been to Japan?","Ты когда-нибудь был в Японии?"],["She has lived here since 2015.","Она живёт здесь с 2015 года."]],
 tip:"Если указано точное время в прошлом (yesterday, in 2020, last week) — используйте Past Simple, а не Present Perfect.",
 ex:[
 "I ___ (already / finish) my homework.|have already finished|already finished|had already finished|am already finishing##already — маркер Present Perfect: результат есть сейчас. already ставится между have и третьей формой: have already finished.",
 "___ you ever ___ (be) to London?|Have … been|Did … be|Were … being|Had … been##ever — вопрос о жизненном опыте, значит Present Perfect. «Бывать где-то» = have been to.",
 "She ___ (live) here since 2015.|has lived|lives|lived|is living##since 2015 — действие началось в прошлом и длится до сих пор, поэтому Present Perfect: has lived. По-русски «живёт», но Present Simple здесь ошибка.",
 "They ___ (not / arrive) yet.|haven't arrived|didn't arrive|aren't arriving|hadn't arrived##yet в отрицании — маркер Present Perfect: «ещё не приехали» = haven't arrived.",
 "I ___ (just / see) your brother.|have just seen|just saw|had just seen|just see##just = «только что», это Present Perfect. see — неправильный глагол: see – saw – seen.",
 "We ___ (know) each other for ten years.|have known|know|knew|are knowing##for ten years и до сих пор — Present Perfect. know — глагол состояния, поэтому не Continuous: have known.",
 "He ___ (break) his leg, so he can't walk.|has broken|broke|is breaking|breaks##Важен результат сейчас (он не может ходить), а время не указано — Present Perfect: has broken.",
 "How many books ___ you ___ (read) this year?|have … read|did … read|are … reading|had … read##this year ещё не закончился — Present Perfect: How many books have you read?",
 "I ___ (never / try) sushi.|have never tried|never try|am never trying|had never try##never о жизненном опыте до сегодняшнего дня — Present Perfect: have never tried.",
 "She ___ (lose) her phone yesterday.|lost|has lost|has losing|had lose#pas#Указано время в прошлом (yesterday), значит Past Simple, а не Present Perfect. lose – lost – lost."]},
{id:"ppc",group:"Present",name:"Present Perfect Continuous",ru:"Настоящее совершённое длительное",
 formula:{"+":"I have been working · she has been working","−":"I haven't been working","?":"Have you been working?"},
 use:["Действие длится с прошлого до сейчас (акцент на длительности)","Недавнее длительное действие с видимым результатом"],
 markers:["for","since","all day","how long","lately","recently"],
 examples:[["I've been waiting for an hour.","Я жду уже час."],["She's been crying — her eyes are red.","Она плакала — у неё красные глаза."],["How long have you been learning English?","Как долго ты учишь английский?"]],
 tip:"Present Perfect = результат (I've written 3 letters). Present Perfect Continuous = процесс (I've been writing letters all morning).",
 ex:[
 "I ___ (wait) for you for two hours!|have been waiting|wait|am waiting|waited##for two hours, и ожидание продолжается сейчас. Акцент на длительности — Present Perfect Continuous: have been waiting.",
 "It ___ (rain) all day.|has been raining|rains|is raining|rained##all day — дождь шёл весь день до этого момента, важен процесс: has been raining.",
 "How long ___ you ___ (learn) English?|have … been learning|are … learning|do … learn|did … learn##How long спрашивает, сколько длится действие до сих пор, — Present Perfect Continuous. По-русски «учишь», но в английском не Present Simple.",
 "She's tired because she ___ (run).|has been running|runs|is run|had ran##Видим результат сейчас (устала) от недавнего долгого действия — has been running.",
 "They ___ (work) on this project since March.|have been working|work|are working|worked##since March, и работа ещё идёт — have been working.",
 "Your hands are dirty. What ___ you ___ (do)?|have … been doing|do … do|did … do|are … done##Видим след (грязные руки) недавнего процесса — What have you been doing?",
 "We ___ (not / sleep) well lately.|haven't been sleeping|don't sleep|didn't sleep|aren't sleep##lately — период до сегодняшнего дня, речь о процессе: haven't been sleeping.",
 "He ___ (play) computer games all afternoon.|has been playing|plays|is playing|played##all afternoon — длительность до текущего момента: has been playing.",
 "I ___ (think) about changing jobs recently.|have been thinking|think|thought|am think##recently + процесс, который продолжается. think в значении «обдумывать» может быть в Continuous: have been thinking.",
 "She ___ (teach) for twenty years and she still loves it.|has been teaching|teaches|is teaching|taught##for twenty years, и она преподаёт до сих пор (still) — has been teaching."]},
{id:"pas",group:"Past",name:"Past Simple",ru:"Прошедшее простое",
 formula:{"+":"I worked · I went (неправильные глаголы)","−":"I didn't work · I didn't go","?":"Did you work? · Did you go?"},
 use:["Завершённое действие в прошлом в известное время","Последовательность действий в прошлом","Прошлые привычки"],
 markers:["yesterday","last week","ago","in 2010","when I was a child","then"],
 examples:[["I visited Paris last year.","Я ездил в Париж в прошлом году."],["She got up, had breakfast and left.","Она встала, позавтракала и ушла."],["We didn't see him yesterday.","Мы не видели его вчера."]],
 tip:"После did / didn't глагол всегда в начальной форме: Did you go? (а не Did you went?).",
 ex:[
 "We ___ (go) to Italy last summer.|went|have gone|go|were going##last summer — точное время в прошлом, значит Past Simple. go – went – gone.",
 "She ___ (not / call) me yesterday.|didn't call|hasn't called|doesn't call|didn't called##yesterday — Past Simple. После didn't глагол в начальной форме: didn't call, а не didn't called.",
 "When ___ you ___ (buy) this car?|did … buy|have … bought|do … buy|did … bought##When спрашивает о конкретном моменте в прошлом — Past Simple, а не Present Perfect. После did — начальная форма: buy.",
 "I ___ (meet) him three years ago.|met|have met|meet|had meet##ago — маркер Past Simple. meet – met – met.",
 "He ___ (lose) his wallet on the bus yesterday.|lost|losed|has lose|loses##yesterday — законченное событие в прошлом, Past Simple. lose – lost – lost, формы losed не бывает.",
 "They ___ (be) at home last night.|were|was|have been|are##last night — Past Simple. С they — were, was ставится только с I/he/she/it.",
 "Shakespeare ___ (write) Hamlet.|wrote|has written|writes|was writing##Событие целиком в прошлом (Шекспира давно нет), поэтому Past Simple: write – wrote – written.",
 "I ___ (not / understand) the question, so I asked the teacher.|didn't understand|haven't understand|don't understood|didn't understood##Ситуация в прошлом (потом спросил учителя) — Past Simple: didn't + начальная форма understand.",
 "___ she ___ (enjoy) the party last night?|Did … enjoy|Has … enjoyed|Does … enjoy|Did … enjoyed##last night — вечеринка уже прошла, Past Simple. Вопрос: Did + начальная форма enjoy.",
 "He ___ (come) home, ___ (take) a shower and went to bed.|came … took|has come … took|was coming … was taking|comes … takes##Цепочка действий одно за другим в прошлом — всё в Past Simple: came, took, went."]},
{id:"pac",group:"Past",name:"Past Continuous",ru:"Прошедшее длительное",

 examples:[["I was sleeping when you called.","Я спал, когда ты позвонил."],["At 8 p.m. we were having dinner.","В 8 вечера мы ужинали."],["While she was cooking, he was reading.","Пока она готовила, он читал."]],
 tip:"Длинное действие — Past Continuous, короткое, которое его прервало — Past Simple.",
 ex:[
 "I ___ (watch) TV when the phone rang.|was watching|watched|am watching|have watched##Длинное действие (смотрел ТВ) прервано коротким (зазвонил телефон): длинное — Past Continuous, короткое — Past Simple.",
 "At 9 p.m. yesterday we ___ (have) dinner.|were having|had|have had|are having##Конкретный момент в прошлом (в 9 вечера вчера), ужин был в процессе — were having.",
 "While she ___ (cook), he was cleaning.|was cooking|cooked|cooks|has cooked##While + два параллельных процесса в прошлом — оба в Past Continuous.",
 "What ___ you ___ (do) at midnight? I called, but you didn't answer.|were … doing|did … do|are … doing|have … done##Спрашиваем, что происходило в конкретный момент в прошлом (когда звонили), — What were you doing?",
 "It ___ (rain) when we left the house.|was raining|rained|rains|has rained##Фон в момент события: дождь уже шёл, когда мы вышли, — was raining.",
 "They ___ (not / listen) to the teacher when she explained the rule.|weren't listening|didn't listened|wasn't listening|haven't listen##Процесс в момент объяснения — Past Continuous. С they — weren't, wasn't только для I/he/she/it.",
 "He ___ (drive) home when he saw the accident.|was driving|drove|drives|has driven##Длинное действие (ехал) + короткое событие (увидел аварию) — was driving.",
 "The sun ___ (shine) and the birds were singing.|was shining|shone|shines|has shone##Описание фона, обстановки в прошлом — Past Continuous, как и were singing.",
 "I ___ (walk) in the park when I met Anna.|was walking|walked|am walking|have walked##Процесс (гулял) прерван событием (встретил Анну) — was walking.",
 "When I arrived, she ___ (talk) on the phone.|was talking|talked|talks|has talked##Когда я пришёл, разговор уже шёл — was talking. talked значило бы, что она начала говорить после моего прихода."]},
{id:"pap",group:"Past",name:"Past Perfect",ru:"Прошедшее совершённое",
 formula:{"+":"I/he/they had done","−":"I hadn't done","?":"Had you done?"},

 examples:[["When I arrived, the train had left.","Когда я приехал, поезд уже ушёл."],["She had never seen snow before.","Она никогда раньше не видела снег."],["By 10 p.m. we had finished.","К 10 вечера мы закончили."]],
 tip:"Сравните: When I arrived, the film started (начался при мне) / had started (начался до меня).",
 ex:[
 "When we got to the cinema, the film ___ (start).|had started|started|has started|was start##Фильм начался раньше, чем мы пришли, — «прошлое в прошлом»: had started.",
 "She ___ (never / fly) before that trip.|had never flown|never flew|has never flown|was never flying##before that trip — опыт до момента в прошлом, поэтому Past Perfect. fly – flew – flown.",
 "By the time he arrived, we ___ (eat) everything.|had eaten|ate|have eaten|were eating##By the time + прошлое: действие уже завершилось к тому моменту — had eaten.",
 "I didn't know him because I ___ (not / meet) him before.|hadn't met|didn't meet|haven't met|wasn't meeting##Не встречались раньше того момента в прошлом, когда «не знал», — hadn't met.",
 "___ you ___ (finish) the report before the meeting?|Had … finished|Have … finished|Did … finished|Were … finishing##Встреча — момент в прошлом, спрашиваем, было ли сделано до неё, — Had you finished?",
 "He was sad because he ___ (fail) the exam.|had failed|has failed|fails|was failing##Причина (провалил экзамен) случилась раньше состояния (грустил) — had failed.",

 "The shop ___ (close) when I got there.|had closed|has closed|closes|is closed##Магазин закрылся до того, как я пришёл, — had closed.",
 "They ___ (live) in Paris before they moved to Rome.|had lived|have lived|live|are living##Жизнь в Париже была раньше переезда, который тоже в прошлом, — had lived.",
 "If I ___ (know), I would have helped.|had known|knew|have known|would know##Третий тип условных предложений (нереальное прошлое): If + Past Perfect, would have + третья форма."]},
{id:"papc",group:"Past",name:"Past Perfect Continuous",ru:"Прошедшее совершённое длительное",

 tip:"Это «Present Perfect Continuous, сдвинутый в прошлое»: указывает длительность до момента в прошлом.",
 ex:[
 "She ___ (work) there for ten years before she quit.|had been working|has been working|was working|worked##for ten years до момента в прошлом (уволилась) — длительность: had been working.",
 "His eyes were red — he ___ (cry).|had been crying|has been crying|cried|was cry##След в прошлом (глаза были красными) от долгого действия до этого — had been crying.",
 "We ___ (walk) for hours when we found the village.|had been walking|have been walking|walked|are walking##for hours до момента в прошлом (нашли деревню) — had been walking.",
 "How long ___ you ___ (wait) before the bus came?|had … been waiting|have … been waiting|did … wait|were … waited##How long + до момента в прошлом (пришёл автобус) — had you been waiting.",
 "The ground was wet. It ___ (rain).|had been raining|has been raining|rains|is raining##Земля была мокрой (в прошлом) из-за дождя, который шёл до этого, — had been raining.",

 "He ___ (study) English for two years before he moved to London.|had been studying|has been studying|studies|is studying##for two years до переезда (момент в прошлом) — had been studying.",
 "She was out of breath because she ___ (run).|had been running|has been running|runs|was run##Запыхалась (в прошлом) от бега до этого — had been running. Сравните с настоящим: she's out of breath — she has been running.",
 "By 2020 they ___ (live) together for a decade.|had been living|have been living|lived|are living##By 2020 (момент в прошлом) + for a decade — had been living."]},

 "It's cold. I ___ (close) the window.|'ll close|am closing|close|closed##Решение принято прямо в момент речи (стало холодно) — will: I'll close.",
 "I think it ___ (rain) tomorrow.|will rain|rains|is raining|rained##I think + прогноз-мнение о будущем — will rain.",
 "I promise I ___ (not / tell) anyone.|won't tell|don't tell|am not telling|didn't tell##Обещание — will. Отрицание: won't (= will not) + tell.",
 "___ you ___ (help) me with this box?|Will … help|Do … help|Are … help|Did … help##Просьба о помощи — Will you help me…?",
 "When she ___ (arrive), I'll call you.|arrives|will arrive|arrived|is arrive#ps#После when, if, as soon as в значении будущего ставится Present Simple, а will — только в главной части: When she arrives, I'll call.",

// ---------- state ----------
const DAY=864e5;
function today(){ const d=new Date(); return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/DAY); }
function dstr(n){ return new Date(n*DAY).toISOString().slice(0,10); }
let S = {w:{}, log:{}, tn:{}, rd:{}, set:{newPerDay:15, goal:40, dir:"mix"}, v:2};
try{ const s=JSON.parse(localStorage.getItem("b2-state")||"null"); if(s&&s.v===2) S=merge(S,s); }catch(e){}
function merge(a,b){
  // rs = time of the last reset/replace; progress from a copy that predates it is dropped,
  // so a reset on one device is not undone by another device's old data
  const rs=Math.max(a.rs||0,b.rs||0);
  const [o,n]=(b.st||0)>=(a.st||0)?[a,b]:[b,a];   // settings: the more recently changed copy wins
  const out={w:{}, log:{}, tn:{}, rd:{}, set:{...o.set,...(n.set||{})}, v:2, st:Math.max(a.st||0,b.st||0), rs};
  for(const x of [a,b]){
    const fresh=(x.rs||0)>=rs;
    for(const k in (x.w||{})){ const v=x.w[k]; if(!fresh && (v.t||0)<=rs) continue; if(!out.w[k] || (v.t||0)>(out.w[k].t||0)) out.w[k]=v; }
    if(!fresh) continue;
    for(const k in (x.log||{})){ const p=out.log[k]||{r:0,ok:0,n:0}, y=x.log[k]; out.log[k]={r:Math.max(p.r,y.r||0),ok:Math.max(p.ok,y.ok||0),n:Math.max(p.n,y.n||0)}; }
    for(const k in (x.tn||{})){ out.tn[k]=Math.max(out.tn[k]||0,x.tn[k]); }
    for(const k in (x.rd||{})){ out.rd[k]=Math.max(out.rd[k]??0,x.rd[k]); }
  }
  return out;
}
let dirty=false, saveTimer=null;

// ---------- cloud sync (same progress on phone and computer) ----------
let db=null, docRef=null, syncOn=false;
(async()=>{
  try{
    if(!window.claude?.use) return;
    const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!d||!u) return;
    const id=await u.id(); if(!id) return;
    db=d; docRef=db.doc("data/users/"+id+"/progress");
    const snap=await docRef.get();
    if(snap.exists){ const r=snap.data(); if(r&&r.json){ S=merge(S,JSON.parse(r.json)); try{localStorage.setItem("b2-state",JSON.stringify(S));}catch(e){} } }
    syncOn=true; if(!session && !tSession) render();
    await pushRemote(true);
  }catch(e){ syncOn=false; }
})();
async function pushRemote(force){
  if(!docRef || (!dirty && !force)) return;
  dirty=false;
  try{
    // merge what other devices saved in the meantime instead of overwriting it
    const snap=await docRef.get();
    if(snap.exists){ const r=snap.data(); if(r&&r.json){ S=merge(S,JSON.parse(r.json)); try{localStorage.setItem("b2-state",JSON.stringify(S));}catch(e){} } }
    await docRef.set({json:JSON.stringify(S), at:Date.now()}); syncOn=true;
  }
  catch(e){ dirty=true; syncOn=false; }
  updateSync();
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") pushRemote(); });
function updateSync(){ const el=document.getElementById("sync"); if(el){ el.className="sync"+(syncOn?" on":""); el.lastChild.textContent=syncOn?" синхронизировано":" на этом устройстве"; } }

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function plural(n,one,few,many){ const a=n%10,b=n%100; return a===1&&b!==11?one:a>=2&&a<=4&&(b<12||b>14)?few:many; }
const reduced=()=>{ try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } };
// list items rise one after another
function stagger(root){
  [...root.children].forEach((el,i)=>el.style.setProperty("--i",Math.min(i,8)));
  root.querySelectorAll(".list").forEach(l=>[...l.children].forEach((el,i)=>el.style.setProperty("--i",Math.min(i,12))));
}
function countUp(el,to,suffix=""){
  if(!el) return; if(reduced()){ el.textContent=to+suffix; return; }
  const t0=performance.now(), dur=700;
  const step=t=>{ const p=Math.min(1,(t-t0)/dur); el.textContent=Math.round(to*(1-Math.pow(1-p,3)))+suffix; if(p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function confetti(){
  if(reduced()) return;
  const cols=["#ffe46b","#a8eec6","#2d5bd7","#ff8a7a","#86a6ff"], c=document.createElement("div"); c.className="confetti";
  c.innerHTML=Array.from({length:40},()=>`<i style="left:${(Math.random()*100).toFixed(1)}%;background:${cols[Math.floor(Math.random()*cols.length)]};--dx:${Math.round(Math.random()*160-80)}px;--r:${Math.round(Math.random()*720-360)}deg;animation-delay:${(Math.random()*.3).toFixed(2)}s"></i>`).join("");
  document.body.appendChild(c); setTimeout(()=>c.remove(),2200);
}

// ---------- word stats ----------
const st=k=>S.w[k];
const isDue=k=>{ const s=st(k); return s && s.d<=today(); };   // stage 0 = introduced but not yet checked
const isNew=k=>!st(k);
const isLearned=k=>{ const s=st(k); return s && s.s>=LEARNED; };
function themeStats(ti){
  const ws=ti==null?WORDS:WORDS.filter(w=>w.ti===ti);
  let n=0,l=0,k=0,d=0;
  for(const w of ws){ const s=st(w.key); if(!s) n++; else if(s.s>=LEARNED) k++; else l++; if(isDue(w.key)) d++; }
  return {total:ws.length,new:n,learning:l,learned:k,due:d};
}
function streak(){
  let n=0, t=today();
  if(!(S.log[dstr(t)]?.r>0)) t--;
  while(S.log[dstr(t)]?.r>0){ n++; t--; }
  return n;
}
function newLeftToday(){ return Math.max(0, S.set.newPerDay - (L().n||0)); }

// ---------- STUDY SESSION ----------
function buildQueue(ti, extraNew){
  const pool = ti==null?WORDS:WORDS.filter(w=>w.ti===ti);
  const due = shuffle(pool.filter(w=>isDue(w.key))).sort((a,b)=>st(a.key).d-st(b.key).d).slice(0,MAXDUE);
  const nNew = extraNew ?? Math.min(newLeftToday(), ti==null?S.set.newPerDay:10);
  let fresh;
  if(ti==null){ // round-robin across themes for variety
    const by=THEMES.map((_,i)=>WORDS.filter(w=>w.ti===i&&isNew(w.key)));
    fresh=[]; let r=0; while(fresh.length<nNew && by.some(b=>b.length)){ const b=by[r%by.length]; if(b.length) fresh.push(b.shift()); r++; }
  } else fresh=pool.filter(w=>isNew(w.key)).slice(0,nNew);
  const q=due.map(w=>({key:w.key,kind:kindFor(w.key)}));
  // new words: intro now, check a few cards later
  fresh.forEach((w,i)=>{ const pos=Math.min(q.length, Math.floor(i*2.5)); q.splice(pos,0,{key:w.key,kind:"intro"}); });
  return q;
}
function kindFor(k){
  if(S.set.dir==="en") return "en2ru";
  const s=st(k)?.s||0;
  if(s<=1) return "en2ru"; if(s===2) return "ru2en"; if(s===3) return Math.random()<.5?"en2ru":"ru2en";
  return Math.random()<.6?"type":"ru2en";
}
function startSession(ti,extraNew,drill){
  let q;
  if(drill){ const pool=WORDS.filter(w=>w.ti===ti); q=shuffle(pool).slice(0,20).map(w=>({key:w.key,kind:S.set.dir==="en"?"en2ru":["en2ru","ru2en","type"][Math.floor(Math.random()*3)]})); }
  else q=buildQueue(ti,extraNew);
  if(!q.length){ toast("Сейчас нечего повторять"); return; }
  session={q,i:0,ti,drill,ok:0,bad:0,failed:new Set(),seen:new Set(),answered:false,total:q.length};
  render(); window.scrollTo(0,0);
}
function grade(key,ok){
  if(session.drill){ ok?session.ok++:session.bad++; const lg=L(); lg.r++; if(ok) lg.ok++; persist(); return; }
  const now=Date.now(), t=today(); const s=S.w[key]||{s:0,d:t,l:0};
  if(ok){
    if(session.failed.has(key)) s.d=t+IV[s.s];   // relearned after a mistake: keep the lowered stage
    else { s.s=Math.min(s.s+1,8); s.d=t+IV[s.s]; }
    session.ok++;
  } else {
    s.l=(s.l||0)+1; s.d=t; session.bad++;
    if(!session.failed.has(key)){   // a mistake costs two stages (not a full restart), once per session
      s.s=Math.max(1,s.s-2);
      session.failed.add(key); session.q.splice(Math.min(session.q.length,session.i+4),0,{key,kind:"en2ru",retry:true}); session.total++;
    }
  }
  s.t=now; S.w[key]=s;
  const lg=L(); lg.r++; if(ok) lg.ok++;
  persist();
}
function introduce(key,known){
  const t=today(); const lg=L(); lg.n++;
  if(known){ S.w[key]={s:4,d:t+IV[4],l:0,t:Date.now()}; }
  else { S.w[key]={s:0,d:t,l:0,t:Date.now()}; session.q.splice(Math.min(session.q.length,session.i+4),0,{key,kind:"en2ru"}); session.total++; }
  persist();
}
// wrong options: same theme first; never a synonym of the answer or of each other
function distractors(w,n=3){
  const out=[], fits=x=>x.key!==w.key&&!clash(w,x)&&!out.some(y=>clash(x,y));
  for(const pool of [WORDS.filter(x=>x.ti===w.ti),WORDS.filter(x=>x.ti!==w.ti)])
    for(const x of shuffle(pool)){ if(out.length>=n) return out; if(fits(x)) out.push(x); }
  return out;
}
// a typed answer that is another word with the same meaning → not a mistake, ask for the intended one
function synonymOf(w,ans){
  const a=norm(ans); if(!a||a===norm(w.en)) return null;
  return WORDS.find(x=>x.key!==w.key&&norm(x.en)===a&&clash(w,x))||null;
}
function norm(s){ return s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z' &-]/g,"").replace(/\s+/g," ").trim(); }
function lev(a,b){ const m=a.length,n=b.length; const d=Array.from({length:m+1},(_,i)=>[i]); for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }

function renderStudy(){
  const a=$("#app");
  if(session.i>=session.q.length) return renderDone();
  const it=session.q[session.i], w=BY[it.key];
  const pct=session.i/session.total*100;
  let body="";
  const head=`<div class="study-top"><button class="iconbtn" id="quit" aria-label="Завершить">${ICON.close}</button>
    <div class="prog"><i style="width:${pct}%"></i></div><span class="small muted num">${session.i+1}/${session.total}</span></div>`;
  if(it.kind==="intro"){
    body=`<div class="card"><span class="pill kind">Новое слово</span>
      <div class="word">${esc(w.en)}</div>${w.ipa?`<div class="ipa">[${esc(w.ipa)}]</div>`:""}
      <div class="trans">${esc(w.ru)}</div><div class="ex">${esc(w.ex)}</div></div>
      <div class="row"><button class="btn ghost" id="known">Уже знаю</button><button class="btn primary" id="learn">Учить</button></div>
      <div class="kbd-hint">«Уже знаю» отложит слово на неделю</div>`;
  } else if(it.kind==="en2ru"||it.kind==="ru2en"){
    const en2ru=it.kind==="en2ru", field=en2ru?"ru":"en";
    const opts=shuffle([w,...distractors(w)]);
    session.opts=opts;
    body=`<div class="card"><span class="pill kind">${en2ru?"Выберите перевод":"Как по-английски?"}</span>
      ${en2ru?`<div class="word">${esc(w.en)}</div>${w.ipa?`<div class="ipa">[${esc(w.ipa)}]</div>`:""}`:`<div class="word ru">${esc(w.ru)}</div>`}
      </div>
      <div class="opts two" id="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="muted small num">${i+1}</span>&nbsp; ${esc(o[field])}</button>`).join("")}</div>
      <div id="fb"></div>`;
  } else {
    const nW=w.en.split(" ").length, nL=w.en.replace(/[^a-z]/gi,"").length;
    body=`<div class="card"><span class="pill kind">Напишите по-английски</span>
      <div class="word ru">${esc(w.ru)}</div>${w.hint?`<div class="small muted">(${esc(w.hint)})</div>`:""}
      <div class="small muted">${nW>1?`${nW} ${plural(nW,"слово","слова","слов")} · `:""}${nL} ${plural(nL,"буква","буквы","букв")} · начинается на «${esc(w.en[0])}»</div></div>
      <form id="tf" style="display:grid;gap:10px" autocomplete="off">
        <input class="typein" id="ans" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="ваш ответ">
        <div class="row"><button class="btn ghost" type="button" id="giveup">Не знаю</button><button class="btn primary" type="submit" id="chk">Проверить</button></div>
      </form><div id="fb"></div>`;
  }
  a.innerHTML=head+body;
  $("#quit").onclick=()=>{ session.i>0?renderDone(true):go(view); };
  if(it.kind==="intro"){
    $("#known").onclick=()=>{ introduce(w.key,true); next(); };
    $("#learn").onclick=()=>{ introduce(w.key,false); next(); };
  } else if(it.kind==="type"){
    const inp=$("#ans"); setTimeout(()=>inp.focus({preventScroll:true}),50);
    let done=false;
    const finish=(ans)=>{
      done=true; const a1=norm(ans), t=norm(w.en);
      let ok=a1===t, near=!ok && a1 && t.length>4 && lev(a1,t)===1;
      if(near) ok=true;
      inp.readOnly=true; inp.classList.add(ok?"ok":"no");
      grade(w.key,ok);
      $("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?(near?"Почти! Опечатка: ":"Верно: "):"Правильно: "}<b>${esc(w.en)}</b> ${w.ipa?`<span class="ipa">[${esc(w.ipa)}]</span>`:""}<div class="small muted mt">${esc(w.ex)}</div></div>`;
      $("#giveup").hidden=true; $("#chk").textContent="Дальше"; $("#chk").focus({preventScroll:true});
    };
    $("#tf").onsubmit=e=>{ e.preventDefault(); if(done) return next(); if(!inp.value.trim()) return;
      const syn=synonymOf(w,inp.value);
      if(syn){ $("#fb").innerHTML=`<div class="tip">«${esc(syn.en)}» тоже подходит по смыслу, но здесь загадано другое слово. Попробуйте ещё раз.</div>`; inp.select(); return; }
      finish(inp.value); };
    $("#giveup").onclick=()=>{ if(!done) finish(""); };
  } else {
    const field=it.kind==="en2ru"?"ru":"en";
    const pickOpt=i=>{
      if(session.answered) return; session.answered=true;
      const o=session.opts[i], ok=o.key===w.key;
      document.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; const x=session.opts[+b.dataset.i]; if(x.key===w.key) b.classList.add("right"); });
      if(!ok) document.querySelector(`.opt[data-i="${i}"]`).classList.add("wrong");
      grade(w.key,ok);
      $("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}" style="display:grid;gap:4px">${ok?"Верно!":"Неверно."} <span><b>${esc(w.en)}</b> — ${esc(w.ru)}</span><span class="small muted">${esc(w.ex)}</span></div>
        <button class="btn primary block mt" id="nx">Дальше</button>`;
      $("#nx").onclick=next; $("#nx").focus({preventScroll:true});
      if(ok) session.autoNext=setTimeout(next,1100);
    };
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pickOpt(+b.dataset.i));
    session.keyPick=pickOpt;
  }
}

function startTenseQuiz(id){

function fill(sent,ans){

function glossify(text,gloss){
  const keys=Object.keys(gloss).sort((a,b)=>b.length-a.length);
  const re=new RegExp(`\\b(${keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")})\\b`,"gi");
  return text.split(re).map((part,i)=>{ if(i%2===0) return esc(part);
    const k=keys.find(k=>k.toLowerCase()===part.toLowerCase());
    return `<button type="button" class="gl" data-g="${esc(gloss[k])}">${esc(part)}</button>`; }).join("");

// ---------- backup: export / import progress as a JSON file ----------
function lastBackup(){ try{ return +localStorage.getItem("b2-backup")||0; }catch(e){ return 0; } }
function needBackup(){ return !syncOn && Object.keys(S.w).length>=20 && Date.now()-lastBackup()>7*DAY; }
// inside Claude a page can't download by itself: the downloads capability asks the viewer to save the file
let dlCap=null; (async()=>{ try{ if(window.claude?.use) dlCap=await claude.use("downloads"); }catch(e){} })();
async function exportProgress(){
  const name=`english-b2-progress-${dstr(today())}.json`, data=JSON.stringify({app:"english-b2",exported:new Date().toISOString(),...S});
  try{
    if(dlCap) await dlCap.save({filename:name,data});
    else if(window.claude?.use){ toast("Сохранение файлов здесь недоступно"); return; }
    else {   // opened as a local file
      const url=URL.createObjectURL(new Blob([data],{type:"application/json"}));
      const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),5000);
    }
  }catch(e){ if(e?.code!=="declined") toast("Не удалось сохранить файл"); return; }
  try{ localStorage.setItem("b2-backup",String(Date.now())); }catch(e){}
  toast("Сохранено: "+name);
}
async function readBackup(file){
  const d=JSON.parse(await file.text());
  if(!d||d.v!==2||!d.w||typeof d.w!=="object") throw new Error("not a backup");
  return d;
}
function importProgress(d,replace){
  // replace: new rs, so older progress on other devices doesn't come back on sync
  if(replace) S={w:d.w,log:d.log||{},tn:d.tn||{},rd:d.rd||{},set:{...S.set,...(d.set||{})},v:2,st:Date.now(),rs:Date.now()};
  else S=merge(S,{...d,rs:S.rs||0});   // per word, the more recent result wins
  persist(); pushRemote(true);
}

// ---------- settings ----------
function openSettings(){
  const bg=document.createElement("div"); bg.className="sheet-bg";
  const seg=(name,vals,cur)=>`<div class="seg" data-seg="${name}">${vals.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${String(v)===String(cur)}">${l}</button>`).join("")}</div>`;
  bg.innerHTML=`<div class="sheet" role="dialog" aria-label="Настройки"><div class="top"><h2>Настройки</h2><button class="iconbtn" id="sx" aria-label="Закрыть">${ICON.close}</button></div>
    <div class="field"><span class="small" style="font-weight:700">Новых слов в день</span>${seg("newPerDay",[[5,"5"],[10,"10"],[15,"15"],[20,"20"],[30,"30"]],S.set.newPerDay)}</div>
    <div class="field"><span class="small" style="font-weight:700">Цель ответов в день</span>${seg("goal",[[20,"20"],[40,"40"],[60,"60"],[100,"100"]],S.set.goal)}</div>
    <div class="field"><span class="small" style="font-weight:700">Направление вопросов</span>${seg("dir",[["mix","Смешанное"],["en","Англ → рус"]],S.set.dir)}</div>
    <div class="field"><span class="small" style="font-weight:700">Резервная копия</span>
      <div class="row"><button type="button" class="btn ghost" id="exp">Экспорт</button><button type="button" class="btn ghost" id="imp">Импорт</button></div>
      <input type="file" id="impFile" accept=".json,application/json" hidden>
      <div id="impZone" class="small muted">${syncOn?"Прогресс сохраняется в вашем аккаунте Claude и одинаков на телефоне и компьютере. Файл — запасная копия.":"Прогресс хранится только в этом браузере. Сохраните копию, чтобы не потерять его или перенести на другое устройство."}${lastBackup()?` Последняя копия: ${new Date(lastBackup()).toLocaleDateString("ru-RU")}.`:""}</div></div>
    <div id="resetZone"><button class="btn ghost block" id="reset" style="color:var(--bad)">Сбросить весь прогресс</button></div></div>`;
  document.body.appendChild(bg);
  const close=()=>{ bg.remove(); render(); };
  bg.onclick=e=>{ if(e.target===bg) close(); };
  bg.querySelector("#sx").onclick=close;
  bg.querySelectorAll("[data-seg]").forEach(sg=>sg.onclick=e=>{ const b=e.target.closest("button"); if(!b) return;
    const k=sg.dataset.seg; S.set[k]=isNaN(+b.dataset.v)?b.dataset.v:+b.dataset.v; S.st=Date.now(); persist();
    sg.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b)); });
  bg.querySelector("#exp").onclick=exportProgress;
  const file=bg.querySelector("#impFile"), zone=bg.querySelector("#impZone");
  bg.querySelector("#imp").onclick=()=>file.click();
  file.onchange=async()=>{
    const f=file.files[0]; file.value=""; if(!f) return;
    let d; try{ d=await readBackup(f); }catch(e){ toast("Это не файл прогресса тренажёра"); return; }
    const n=Object.keys(d.w).length;
    zone.className=""; zone.innerHTML=`<div class="small" style="margin-bottom:8px">В файле прогресс по ${n} ${plural(n,"слову","словам","словам")}${d.exported?` от ${new Date(d.exported).toLocaleDateString("ru-RU")}`:""}. «Объединить» оставит по каждому слову более свежий результат, «Заменить» сотрёт текущий прогресс.</div>
      <div class="row"><button type="button" class="btn primary" id="imM">Объединить</button><button type="button" class="btn bad" id="imR">Заменить</button></div>`;
    zone.querySelector("#imM").onclick=()=>{ importProgress(d,false); close(); toast("Прогресс объединён"); };
    zone.querySelector("#imR").onclick=()=>{ importProgress(d,true); close(); toast("Прогресс заменён"); };
  };
  bg.querySelector("#reset").onclick=()=>{ bg.querySelector("#resetZone").innerHTML=`<div class="small" style="margin-bottom:8px">Удалить прогресс по всем словам и временам? Это нельзя отменить.</div><div class="row"><button class="btn ghost" id="rn">Отмена</button><button class="btn bad" id="ry">Удалить</button></div>`;
    bg.querySelector("#rn").onclick=close;
    bg.querySelector("#ry").onclick=()=>{ S={w:{},log:{},tn:{},rd:{},set:S.set,v:2,st:S.st,rs:Date.now()}; persist(); pushRemote(true); close(); toast("Прогресс сброшен"); }; };
}

// ---------- bindings ----------
function bind(){
  const on=(sel,fn)=>{ const el=$(sel); if(el) el.onclick=fn; };
  on("#settings",openSettings);
  on("#start",()=>startSession(null));
  on("#extra",()=>startSession(null,10));
  on("#mixTest",()=>startTenseQuiz(null));
  on("#tQuiz",()=>startTenseQuiz(view.tense));
  on("#tStudy",()=>startSession(view.theme,$("#tStudy").dataset.extra?10:null));
  on("#bkNow",()=>{ exportProgress(); render(); });
  on("#tDrill",()=>startSession(view.theme,null,true));
  // data-topic, not data-theme: Claude puts data-theme on <html> for light/dark mode
  document.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>go({tab:"words",theme:+b.dataset.topic}));
  document.querySelectorAll("[data-tense]").forEach(b=>b.onclick=()=>go({tab:"tense",tense:b.dataset.tense}));
  document.querySelectorAll("[data-go-tense]").forEach(b=>b.onclick=()=>go({tab:"tense"}));
  document.querySelectorAll("[data-go-read]").forEach(b=>b.onclick=()=>go({tab:"read"}));
  document.querySelectorAll("[data-story]").forEach(b=>b.onclick=()=>go({tab:"read",story:b.dataset.story}));
  document.querySelectorAll(".gl").forEach(b=>b.onclick=()=>showGloss(b));
  document.querySelectorAll(".q").forEach(q=>q.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answerQ(q,b)));
  document.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>go({tab:view.tab}));
  const q=$("#q");
  if(q) q.oninput=()=>{ const v=q.value.trim().toLowerCase();
    $("#themeList").hidden=!!v;
    $("#results").innerHTML=v?wordRows(WORDS.filter(w=>w.en.toLowerCase().includes(v)||w.ru.toLowerCase().includes(v)).slice(0,60)):""; };
}
render();
</script>

</body></html>
